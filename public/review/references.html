<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference Sheets Review - FunBookies</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .review-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-md);
    }

    .review-nav-links {
      display: flex;
      gap: var(--space-sm);
    }

    .review-nav a {
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: var(--border-radius);
      transition: all 0.2s;
    }

    .review-nav a:hover {
      background: var(--color-cream);
      color: var(--color-charcoal);
    }

    .review-nav a.active {
      background: var(--color-sage-light);
      color: var(--color-sage-dark);
      font-weight: 600;
    }

    .page-title {
      text-align: center;
      margin-bottom: var(--space-xs);
    }

    .subtitle {
      text-align: center;
      color: var(--color-text-muted);
      margin-bottom: var(--space-lg);
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid var(--color-border);
      background: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--color-sage);
    }

    .filter-btn.active {
      background: var(--color-sage);
      border-color: var(--color-sage);
      color: white;
    }

    .stats {
      text-align: center;
      padding: 15px;
      background: white;
      border-radius: var(--border-radius);
      margin-bottom: var(--space-md);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .stats span {
      margin: 0 12px;
    }

    .stat-found { color: var(--color-sage-dark); }
    .stat-missing { color: var(--color-text-muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-md);
    }

    .card {
      background: white;
      border-radius: var(--border-radius-lg);
      padding: var(--space-md);
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: all 0.2s;
      border: 3px solid transparent;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .card.missing {
      background: #f9f9f9;
      border-color: var(--color-border);
    }

    .reference-image {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--border-radius);
      overflow: hidden;
      background: var(--color-cream);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-sm);
    }

    .reference-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .reference-image.empty {
      border: 2px dashed var(--color-border);
      color: var(--color-text-muted);
      font-size: 0.9rem;
    }

    .book-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .book-level {
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }

    .card-actions {
      margin-top: var(--space-sm);
      display: flex;
      gap: var(--space-xs);
      justify-content: center;
    }

    /* Lightbox for viewing large images */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="review-nav">
      <a href="/review/" style="font-weight: 600;">&larr; Review Hub</a>
      <div class="review-nav-links">
        <a href="/review/books.html">Books</a>
        <a href="/review/covers.html">Covers</a>
        <a href="/review/references.html" class="active">References</a>
        <a href="/review/phoneme-sounds.html">Phonemes</a>
        <a href="/review/letter-sounds.html">Letters</a>
        <a href="/review/word-icons.html">Word Icons</a>
        <a href="/review/activity-icons.html">Activity Icons</a>
      </div>
    </nav>

    <h1 class="page-title">Reference Sheets Review</h1>
    <p class="subtitle">9-panel style reference images for consistent book illustrations</p>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="A">Band A</button>
      <button class="filter-btn" data-filter="B">Band B</button>
      <button class="filter-btn" data-filter="C">Band C</button>
      <button class="filter-btn" data-filter="D">Band D</button>
      <button class="filter-btn" data-filter="missing">Missing</button>
    </div>

    <div class="stats" id="stats">Loading...</div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Reference sheet">
  </div>

  <script>
    let books = [];
    let refStatus = {};
    let currentFilter = 'all';

    async function init() {
      await loadBooks();
      await checkReferences();
      render();

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter = btn.dataset.filter;
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render();
        });
      });
    }

    async function loadBooks() {
      try {
        const response = await fetch('/books/');
        const html = await response.text();
        const matches = html.match(/href="([^"]+\.json)"/g) || [];
        const jsonFiles = matches.map(m => m.match(/href="([^"]+)"/)[1]);

        const loadPromises = jsonFiles.map(async (file) => {
          try {
            const res = await fetch(`/books/${file}`);
            if (res.ok) {
              const data = await res.json();
              return { id: file.replace('.json', ''), ...data };
            }
          } catch (e) {}
          return null;
        });

        const results = await Promise.all(loadPromises);
        books = results.filter(b => b !== null);
        books.sort((a, b) => (a.level || '').localeCompare(b.level || ''));
      } catch (e) {
        console.error('Error loading books:', e);
      }
    }

    async function checkReferences() {
      for (const book of books) {
        const path = `/books/references/${book.id}_reference.png`;
        try {
          const res = await fetch(path, { method: 'HEAD' });
          refStatus[book.id] = res.ok;
        } catch {
          refStatus[book.id] = false;
        }
      }
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function render() {
      const grid = document.getElementById('grid');
      const stats = document.getElementById('stats');

      let filtered = books;
      if (currentFilter === 'missing') {
        filtered = books.filter(b => !refStatus[b.id]);
      } else if (currentFilter !== 'all') {
        filtered = books.filter(b => (b.band || b.level?.charAt(0)) === currentFilter);
      }

      const found = books.filter(b => refStatus[b.id]).length;
      const missing = books.length - found;

      stats.innerHTML = `
        <span class="stat-found">Found: ${found}</span>
        <span class="stat-missing">Missing: ${missing}</span>
        <span>Total: ${books.length}</span>
      `;

      grid.innerHTML = filtered.map(book => {
        const hasRef = refStatus[book.id];
        const refPath = `/books/references/${book.id}_reference.png`;

        return `
          <div class="card ${hasRef ? '' : 'missing'}">
            <div class="reference-image ${hasRef ? '' : 'empty'}"
                 ${hasRef ? `onclick="openLightbox('${refPath}')" style="cursor: pointer;"` : ''}>
              ${hasRef
                ? `<img src="${refPath}" alt="${book.title} reference">`
                : 'No reference'
              }
            </div>
            <div class="book-title">${book.title}</div>
            <div class="book-level">${book.level || 'Unknown'}</div>
            <div class="card-actions">
              <a href="/review/books.html?book=${book.id}" class="btn btn-sm btn-ghost">Details</a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Close lightbox on escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    init();
  </script>
</body>
</html>
