<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Blend It - Funbookies</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #009688 0%, #4DB6AC 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }

    .back-link {
      display: inline-block;
      color: white;
      text-decoration: none;
      margin-bottom: 15px;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .back-link:hover { opacity: 1; text-decoration: underline; }

    .game-card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #009688;
    }

    .score {
      background: #E0F2F1;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      color: #00796B;
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .level-btn {
      padding: 8px 16px;
      border: 2px solid #009688;
      background: white;
      border-radius: 20px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .level-btn:hover, .level-btn.active {
      background: #009688;
      color: white;
    }

    .word-area {
      text-align: center;
      padding: 20px 0;
    }

    .image-hint {
      font-size: 5rem;
      margin-bottom: 20px;
    }

    .segments-display {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .segment {
      width: 80px;
      height: 90px;
      background: #f5f5f5;
      border: 3px solid #ddd;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: #333;
      cursor: pointer;
      transition: all 0.3s;
    }

    .segment:hover {
      border-color: #009688;
      transform: scale(1.05);
    }

    .segment.active {
      background: #009688;
      border-color: #009688;
      color: white;
      transform: scale(1.1);
    }

    .segment.highlight {
      background: #E0F2F1;
      border-color: #009688;
      animation: pulse 0.5s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .blend-arrow {
      display: flex;
      align-items: center;
      font-size: 2rem;
      color: #009688;
    }

    .blended-word {
      font-size: 3.5rem;
      font-weight: 900;
      color: #009688;
      margin-bottom: 25px;
      min-height: 60px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .blended-word.visible {
      opacity: 1;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-sound {
      background: #FF9800;
      color: white;
    }

    .btn-sound:hover {
      background: #F57C00;
    }

    .btn-blend {
      background: #009688;
      color: white;
    }

    .btn-blend:hover {
      background: #00796B;
    }

    .btn-next {
      background: #4CAF50;
      color: white;
    }

    .btn-next:hover {
      background: #43A047;
    }

    .instructions {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 12px;
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ddd;
    }

    .progress-dot.done {
      background: #4CAF50;
    }

    .progress-dot.current {
      background: #009688;
      transform: scale(1.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/activities/" class="back-link">&larr; Back to Activities</a>

    <div class="game-card">
      <div class="header">
        <h1>Blend It</h1>
        <div class="score">Words: <span id="wordCount">0</span></div>
      </div>

      <div class="level-select">
        <button class="level-btn active" data-level="0">CVC</button>
        <button class="level-btn" data-level="1">Blends</button>
        <button class="level-btn" data-level="2">Digraphs</button>
      </div>

      <div class="word-area">
        <div class="image-hint" id="imageHint">🐱</div>

        <div class="segments-display" id="segmentsDisplay"></div>

        <div class="blended-word" id="blendedWord">cat</div>

        <div class="controls">
          <button class="btn btn-sound" onclick="soundOut()">
            <span>🔊</span> Sound Out
          </button>
          <button class="btn btn-blend" onclick="blendWord()">
            <span>➡️</span> Blend It!
          </button>
          <button class="btn btn-next" onclick="nextWord()">
            <span>⏭️</span> Next
          </button>
        </div>

        <div class="instructions" id="instructions">
          Tap each sound, then blend them together!
        </div>

        <div class="progress" id="progress"></div>
      </div>
    </div>
  </div>

  <script>
    const wordBanks = {
      0: [ // CVC
        { word: 'cat', segments: ['c', 'a', 't'], image: '🐱' },
        { word: 'dog', segments: ['d', 'o', 'g'], image: '🐕' },
        { word: 'sun', segments: ['s', 'u', 'n'], image: '☀️' },
        { word: 'hat', segments: ['h', 'a', 't'], image: '🎩' },
        { word: 'pig', segments: ['p', 'i', 'g'], image: '🐷' },
        { word: 'cup', segments: ['c', 'u', 'p'], image: '🥤' },
        { word: 'bed', segments: ['b', 'e', 'd'], image: '🛏️' },
        { word: 'fox', segments: ['f', 'o', 'x'], image: '🦊' },
        { word: 'bus', segments: ['b', 'u', 's'], image: '🚌' },
        { word: 'net', segments: ['n', 'e', 't'], image: '🥅' },
      ],
      1: [ // Blends
        { word: 'frog', segments: ['fr', 'o', 'g'], image: '🐸' },
        { word: 'crab', segments: ['cr', 'a', 'b'], image: '🦀' },
        { word: 'flag', segments: ['fl', 'a', 'g'], image: '🚩' },
        { word: 'drum', segments: ['dr', 'u', 'm'], image: '🥁' },
        { word: 'stop', segments: ['st', 'o', 'p'], image: '🛑' },
        { word: 'swim', segments: ['sw', 'i', 'm'], image: '🏊' },
        { word: 'clap', segments: ['cl', 'a', 'p'], image: '👏' },
        { word: 'grin', segments: ['gr', 'i', 'n'], image: '😁' },
        { word: 'trip', segments: ['tr', 'i', 'p'], image: '✈️' },
        { word: 'snap', segments: ['sn', 'a', 'p'], image: '🫰' },
      ],
      2: [ // Digraphs
        { word: 'ship', segments: ['sh', 'i', 'p'], image: '🚢' },
        { word: 'fish', segments: ['f', 'i', 'sh'], image: '🐟' },
        { word: 'chat', segments: ['ch', 'a', 't'], image: '💬' },
        { word: 'chin', segments: ['ch', 'i', 'n'], image: '🧔' },
        { word: 'shop', segments: ['sh', 'o', 'p'], image: '🏪' },
        { word: 'thin', segments: ['th', 'i', 'n'], image: '📏' },
        { word: 'path', segments: ['p', 'a', 'th'], image: '🛤️' },
        { word: 'chop', segments: ['ch', 'o', 'p'], image: '🪓' },
        { word: 'wish', segments: ['w', 'i', 'sh'], image: '⭐' },
        { word: 'math', segments: ['m', 'a', 'th'], image: '🔢' },
      ]
    };

    // Sound mappings for speech synthesis
    const phonemes = {
      'a': 'ah', 'e': 'eh', 'i': 'ih', 'o': 'oh', 'u': 'uh',
      'sh': 'shh', 'ch': 'chh', 'th': 'thh',
      'fr': 'frr', 'cr': 'crr', 'fl': 'fll', 'dr': 'drr',
      'st': 'stt', 'sw': 'sww', 'cl': 'cll', 'gr': 'grr',
      'tr': 'trr', 'sn': 'snn'
    };

    let currentLevel = 0;
    let currentWord = null;
    let wordIndex = 0;
    let wordsCompleted = 0;
    let roundWords = [];

    document.addEventListener('DOMContentLoaded', () => {
      setupLevelButtons();
      startRound();
    });

    function setupLevelButtons() {
      document.querySelectorAll('.level-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = parseInt(btn.dataset.level);
          startRound();
        });
      });
    }

    function startRound() {
      wordIndex = 0;
      roundWords = [...wordBanks[currentLevel]].sort(() => Math.random() - 0.5).slice(0, 5);
      renderProgress();
      loadWord();
    }

    function loadWord() {
      currentWord = roundWords[wordIndex];
      document.getElementById('imageHint').textContent = currentWord.image;
      document.getElementById('blendedWord').classList.remove('visible');
      document.getElementById('instructions').textContent = 'Tap each sound, then blend them together!';

      renderSegments();
      renderProgress();
    }

    function renderSegments() {
      const container = document.getElementById('segmentsDisplay');
      container.innerHTML = '';

      currentWord.segments.forEach((seg, idx) => {
        const segEl = document.createElement('div');
        segEl.className = 'segment';
        segEl.textContent = seg;
        segEl.onclick = () => playSegment(idx);
        container.appendChild(segEl);
      });
    }

    function renderProgress() {
      const container = document.getElementById('progress');
      container.innerHTML = '';

      for (let i = 0; i < roundWords.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i < wordIndex) dot.classList.add('done');
        if (i === wordIndex) dot.classList.add('current');
        container.appendChild(dot);
      }
    }

    function playSegment(index) {
      const segments = document.querySelectorAll('.segment');
      segments.forEach(s => s.classList.remove('active', 'highlight'));
      segments[index].classList.add('active');

      const seg = currentWord.segments[index];
      speakSound(phonemes[seg] || seg);

      setTimeout(() => {
        segments[index].classList.remove('active');
        segments[index].classList.add('highlight');
      }, 400);
    }

    function soundOut() {
      const segments = document.querySelectorAll('.segment');
      let delay = 0;

      currentWord.segments.forEach((seg, idx) => {
        setTimeout(() => {
          segments.forEach(s => s.classList.remove('active', 'highlight'));
          segments[idx].classList.add('active');
          speakSound(phonemes[seg] || seg);

          setTimeout(() => {
            segments[idx].classList.remove('active');
            segments[idx].classList.add('highlight');
          }, 400);
        }, delay);
        delay += 600;
      });
    }

    function blendWord() {
      document.getElementById('instructions').textContent = 'Great! Now say the whole word!';

      // Animate segments coming together
      const segments = document.querySelectorAll('.segment');
      segments.forEach(s => {
        s.classList.add('highlight');
      });

      // Show blended word
      setTimeout(() => {
        document.getElementById('blendedWord').textContent = currentWord.word;
        document.getElementById('blendedWord').classList.add('visible');
        speakWord(currentWord.word);
      }, 300);
    }

    function nextWord() {
      wordIndex++;
      wordsCompleted++;
      document.getElementById('wordCount').textContent = wordsCompleted;

      if (wordIndex >= roundWords.length) {
        document.getElementById('instructions').textContent = 'Round complete! Starting new round...';
        setTimeout(startRound, 1500);
      } else {
        loadWord();
      }
    }

    function speakSound(sound) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(sound);
        utterance.rate = 0.6;
        utterance.pitch = 1.1;
        speechSynthesis.speak(utterance);
      }
    }

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.rate = 0.7;
        speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
