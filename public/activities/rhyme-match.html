<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Rhyme Match - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header {
      padding-top: var(--space-md);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 {
      font-size: 1.5rem;
    }

    .score-badge {
      background: var(--color-terracotta-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-terracotta-dark);
    }

    .progress-bar-container {
      background: var(--color-border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: var(--space-md);
    }

    .progress-bar {
      height: 100%;
      background: var(--color-terracotta);
      border-radius: 4px;
      transition: width 0.3s;
    }

    .instruction {
      text-align: center;
      font-size: 1rem;
      color: var(--color-text-muted);
      margin-bottom: var(--space-sm);
    }

    .target-word {
      text-align: center;
      margin-bottom: var(--space-md);
    }

    .target-word .label {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      margin-bottom: var(--space-xs);
    }

    .target-word .word {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-weight: 500;
      color: var(--color-terracotta-dark);
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: var(--space-md);
    }

    .choice-btn {
      padding: var(--space-md);
      border: 2px solid var(--color-border);
      background: var(--color-white);
      border-radius: var(--border-radius-lg);
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--color-charcoal);
      cursor: pointer;
      transition: all 0.2s;
    }

    .choice-btn:hover {
      border-color: var(--color-sage);
      transform: scale(1.02);
    }

    .choice-btn.selected {
      border-color: var(--color-sage);
      background: var(--color-sage-light);
    }

    .choice-btn.correct {
      border-color: var(--color-success);
      background: #E8F5E9;
      color: var(--color-success);
    }

    .choice-btn.wrong {
      border-color: var(--color-error);
      background: #FFEBEE;
      color: var(--color-error);
      animation: shake 0.3s;
    }

    .choice-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .feedback {
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 500;
      min-height: 40px;
      margin-bottom: var(--space-sm);
    }

    .feedback.correct { color: var(--color-success); }
    .feedback.wrong { color: var(--color-error); }

    .stats {
      display: flex;
      justify-content: center;
      gap: var(--space-lg);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .stats span {
      font-weight: 700;
      color: var(--color-terracotta);
    }

    .round-complete {
      text-align: center;
      padding: var(--space-lg) 0;
    }

    .round-complete h2 {
      font-family: var(--font-display);
      color: var(--color-sage-dark);
      font-size: 1.75rem;
      margin-bottom: var(--space-sm);
    }

    .round-complete .final-score {
      font-family: var(--font-display);
      font-size: 4rem;
      font-weight: 600;
      color: var(--color-sage);
      margin-bottom: var(--space-md);
    }

    .round-complete p {
      color: var(--color-text-muted);
      margin-bottom: var(--space-md);
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container-narrow">
    <div class="page-header">
      <a href="/activities/" class="back-link">&larr; Back to Activities</a>
    </div>

    <div class="game-card">
      <div id="gameArea">
        <div class="game-header">
          <h1>Rhyme Match</h1>
          <div class="score-badge">Score: <span id="score">0</span></div>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>

        <div class="instruction">Which word rhymes with...</div>

        <div class="target-word">
          <div class="label">Find the rhyme for:</div>
          <div class="word" id="targetWord">cat</div>
        </div>

        <div class="choices" id="choices"></div>

        <div class="feedback" id="feedback"></div>

        <div class="stats">
          <div>Correct: <span id="correctCount">0</span></div>
          <div>Round: <span id="roundNum">1</span>/10</div>
        </div>
      </div>

      <div id="completeArea" class="round-complete hidden">
        <h2>Round Complete!</h2>
        <div class="final-score" id="finalScore">0</div>
        <p>Great job matching rhymes!</p>
        <button class="btn btn-primary btn-lg" onclick="startNewGame()">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    // Rhyme pairs organized by word family
    const rhymeSets = [
      { family: 'at', words: ['cat', 'hat', 'bat', 'mat', 'rat', 'sat', 'pat', 'fat'] },
      { family: 'an', words: ['can', 'man', 'pan', 'fan', 'ran', 'tan', 'van', 'ban'] },
      { family: 'ap', words: ['cap', 'map', 'nap', 'tap', 'lap', 'gap', 'rap', 'zap'] },
      { family: 'ag', words: ['bag', 'tag', 'wag', 'rag', 'flag', 'drag'] },
      { family: 'ig', words: ['pig', 'big', 'dig', 'wig', 'fig', 'jig'] },
      { family: 'in', words: ['pin', 'win', 'tin', 'bin', 'fin', 'chin', 'thin', 'spin'] },
      { family: 'ip', words: ['lip', 'tip', 'dip', 'hip', 'rip', 'sip', 'zip', 'ship', 'chip'] },
      { family: 'it', words: ['sit', 'hit', 'bit', 'fit', 'pit', 'kit', 'lit', 'quit'] },
      { family: 'og', words: ['dog', 'log', 'fog', 'hog', 'jog', 'frog'] },
      { family: 'op', words: ['top', 'hop', 'pop', 'mop', 'cop', 'stop', 'shop', 'drop'] },
      { family: 'ot', words: ['hot', 'pot', 'dot', 'got', 'not', 'lot', 'cot', 'shot'] },
      { family: 'ug', words: ['bug', 'hug', 'mug', 'rug', 'tug', 'dug', 'jug', 'plug'] },
      { family: 'un', words: ['sun', 'run', 'fun', 'bun', 'gun', 'nun', 'spun'] },
      { family: 'ut', words: ['cut', 'but', 'nut', 'hut', 'gut', 'shut'] },
      { family: 'et', words: ['pet', 'wet', 'get', 'set', 'let', 'net', 'bet', 'jet'] },
      { family: 'en', words: ['pen', 'hen', 'ten', 'men', 'den', 'then', 'when'] },
    ];

    let currentRound = 0;
    let score = 0;
    let correctCount = 0;
    let totalRounds = 10;
    let currentQuestion = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', startNewGame);

    function startNewGame() {
      currentRound = 0;
      score = 0;
      correctCount = 0;

      document.getElementById('score').textContent = score;
      document.getElementById('correctCount').textContent = correctCount;
      document.getElementById('gameArea').classList.remove('hidden');
      document.getElementById('completeArea').classList.add('hidden');

      nextRound();
    }

    function nextRound() {
      currentRound++;
      document.getElementById('roundNum').textContent = currentRound;
      document.getElementById('progressBar').style.width = ((currentRound - 1) / totalRounds * 100) + '%';
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';

      if (currentRound > totalRounds) {
        endGame();
        return;
      }

      // Pick a random rhyme set
      const set = rhymeSets[Math.floor(Math.random() * rhymeSets.length)];
      const shuffled = [...set.words].sort(() => Math.random() - 0.5);

      const target = shuffled[0];
      const correct = shuffled[1];

      // Get wrong answers from different families
      const wrongSets = rhymeSets.filter(s => s.family !== set.family);
      const wrongs = [];
      for (let i = 0; i < 3; i++) {
        const wrongSet = wrongSets[Math.floor(Math.random() * wrongSets.length)];
        const wrongWord = wrongSet.words[Math.floor(Math.random() * wrongSet.words.length)];
        if (!wrongs.includes(wrongWord)) {
          wrongs.push(wrongWord);
        }
      }

      currentQuestion = {
        target,
        correct,
        options: [correct, ...wrongs.slice(0, 3)].sort(() => Math.random() - 0.5)
      };

      renderQuestion();
    }

    function renderQuestion() {
      document.getElementById('targetWord').textContent = currentQuestion.target;

      const container = document.getElementById('choices');
      container.innerHTML = '';

      currentQuestion.options.forEach(word => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = word;
        btn.onclick = () => selectAnswer(word, btn);
        container.appendChild(btn);
      });
    }

    function selectAnswer(word, btn) {
      // Disable all buttons
      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

      if (word === currentQuestion.correct) {
        btn.classList.add('correct');
        document.getElementById('feedback').textContent = 'Correct! They both end in -' + getRhymeEnding(word);
        document.getElementById('feedback').className = 'feedback correct';
        score += 10;
        correctCount++;
        document.getElementById('score').textContent = score;
        document.getElementById('correctCount').textContent = correctCount;
      } else {
        btn.classList.add('wrong');
        // Highlight correct answer
        document.querySelectorAll('.choice-btn').forEach(b => {
          if (b.textContent === currentQuestion.correct) {
            b.classList.add('correct');
          }
        });
        document.getElementById('feedback').textContent = `${currentQuestion.target} rhymes with ${currentQuestion.correct}`;
        document.getElementById('feedback').className = 'feedback wrong';
      }

      setTimeout(nextRound, 1500);
    }

    function getRhymeEnding(word) {
      // Find the word family
      for (const set of rhymeSets) {
        if (set.words.includes(word)) {
          return set.family;
        }
      }
      return word.slice(-2);
    }

    function endGame() {
      document.getElementById('gameArea').classList.add('hidden');
      document.getElementById('completeArea').classList.remove('hidden');
      document.getElementById('finalScore').textContent = score;
      document.getElementById('progressBar').style.width = '100%';
    }
  </script>
</body>
</html>
