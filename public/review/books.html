<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Book Review - FunBookies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/shared.css">
    <style>
        body { background: var(--color-cream); }

        .review-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-sm) var(--space-md);
            background: white;
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .review-nav-links { display: flex; gap: var(--space-xs); flex-wrap: wrap; }

        .review-nav a {
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: var(--border-radius);
            transition: all 0.2s;
        }

        .review-nav a:hover { background: var(--color-cream); color: var(--color-charcoal); }
        .review-nav a.active { background: var(--color-sage-light); color: var(--color-sage-dark); font-weight: 600; }

        .main-layout {
            display: grid;
            grid-template-columns: 200px 1fr 280px;
            height: calc(100vh - 52px);
        }

        @media (max-width: 1200px) {
            .main-layout { grid-template-columns: 180px 1fr 260px; }
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .sidebar, .info-panel { display: none; }
        }

        /* Sidebar */
        .sidebar {
            background: white;
            border-right: 1px solid var(--color-border);
            overflow-y: auto;
            padding: var(--space-sm);
        }

        .sidebar h2 {
            font-size: 0.75rem;
            margin-bottom: var(--space-xs);
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 var(--space-xs);
        }

        .band-group { margin-bottom: var(--space-sm); }

        .band-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--color-sage);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px var(--space-xs);
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 2px;
        }

        .story-item {
            padding: 5px var(--space-xs);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .story-item:hover { background: var(--color-cream); }
        .story-item.active { background: var(--color-sage-light); font-weight: 600; }

        .story-item-level {
            font-size: 0.6rem;
            color: var(--color-text-muted);
            font-weight: 500;
            min-width: 24px;
        }

        .story-item-status {
            margin-left: auto;
            font-size: 0.7rem;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            background: var(--color-charcoal);
            position: relative;
        }

        .page-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px var(--space-md);
            background: rgba(0,0,0,0.3);
        }

        .page-nav button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .page-nav button:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
        .page-nav button:disabled { opacity: 0.3; cursor: not-allowed; }

        .page-indicator {
            color: white;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-indicator select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 4px 8px;
            border-radius: var(--border-radius);
            font-size: 0.85rem;
        }

        .page-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: var(--space-sm);
            overflow-y: auto;
            gap: 8px;
        }

        .page-image {
            max-width: 100%;
            max-height: 45vh;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            object-fit: contain;
        }

        .page-text-display {
            background: rgba(255,255,255,0.95);
            color: var(--color-charcoal);
            padding: 8px 16px;
            border-radius: 6px;
            max-width: 600px;
            text-align: center;
            font-size: 1rem;
            line-height: 1.4;
        }

        .prompt-display {
            background: rgba(255,255,255,0.95);
            border-radius: 8px;
            padding: 12px 16px;
            max-width: 600px;
            width: 100%;
        }

        .prompt-display h4 {
            font-size: 0.7rem;
            color: var(--color-sage-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .prompt-display p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--color-charcoal);
            margin: 0;
        }

        .special-page {
            background: var(--color-cream);
            border-radius: 8px;
            padding: var(--space-md);
            max-width: 600px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }

        .special-page h2 {
            color: var(--color-sage);
            margin-bottom: var(--space-md);
        }

        .special-page h3 {
            color: var(--color-terracotta);
            font-size: 0.9rem;
            margin: var(--space-sm) 0 4px;
        }

        .special-page p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--color-charcoal);
        }

        /* Info Panel */
        .info-panel {
            background: white;
            border-left: 1px solid var(--color-border);
            overflow-y: auto;
            padding: var(--space-md);
        }

        .panel-section {
            margin-bottom: var(--space-md);
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--color-border);
        }

        .panel-section:last-child { border-bottom: none; }

        .panel-section h3 {
            font-size: 0.85rem;
            color: var(--color-charcoal);
            margin-bottom: var(--space-sm);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            padding: 4px 0;
        }

        .info-row label { color: var(--color-text-muted); }
        .info-row .value { color: var(--color-charcoal); font-weight: 500; }

        .feedback-buttons {
            display: flex;
            gap: 8px;
        }

        .feedback-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--color-border);
            border-radius: var(--border-radius);
            background: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .feedback-btn:hover { border-color: var(--color-sage); }
        .feedback-btn.selected.approve { background: var(--color-sage-light); border-color: var(--color-sage); }
        .feedback-btn.selected.reject { background: #ffebee; border-color: var(--color-error); }

        .feedback-btn span { font-size: 0.75rem; color: var(--color-text-muted); }

        .notes-input {
            width: 100%;
            height: 80px;
            padding: var(--space-sm);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            font-size: 0.8rem;
            resize: vertical;
            margin-top: var(--space-xs);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: var(--space-sm);
        }

        .action-buttons .btn { flex: 1; font-size: 0.8rem; }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }

        .lightbox.active { display: flex; }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: white;
            font-size: 1.1rem;
            opacity: 0.7;
        }

        /* Book Rating Styles */
        .book-rating-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: var(--space-xs);
        }

        .book-rating-btn {
            flex: 1;
            padding: 8px 4px;
            border: 2px solid var(--color-border);
            border-radius: var(--border-radius);
            background: white;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .book-rating-btn .rating-icon { font-size: 1.1rem; }
        .book-rating-btn span:last-child { color: var(--color-text-muted); }

        .book-rating-btn:hover { transform: translateY(-1px); }

        .book-rating-btn.good:hover,
        .book-rating-btn.good.selected { background: #e8f5e9; border-color: #4caf50; }
        .book-rating-btn.good.selected .rating-icon { color: #4caf50; }

        .book-rating-btn.improve:hover,
        .book-rating-btn.improve.selected { background: #fff3e0; border-color: #ff9800; }
        .book-rating-btn.improve.selected .rating-icon { color: #ff9800; }

        .book-rating-btn.discard:hover,
        .book-rating-btn.discard.selected { background: #ffebee; border-color: #f44336; }
        .book-rating-btn.discard.selected .rating-icon { color: #f44336; }

        .book-notes { height: 60px; }

        .book-rating-status {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-top: 4px;
        }

        .story-item-book-rating {
            font-size: 0.7rem;
            margin-left: auto;
        }

        .story-item-book-rating.good { color: #4caf50; }
        .story-item-book-rating.improve { color: #ff9800; }
        .story-item-book-rating.discard { color: #f44336; }

        /* Summary Modal */
        .summary-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: var(--space-md);
        }

        .summary-modal.active { display: flex; }

        .summary-content {
            background: white;
            border-radius: var(--border-radius-lg);
            max-width: 800px;
            width: 100%;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .summary-header {
            padding: var(--space-md);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-header h2 { margin: 0; font-size: 1.1rem; }

        .summary-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--color-text-muted);
        }

        .summary-body {
            padding: var(--space-md);
            overflow-y: auto;
            flex: 1;
        }

        .summary-section {
            margin-bottom: var(--space-md);
        }

        .summary-section h3 {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: var(--space-sm);
        }

        .summary-section h3 .count {
            background: var(--color-cream);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .summary-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: var(--color-cream);
            border-radius: var(--border-radius);
            font-size: 0.85rem;
        }

        .summary-item .level {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            min-width: 24px;
        }

        .summary-item .notes {
            color: var(--color-text-muted);
            font-size: 0.8rem;
            margin-left: auto;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .summary-footer {
            padding: var(--space-md);
            border-top: 1px solid var(--color-border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .summary-stats {
            display: flex;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
            padding: var(--space-sm);
            background: var(--color-cream);
            border-radius: var(--border-radius);
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-item .stat-label {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
        }

        .stat-item.good .stat-value { color: #4caf50; }
        .stat-item.improve .stat-value { color: #ff9800; }
        .stat-item.discard .stat-value { color: #f44336; }
        .stat-item.unrated .stat-value { color: var(--color-text-muted); }
    </style>
</head>
<body>
    <nav class="review-nav">
        <a href="/review/" style="font-weight: 600;">&larr; Review Hub</a>
        <div class="review-nav-links">
            <a href="/review/books.html" class="active">Books</a>
            <a href="/review/covers.html">Covers</a>
            <a href="/review/references.html">References</a>
            <a href="/review/curriculum.html">Curriculum</a>
            <a href="/review/phoneme-sounds.html">Phonemes</a>
            <a href="/review/letter-sounds.html">Letters</a>
            <a href="/review/word-icons.html">Word Icons</a>
            <a href="/review/activity-icons.html">Activity Icons</a>
        </div>
    </nav>

    <div class="main-layout">
        <div class="sidebar">
            <h2>Books</h2>
            <div id="bookList"></div>
        </div>

        <div class="main-content">
            <div class="page-nav" id="pageNav" style="display: none;">
                <button id="prevBtn" onclick="prevPage()">&larr; Previous</button>
                <div class="page-indicator">
                    <select id="pageSelect" onchange="goToPage(this.value)"></select>
                    <span id="pageLabel"></span>
                </div>
                <button id="nextBtn" onclick="nextPage()">Next &rarr;</button>
            </div>
            <div class="page-view" id="pageView">
                <div class="empty-state">Select a book to begin review</div>
            </div>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="panel-section book-rating-section">
                <h3>Book Rating</h3>
                <div class="book-rating-buttons">
                    <button class="book-rating-btn good" onclick="setBookRating('good')">
                        <span class="rating-icon">✓</span>
                        <span>Good</span>
                    </button>
                    <button class="book-rating-btn improve" onclick="setBookRating('improve')">
                        <span class="rating-icon">↻</span>
                        <span>Improve</span>
                    </button>
                    <button class="book-rating-btn discard" onclick="setBookRating('discard')">
                        <span class="rating-icon">✗</span>
                        <span>Discard</span>
                    </button>
                </div>
                <textarea class="notes-input book-notes" id="bookNotesInput" placeholder="What needs to change? (story, images, etc.)..." onchange="saveBookNotes()"></textarea>
                <div class="book-rating-status" id="bookRatingStatus"></div>
            </div>

            <div class="panel-section">
                <h3>Page Info</h3>
                <div id="pageInfo">
                    <div class="info-row"><label>Book</label><span class="value">-</span></div>
                    <div class="info-row"><label>Level</label><span class="value">-</span></div>
                    <div class="info-row"><label>Page</label><span class="value">-</span></div>
                </div>
            </div>

            <div class="panel-section">
                <h3>Generation Info</h3>
                <div id="genInfo">
                    <div class="info-row"><label>Model</label><span class="value">-</span></div>
                    <div class="info-row"><label>Created</label><span class="value">-</span></div>
                    <div class="info-row"><label>Style</label><span class="value">-</span></div>
                    <div class="info-row"><label>Reference</label><span class="value" id="hasRefValue">-</span></div>
                </div>
            </div>

            <div class="panel-section">
                <h3>Page Feedback</h3>
                <div class="feedback-buttons">
                    <button class="feedback-btn approve" id="approveBtn" onclick="setFeedback('approved')">
                        👍 <span>Good</span>
                    </button>
                    <button class="feedback-btn reject" id="rejectBtn" onclick="setFeedback('rejected')">
                        👎 <span>Redo</span>
                    </button>
                </div>
                <textarea class="notes-input" id="notesInput" placeholder="Notes (optional)..." onchange="saveNotes()"></textarea>
                <div class="action-buttons">
                    <a class="btn btn-sm btn-secondary" id="openReaderBtn" href="#" target="_blank">Open in Reader</a>
                    <button class="btn btn-sm btn-ghost" onclick="exportFeedback()">Export</button>
                    <button class="btn btn-sm" onclick="showSummary()">Summary</button>
                </div>
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Enlarged view">
    </div>

    <div class="summary-modal" id="summaryModal">
        <div class="summary-content">
            <div class="summary-header">
                <h2>Book Quality Summary</h2>
                <button class="summary-close" onclick="closeSummary()">&times;</button>
            </div>
            <div class="summary-body" id="summaryBody"></div>
            <div class="summary-footer">
                <button class="btn btn-secondary" onclick="closeSummary()">Close</button>
                <button class="btn btn-secondary" onclick="copyBookRatingsMarkdown()">Copy Markdown</button>
                <button class="btn" onclick="exportBookRatingsJSON()">Export JSON</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'book-review-feedback-v1';
        const BOOK_RATINGS_KEY = 'book-quality-ratings-v1';
        const GITHUB_REPO = 'dereklomas/lilbookies';

        let manifest = [];
        let currentBook = null;
        let currentPage = 0;
        let feedback = {};
        let bookRatings = {}; // { slug: { rating: 'good'|'improve'|'discard', notes: '', timestamp: '' } }

        // Load feedback from localStorage
        function loadFeedback() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) feedback = JSON.parse(saved);
            } catch { feedback = {}; }
        }

        function saveFeedback() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(feedback));
        }

        // Book rating functions
        let syncStatus = 'idle'; // 'idle' | 'saving' | 'saved' | 'error'

        async function loadBookRatings() {
            // Try to load from API first
            try {
                const response = await fetch('/api/book-ratings');
                const data = await response.json();

                if (data.success && data.ratings && Object.keys(data.ratings).length > 0) {
                    bookRatings = data.ratings;
                    // Also save to localStorage as backup
                    localStorage.setItem(BOOK_RATINGS_KEY, JSON.stringify(bookRatings));
                    console.log('Loaded ratings from Supabase');
                    return;
                }
            } catch (err) {
                console.warn('Could not load from API, using localStorage:', err);
            }

            // Fallback to localStorage
            try {
                const saved = localStorage.getItem(BOOK_RATINGS_KEY);
                if (saved) bookRatings = JSON.parse(saved);
            } catch { bookRatings = {}; }
        }

        async function saveBookRatings() {
            // Always save to localStorage first (instant)
            localStorage.setItem(BOOK_RATINGS_KEY, JSON.stringify(bookRatings));

            // Then sync to Supabase
            syncStatus = 'saving';
            updateSyncIndicator();

            try {
                const response = await fetch('/api/book-ratings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ratings: bookRatings })
                });

                const data = await response.json();

                if (data.success) {
                    syncStatus = 'saved';
                    console.log('Ratings synced to Supabase');
                } else {
                    throw new Error(data.error || 'Save failed');
                }
            } catch (err) {
                console.error('Failed to sync to Supabase:', err);
                syncStatus = 'error';
            }

            updateSyncIndicator();
            setTimeout(() => {
                if (syncStatus !== 'error') {
                    syncStatus = 'idle';
                    updateSyncIndicator();
                }
            }, 2000);
        }

        function updateSyncIndicator() {
            const statusEl = document.getElementById('bookRatingStatus');
            if (!statusEl) return;

            const icons = {
                'idle': '',
                'saving': 'Syncing...',
                'saved': 'Synced to cloud',
                'error': 'Sync failed (saved locally)'
            };

            if (syncStatus !== 'idle') {
                statusEl.textContent = icons[syncStatus];
                statusEl.style.color = syncStatus === 'error' ? 'var(--color-error)' : '';
            }
        }

        function setBookRating(rating) {
            if (!currentBook) return;

            const slug = currentBook.slug;
            const current = bookRatings[slug];

            if (current?.rating === rating) {
                // Toggle off if clicking same button
                delete bookRatings[slug];
            } else {
                bookRatings[slug] = {
                    rating,
                    notes: document.getElementById('bookNotesInput').value,
                    title: currentBook.title,
                    level: currentBook.level,
                    timestamp: new Date().toISOString()
                };
            }

            saveBookRatings();
            updateBookRatingUI();
            updateSidebarBookRatings();

            const statusEl = document.getElementById('bookRatingStatus');
            statusEl.textContent = bookRatings[slug] ? `Saved as "${rating}"` : 'Rating cleared';
            setTimeout(() => { statusEl.textContent = ''; }, 2000);
        }

        function saveBookNotes() {
            if (!currentBook || !bookRatings[currentBook.slug]) return;
            bookRatings[currentBook.slug].notes = document.getElementById('bookNotesInput').value;
            saveBookRatings();
        }

        function updateBookRatingUI() {
            const goodBtn = document.querySelector('.book-rating-btn.good');
            const improveBtn = document.querySelector('.book-rating-btn.improve');
            const discardBtn = document.querySelector('.book-rating-btn.discard');
            const notesInput = document.getElementById('bookNotesInput');

            goodBtn.classList.remove('selected');
            improveBtn.classList.remove('selected');
            discardBtn.classList.remove('selected');
            notesInput.value = '';

            if (currentBook && bookRatings[currentBook.slug]) {
                const br = bookRatings[currentBook.slug];
                if (br.rating === 'good') goodBtn.classList.add('selected');
                if (br.rating === 'improve') improveBtn.classList.add('selected');
                if (br.rating === 'discard') discardBtn.classList.add('selected');
                notesInput.value = br.notes || '';
            }
        }

        function updateSidebarBookRatings() {
            document.querySelectorAll('.story-item').forEach(item => {
                const slug = item.dataset.slug;
                let ratingEl = item.querySelector('.story-item-book-rating');

                if (!ratingEl) {
                    ratingEl = document.createElement('span');
                    ratingEl.className = 'story-item-book-rating';
                    item.appendChild(ratingEl);
                }

                const br = bookRatings[slug];
                if (!br) {
                    ratingEl.textContent = '';
                    ratingEl.className = 'story-item-book-rating';
                    return;
                }

                const icons = { good: '✓', improve: '↻', discard: '✗' };
                ratingEl.textContent = icons[br.rating] || '';
                ratingEl.className = `story-item-book-rating ${br.rating}`;
            });
        }

        function showSummary() {
            const body = document.getElementById('summaryBody');

            const good = [], improve = [], discard = [];
            for (const [slug, data] of Object.entries(bookRatings)) {
                const item = { slug, ...data };
                if (data.rating === 'good') good.push(item);
                else if (data.rating === 'improve') improve.push(item);
                else if (data.rating === 'discard') discard.push(item);
            }

            const ratedCount = good.length + improve.length + discard.length;
            const unratedCount = manifest.length - ratedCount;

            body.innerHTML = `
                <div class="summary-stats">
                    <div class="stat-item good"><div class="stat-value">${good.length}</div><div class="stat-label">Good</div></div>
                    <div class="stat-item improve"><div class="stat-value">${improve.length}</div><div class="stat-label">Improve</div></div>
                    <div class="stat-item discard"><div class="stat-value">${discard.length}</div><div class="stat-label">Discard</div></div>
                    <div class="stat-item unrated"><div class="stat-value">${unratedCount}</div><div class="stat-label">Unrated</div></div>
                </div>

                ${renderSummarySection('Good', good, '#4caf50')}
                ${renderSummarySection('Needs Improvement', improve, '#ff9800')}
                ${renderSummarySection('Discard', discard, '#f44336')}
            `;

            document.getElementById('summaryModal').classList.add('active');
        }

        function renderSummarySection(title, items, color) {
            if (items.length === 0) return '';

            items.sort((a, b) => (a.level || '').localeCompare(b.level || ''));

            return `
                <div class="summary-section">
                    <h3 style="color: ${color}">
                        ${title}
                        <span class="count">${items.length}</span>
                    </h3>
                    <div class="summary-list">
                        ${items.map(item => `
                            <div class="summary-item">
                                <span class="level">${item.level || '?'}</span>
                                <span class="title">${item.title || item.slug}</span>
                                ${item.notes ? `<span class="notes">${item.notes}</span>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function closeSummary() {
            document.getElementById('summaryModal').classList.remove('active');
        }

        function exportBookRatingsJSON() {
            const data = {
                generated: new Date().toISOString(),
                totalBooks: manifest.length,
                ratings: bookRatings
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `book-ratings-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyBookRatingsMarkdown() {
            const good = [], improve = [], discard = [];
            for (const [slug, data] of Object.entries(bookRatings)) {
                const item = { slug, ...data };
                if (data.rating === 'good') good.push(item);
                else if (data.rating === 'improve') improve.push(item);
                else if (data.rating === 'discard') discard.push(item);
            }

            let md = `# Book Quality Assessment\n`;
            md += `Generated: ${new Date().toLocaleString()}\n\n`;
            md += `## Summary\n`;
            md += `- Good: ${good.length}\n`;
            md += `- Needs Improvement: ${improve.length}\n`;
            md += `- Discard: ${discard.length}\n`;
            md += `- Unrated: ${manifest.length - good.length - improve.length - discard.length}\n\n`;

            if (good.length > 0) {
                md += `## Good (${good.length})\n`;
                good.sort((a, b) => (a.level || '').localeCompare(b.level || ''));
                good.forEach(item => {
                    md += `- [${item.level || '?'}] ${item.title || item.slug}\n`;
                });
                md += '\n';
            }

            if (improve.length > 0) {
                md += `## Needs Improvement (${improve.length})\n`;
                improve.sort((a, b) => (a.level || '').localeCompare(b.level || ''));
                improve.forEach(item => {
                    md += `- [${item.level || '?'}] ${item.title || item.slug}`;
                    if (item.notes) md += ` - ${item.notes}`;
                    md += '\n';
                });
                md += '\n';
            }

            if (discard.length > 0) {
                md += `## Discard (${discard.length})\n`;
                discard.sort((a, b) => (a.level || '').localeCompare(b.level || ''));
                discard.forEach(item => {
                    md += `- [${item.level || '?'}] ${item.title || item.slug}`;
                    if (item.notes) md += ` - ${item.notes}`;
                    md += '\n';
                });
            }

            navigator.clipboard.writeText(md).then(() => {
                alert('Copied to clipboard!');
            });
        }

        function getFeedbackKey() {
            if (!currentBook) return null;
            return `${currentBook.slug}:${currentPage}`;
        }

        function setFeedback(rating) {
            const key = getFeedbackKey();
            if (!key) return;

            if (!feedback[currentBook.slug]) feedback[currentBook.slug] = {};

            const current = feedback[currentBook.slug][currentPage];
            if (current?.rating === rating) {
                delete feedback[currentBook.slug][currentPage];
            } else {
                feedback[currentBook.slug][currentPage] = {
                    rating,
                    notes: document.getElementById('notesInput').value,
                    timestamp: new Date().toISOString()
                };
            }
            saveFeedback();
            updateFeedbackUI();
            updateBookStatus();
        }

        function saveNotes() {
            if (!currentBook || !feedback[currentBook.slug]?.[currentPage]) return;
            feedback[currentBook.slug][currentPage].notes = document.getElementById('notesInput').value;
            saveFeedback();
        }

        function updateFeedbackUI() {
            const approveBtn = document.getElementById('approveBtn');
            const rejectBtn = document.getElementById('rejectBtn');
            const notesInput = document.getElementById('notesInput');

            approveBtn.classList.remove('selected');
            rejectBtn.classList.remove('selected');
            notesInput.value = '';

            if (currentBook && feedback[currentBook.slug]?.[currentPage]) {
                const fb = feedback[currentBook.slug][currentPage];
                if (fb.rating === 'approved') approveBtn.classList.add('selected');
                if (fb.rating === 'rejected') rejectBtn.classList.add('selected');
                notesInput.value = fb.notes || '';
            }
        }

        function updateBookStatus() {
            document.querySelectorAll('.story-item').forEach(item => {
                const slug = item.dataset.slug;
                const statusEl = item.querySelector('.story-item-status');
                if (!statusEl) return;

                const bookFb = feedback[slug];
                if (!bookFb || Object.keys(bookFb).length === 0) {
                    statusEl.textContent = '';
                    return;
                }

                const approved = Object.values(bookFb).filter(f => f.rating === 'approved').length;
                const rejected = Object.values(bookFb).filter(f => f.rating === 'rejected').length;

                if (rejected > 0) {
                    statusEl.textContent = `❌${rejected}`;
                    statusEl.style.color = 'var(--color-error)';
                } else if (approved > 0) {
                    statusEl.textContent = `✓${approved}`;
                    statusEl.style.color = 'var(--color-sage)';
                }
            });
        }

        async function loadManifest() {
            const res = await fetch('/api/list-books');
            manifest = await res.json();
            manifest.sort((a, b) => (a.level || '').localeCompare(b.level || ''));
            renderBookList();
        }

        function renderBookList() {
            const container = document.getElementById('bookList');
            const bands = {};

            manifest.forEach(book => {
                const band = (book.level || 'X')[0].toUpperCase();
                if (!bands[band]) bands[band] = [];
                bands[band].push(book);
            });

            container.innerHTML = Object.entries(bands).map(([band, books]) => `
                <div class="band-group">
                    <div class="band-label">Band ${band}</div>
                    ${books.map(book => `
                        <div class="story-item ${currentBook?.slug === book.slug ? 'active' : ''}"
                             data-slug="${book.slug}"
                             onclick="selectBook('${book.slug}')">
                            <span class="story-item-level">${book.level || '?'}</span>
                            <span class="story-item-title">${book.title}</span>
                            <span class="story-item-status"></span>
                        </div>
                    `).join('')}
                </div>
            `).join('');

            updateBookStatus();
            updateSidebarBookRatings();
        }

        async function selectBook(slug) {
            const res = await fetch(`/books/${slug}.json`);
            currentBook = await res.json();
            currentBook.slug = slug;
            currentPage = -2; // Start at creation notes

            document.querySelectorAll('.story-item').forEach(el => {
                el.classList.toggle('active', el.dataset.slug === slug);
            });

            document.getElementById('pageNav').style.display = 'flex';
            document.getElementById('openReaderBtn').href = `/reader.html?book=${slug}&mode=edit`;

            buildPageSelect();
            renderPage();
            updateBookRatingUI();
        }

        function getStoryPagesWithIndex() {
            // Return story/cover pages with their ORIGINAL index in the pages array
            return (currentBook.pages || [])
                .map((page, originalIndex) => ({ ...page, originalIndex }))
                .filter(p => p.type === 'story' || p.type === 'cover');
        }

        function buildPageSelect() {
            const select = document.getElementById('pageSelect');
            const storyPages = getStoryPagesWithIndex();

            let options = [
                { value: -2, label: 'Creation Notes' },
                { value: -1, label: 'Reference Sheet' }
            ];

            storyPages.forEach((page, i) => {
                options.push({ value: i, label: `Page ${i + 1}` });
            });

            select.innerHTML = options.map(opt =>
                `<option value="${opt.value}">${opt.label}</option>`
            ).join('');

            select.value = currentPage;
        }

        function goToPage(page) {
            currentPage = parseInt(page);
            renderPage();
        }

        function prevPage() {
            const storyPages = getStoryPagesWithIndex();
            if (currentPage > -2) {
                currentPage--;
                document.getElementById('pageSelect').value = currentPage;
                renderPage();
            }
        }

        function nextPage() {
            const storyPages = getStoryPagesWithIndex();
            if (currentPage < storyPages.length - 1) {
                currentPage++;
                document.getElementById('pageSelect').value = currentPage;
                renderPage();
            }
        }

        function renderPage() {
            const pageView = document.getElementById('pageView');
            const pageInfo = document.getElementById('pageInfo');
            const storyPages = getStoryPagesWithIndex();

            // Update nav buttons
            document.getElementById('prevBtn').disabled = currentPage <= -2;
            document.getElementById('nextBtn').disabled = currentPage >= storyPages.length - 1;
            document.getElementById('pageLabel').textContent = `of ${storyPages.length} pages`;

            // Creation Notes page
            if (currentPage === -2) {
                const bible = currentBook.story_bible || {};
                pageView.innerHTML = `
                    <div class="special-page">
                        <h2>Creation Notes</h2>
                        ${bible.premise ? `<h3>Premise</h3><p>${bible.premise}</p>` : ''}
                        ${bible.themes ? `<h3>Themes</h3><p>${Array.isArray(bible.themes) ? bible.themes.join(', ') : bible.themes}</p>` : ''}
                        ${bible.character_arcs ? `<h3>Character Arcs</h3>${Object.entries(bible.character_arcs).map(([c, a]) => `<p><strong>${c}:</strong> ${a}</p>`).join('')}` : ''}
                        ${bible.setting ? `<h3>Setting</h3><p>${bible.setting}</p>` : ''}
                        ${bible.visual_style ? `<h3>Visual Style</h3><p>${bible.visual_style}</p>` : ''}
                        ${bible.emotional_beats ? `<h3>Emotional Beats</h3>${bible.emotional_beats.map(b => `<p><strong>Page ${b.page}:</strong> ${b.beat}</p>`).join('')}` : ''}
                        ${Object.keys(bible).length === 0 ? '<p style="color: var(--color-text-muted);">No story bible available</p>' : ''}
                    </div>
                `;
                updatePageInfo('Creation Notes', '-');
                updateFeedbackUI();
                return;
            }

            // Reference page
            if (currentPage === -1) {
                const refPaths = [
                    `/books/references/${currentBook.slug}_reference_v4.png`,
                    `/books/references/${currentBook.slug}_reference_v3.png`,
                    `/books/references/${currentBook.slug}_reference_v2.png`,
                    `/books/references/${currentBook.slug}_reference.png`
                ];
                pageView.innerHTML = `
                    <img class="page-image" id="refPageImg" src="${refPaths[0]}" alt="Reference Sheet" onclick="openLightbox(this.src)"
                        onerror="tryNextRef(this, ${JSON.stringify(refPaths).replace(/"/g, '&quot;')}, 1)">
                `;
                // Pass reference metadata if available
                updatePageInfo('Reference', 'reference', currentBook.reference_metadata);
                updateFeedbackUI();
                return;
            }

            // Story pages
            const page = storyPages[currentPage];
            if (!page) return;

            // Use original page index (1-indexed) for image filename
            const pageNum = page.originalIndex + 1;
            const imgPath = `/books/images/${currentBook.slug}_page${String(pageNum).padStart(2, '0')}.png`;

            // Show image, text, and prompt in vertical stack
            pageView.innerHTML = `
                <img class="page-image" src="${imgPath}" alt="Page ${currentPage + 1}"
                     onclick="openLightbox('${imgPath}')"
                     onerror="this.style.opacity='0.3'">
                ${page.text ? `<div class="page-text-display"><strong>Text:</strong> ${page.text}</div>` : ''}
                ${page.scene ? `
                <div class="prompt-display">
                    <h4>Scene Prompt</h4>
                    <p>${page.scene}</p>
                </div>
                ` : ''}
            `;

            // Pass page-level generation metadata if available
            updatePageInfo(`Page ${currentPage + 1}`, page.type || 'story', page.generation_metadata);
            updateFeedbackUI();
        }

        function tryNextRef(img, paths, index) {
            if (index < paths.length) {
                img.src = paths[index];
                img.onerror = () => tryNextRef(img, paths, index + 1);
            } else {
                img.parentElement.innerHTML = '<div class="empty-state">No reference image</div>';
            }
        }

        function updatePageInfo(pageLabel, pageType, pageMetadata = null) {
            document.getElementById('pageInfo').innerHTML = `
                <div class="info-row"><label>Book</label><span class="value">${currentBook.title}</span></div>
                <div class="info-row"><label>Level</label><span class="value">${currentBook.level || 'N/A'}</span></div>
                <div class="info-row"><label>Page</label><span class="value">${pageLabel}</span></div>
                <div class="info-row"><label>Type</label><span class="value">${pageType}</span></div>
            `;

            // Update generation info - use page metadata if available, else book-level
            const meta = pageMetadata || {};
            const model = meta.model || currentBook.model || 'Unknown';
            const generatedAt = meta.generated_at
                ? new Date(meta.generated_at).toLocaleDateString()
                : currentBook.created || 'Unknown';
            const usedRef = meta.used_reference;
            const refVersion = meta.reference_version;

            let refStatus = 'Checking...';
            if (usedRef !== undefined) {
                refStatus = usedRef
                    ? `<span style="color: var(--color-sage);">✓ ${refVersion || 'Yes'}</span>`
                    : '<span style="color: var(--color-text-muted);">No</span>';
            }

            document.getElementById('genInfo').innerHTML = `
                <div class="info-row"><label>Model</label><span class="value">${model}</span></div>
                <div class="info-row"><label>Generated</label><span class="value">${generatedAt}</span></div>
                <div class="info-row"><label>Style</label><span class="value">${currentBook.style_preset || 'Default'}</span></div>
                <div class="info-row"><label>Reference</label><span class="value" id="hasRefValue">${refStatus}</span></div>
            `;

            // Only check if reference exists if we don't have page-level metadata
            if (usedRef === undefined) {
                checkReferenceExists();
            }
        }

        function checkReferenceExists() {
            const refPaths = [
                `/books/references/${currentBook.slug}_reference_v4.png`,
                `/books/references/${currentBook.slug}_reference_v3.png`,
                `/books/references/${currentBook.slug}_reference_v2.png`,
                `/books/references/${currentBook.slug}_reference.png`
            ];

            let found = false;
            let checked = 0;

            refPaths.forEach(path => {
                const img = new Image();
                img.onload = () => {
                    if (!found) {
                        found = true;
                        const refEl = document.getElementById('hasRefValue');
                        if (refEl) refEl.innerHTML = '<span style="color: var(--color-sage);">✓ Yes</span>';
                    }
                };
                img.onerror = () => {
                    checked++;
                    if (checked === refPaths.length && !found) {
                        const refEl = document.getElementById('hasRefValue');
                        if (refEl) refEl.innerHTML = '<span style="color: var(--color-error);">✗ No</span>';
                    }
                };
                img.src = path;
            });
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function exportFeedback() {
            if (!currentBook) return;

            const bookFb = feedback[currentBook.slug] || {};
            const approved = [], rejected = [];

            Object.entries(bookFb).forEach(([page, fb]) => {
                const label = page == -2 ? 'Creation Notes' : page == -1 ? 'Reference' : `Page ${parseInt(page) + 1}`;
                if (fb.rating === 'approved') {
                    approved.push(label);
                } else {
                    rejected.push(`- [ ] ${label}${fb.notes ? `: ${fb.notes}` : ''}`);
                }
            });

            const text = `# Book Review: ${currentBook.title}
**Level:** ${currentBook.level || 'N/A'}
**Reviewed:** ${new Date().toLocaleString()}

## Approved (${approved.length})
${approved.join(', ') || '(none)'}

## Needs Work (${rejected.length})
${rejected.join('\n') || '(none)'}`;

            navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
        }

        // Keyboard navigation
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeLightbox();
                closeSummary();
            }
            if (e.key === 'ArrowLeft' && currentBook) prevPage();
            if (e.key === 'ArrowRight' && currentBook) nextPage();
        });

        // Initialize
        (async function init() {
            loadFeedback();
            await loadBookRatings();
            await loadManifest();
        })();
    </script>
</body>
</html>
