<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Blend It - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header { padding-top: var(--space-md); }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 { font-size: 1.5rem; }

    .score-badge {
      background: var(--color-sage-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-sage-dark);
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .level-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .level-group-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .word-area { text-align: center; padding: var(--space-sm) 0; }

    .image-hint {
      font-size: 5rem;
      margin-bottom: var(--space-md);
      cursor: pointer;
    }

    .image-hint:hover { transform: scale(1.05); }

    .segments-display {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: var(--space-md);
    }

    .segment {
      width: 80px;
      height: 90px;
      background: var(--color-cream);
      border: 2px solid var(--color-border);
      border-radius: var(--border-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 500;
      color: var(--color-charcoal);
      cursor: pointer;
      transition: all 0.3s;
    }

    .segment:hover {
      border-color: var(--color-sage);
      transform: scale(1.05);
    }

    .segment.active {
      background: var(--color-sage);
      border-color: var(--color-sage);
      color: var(--color-white);
      transform: scale(1.1);
    }

    .segment.highlight {
      background: var(--color-sage-light);
      border-color: var(--color-sage);
      animation: pulse 0.5s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .blended-word {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-weight: 500;
      color: var(--color-sage-dark);
      margin-bottom: var(--space-md);
      min-height: 60px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .blended-word.visible { opacity: 1; }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-sound { background: var(--color-terracotta); color: var(--color-soft-black); }
    .btn-sound:hover { background: var(--color-terracotta-dark); }
    .btn-blend { background: var(--color-sage); color: var(--color-white); }
    .btn-blend:hover { background: var(--color-sage-dark); }

    .instructions {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.95rem;
      margin-top: var(--space-md);
      padding: var(--space-sm);
      background: var(--color-cream);
      border-radius: var(--border-radius);
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: var(--space-md);
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-border);
      transition: all 0.2s;
    }

    .progress-dot.done { background: var(--color-sage); }
    .progress-dot.current { background: var(--color-terracotta); transform: scale(1.3); }

    @media (max-width: 480px) {
      .segment { width: 60px; height: 70px; font-size: 1.5rem; }
    }

    .student-badge {
      font-size: 0.8rem;
      background: var(--color-sage-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
      color: var(--color-sage-dark);
      vertical-align: middle;
      margin-left: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <script src="/js/data-service.js"></script>
  <script src="/js/student-picker.js"></script>
  <div class="container-narrow">
    <div class="page-header">
      <a href="/activities/" class="back-link">&larr; Back to Activities</a>
    </div>

    <div class="game-card">
      <div class="game-header">
        <h1>Blend It <span id="studentBadge" class="student-badge hidden"></span></h1>
        <div class="score-badge">Words: <span id="wordCount">0</span></div>
      </div>

      <div class="level-select">
        <div class="level-group">
          <span class="level-group-label">A:</span>
          <button class="chip active" data-level="A4">A4</button>
        </div>
        <div class="level-group">
          <span class="level-group-label">B:</span>
          <button class="chip" data-level="B1">B1</button>
          <button class="chip" data-level="B2">B2</button>
          <button class="chip" data-level="B3">B3</button>
          <button class="chip" data-level="B5">B5</button>
          <button class="chip" data-level="B6">B6</button>
          <button class="chip" data-level="B7">B7</button>
          <button class="chip" data-level="B8">B8</button>
        </div>
      </div>

      <div class="word-area">
        <div class="image-hint" id="imageHint" onclick="speakWord(currentWord?.word)">&#x1F431;</div>
        <div class="segments-display" id="segmentsDisplay"></div>
        <div class="blended-word" id="blendedWord">cat</div>

        <div class="controls">
          <button class="btn btn-sound" onclick="soundOut()">&#x1F50A; Sound Out</button>
          <button class="btn btn-blend" onclick="blendWord()">&#x27A1;&#xFE0F; Blend It!</button>
          <button class="btn btn-primary" onclick="nextWord()">Next &#x27A1;</button>
        </div>

        <div class="instructions" id="instructions">Tap each sound, then blend them together!</div>
        <div class="progress" id="progress"></div>
      </div>
    </div>
  </div>

  <script>

        { word: 'chin', segments: ['ch', 'i', 'n'], image: '&#x1F9D4;' },

      ],

        { word: 'name', segments: ['n', 'a_e', 'm'], image: '&#x1F3F7;&#xFE0F;' },

      ],
      'B7': [
        { word: 'car', segments: ['c', 'ar'], image: '&#x1F697;' },
        { word: 'star', segments: ['st', 'ar'], image: '&#x2B50;' },

        { word: 'corn', segments: ['c', 'or', 'n'], image: '&#x1F33D;' },
        { word: 'fork', segments: ['f', 'or', 'k'], image: '&#x1F374;' },
        { word: 'bird', segments: ['b', 'ir', 'd'], image: '&#x1F426;' },
        { word: 'girl', segments: ['g', 'ir', 'l'], image: '&#x1F467;' },
        { word: 'turn', segments: ['t', 'ur', 'n'], image: '&#x1F504;' },
        { word: 'burn', segments: ['b', 'ur', 'n'], image: '&#x1F525;' },
        { word: 'fern', segments: ['f', 'er', 'n'], image: '&#x1F33F;' },
        { word: 'her', segments: ['h', 'er'], image: '&#x1F469;' },
      ],
      'B8': [
        { word: 'rain', segments: ['r', 'ai', 'n'], image: '&#x1F327;&#xFE0F;' },
        { word: 'tail', segments: ['t', 'ai', 'l'], image: '&#x1F415;' },
        { word: 'day', segments: ['d', 'ay'], image: '&#x2600;&#xFE0F;' },
        { word: 'play', segments: ['pl', 'ay'], image: '&#x1F3AE;' },
        { word: 'tree', segments: ['tr', 'ee'], image: '&#x1F333;' },
        { word: 'bee', segments: ['b', 'ee'], image: '&#x1F41D;' },
        { word: 'read', segments: ['r', 'ea', 'd'], image: '&#x1F4D6;' },
        { word: 'meat', segments: ['m', 'ea', 't'], image: '&#x1F356;' },
        { word: 'boat', segments: ['b', 'oa', 't'], image: '&#x26F5;' },
        { word: 'coat', segments: ['c', 'oa', 't'], image: '&#x1F9E5;' },
        { word: 'snow', segments: ['sn', 'ow'], image: '&#x2744;&#xFE0F;' },
        { word: 'grow', segments: ['gr', 'ow'], image: '&#x1F331;' },
      ],
    };

    const phonemes = {
      'a': 'ah', 'e': 'eh', 'i': 'ih', 'o': 'oh', 'u': 'uh',
      'a_e': 'ay', 'i_e': 'eye', 'o_e': 'oh', 'u_e': 'you',
      'sh': 'shh', 'ch': 'chh', 'th': 'thh', 'ng': 'nng',
      'ar': 'arr', 'or': 'orr', 'er': 'err', 'ir': 'err', 'ur': 'err',
      'ai': 'ay', 'ay': 'ay', 'ee': 'ee', 'ea': 'ee', 'oa': 'oh', 'ow': 'oh',
      'fr': 'frr', 'cr': 'crr', 'fl': 'fll', 'dr': 'drr',
      'st': 'stt', 'sw': 'sww', 'cl': 'cll', 'gr': 'grr',
      'tr': 'trr', 'sn': 'snn', 'pl': 'pll', 'sl': 'sll'
    };

    let currentLevel = 'A4';
    let currentWord = null;
    let wordIndex = 0;
    let wordsCompleted = 0;
    let roundWords = [];
    let currentStudent = null;
    let sessionStartTime = null;

    document.addEventListener('DOMContentLoaded', async () => {
      setupLevelButtons();

      // Show student picker
      const picker = new StudentPicker({
        title: 'Who is blending words?',
        allowSkip: true
      });
      currentStudent = await picker.show();

      if (currentStudent) {
        // Show student badge
        const badge = document.getElementById('studentBadge');
        badge.textContent = `${currentStudent.avatar} ${currentStudent.name}`;
        badge.classList.remove('hidden');

        // Auto-set level based on assessed level
        const level = await window.FunBookiesDB.getCurrentLevel(currentStudent.id);
        if (level && wordBanks[level]) {
          currentLevel = level;
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          const levelBtn = document.querySelector(`.chip[data-level="${level}"]`);
          if (levelBtn) levelBtn.classList.add('active');
        }
      }

      sessionStartTime = Date.now();
      startRound();
    });

    function setupLevelButtons() {
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = btn.dataset.level;
          startRound();
        });
      });
    }

    function startRound() {
      wordIndex = 0;
      const bank = wordBanks[currentLevel] || wordBanks['A4'];
      roundWords = [...bank].sort(() => Math.random() - 0.5).slice(0, 5);
      renderProgress();
      loadWord();
    }

    function loadWord() {
      currentWord = roundWords[wordIndex];
      document.getElementById('imageHint').innerHTML = currentWord.image;
      document.getElementById('blendedWord').classList.remove('visible');
      document.getElementById('instructions').textContent = 'Tap each sound, then blend them together!';
      renderSegments();
      renderProgress();
    }

    function renderSegments() {
      const container = document.getElementById('segmentsDisplay');
      container.innerHTML = '';

      currentWord.segments.forEach((seg, idx) => {
        const segEl = document.createElement('div');
        segEl.className = 'segment';
        segEl.textContent = seg.replace('_', '');
        segEl.onclick = () => playSegment(idx);
        container.appendChild(segEl);
      });
    }

    function renderProgress() {
      const container = document.getElementById('progress');
      container.innerHTML = '';

      for (let i = 0; i < roundWords.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i < wordIndex) dot.classList.add('done');
        if (i === wordIndex) dot.classList.add('current');
        container.appendChild(dot);
      }
    }

    function playSegment(index) {
      const segments = document.querySelectorAll('.segment');
      segments.forEach(s => s.classList.remove('active', 'highlight'));
      segments[index].classList.add('active');

      const seg = currentWord.segments[index];
      speakSound(phonemes[seg] || seg);

      setTimeout(() => {
        segments[index].classList.remove('active');
        segments[index].classList.add('highlight');
      }, 400);
    }

    function soundOut() {
      const segments = document.querySelectorAll('.segment');
      let delay = 0;

      currentWord.segments.forEach((seg, idx) => {
        setTimeout(() => {
          segments.forEach(s => s.classList.remove('active', 'highlight'));
          segments[idx].classList.add('active');
          speakSound(phonemes[seg] || seg);

          setTimeout(() => {
            segments[idx].classList.remove('active');
            segments[idx].classList.add('highlight');
          }, 400);
        }, delay);
        delay += 600;
      });
    }

    function blendWord() {
      document.getElementById('instructions').textContent = 'Great! Now say the whole word!';

      const segments = document.querySelectorAll('.segment');
      segments.forEach(s => s.classList.add('highlight'));

      setTimeout(() => {
        document.getElementById('blendedWord').textContent = currentWord.word;
        document.getElementById('blendedWord').classList.add('visible');
        speakWord(currentWord.word);
      }, 300);
    }

    async function nextWord() {
      wordIndex++;
      wordsCompleted++;
      document.getElementById('wordCount').textContent = wordsCompleted;

      if (wordIndex >= roundWords.length) {
        document.getElementById('instructions').textContent = 'Round complete! Starting new round...';

        // Save activity on round complete
        if (currentStudent) {
          await saveActivity();
        }

        setTimeout(startRound, 1500);
      } else {
        loadWord();
      }
    }

    async function saveActivity() {
      if (!currentStudent || wordsCompleted === 0) return;
      try {
        await window.FunBookiesDB.saveActivity({
          studentId: currentStudent.id,
          type: 'blend-it',
          level: currentLevel,
          score: wordsCompleted,
          total: wordsCompleted,
          duration: Math.round((Date.now() - sessionStartTime) / 1000),
          details: {}
        });
      } catch (e) {
        console.error('Failed to save activity:', e);
      }
    }

    // Save on page unload
    window.addEventListener('beforeunload', () => {
      if (currentStudent && wordsCompleted > 0) {
        saveActivity();
      }
    });

    function speakSound(sound) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(sound);
        utterance.rate = 0.6;
        utterance.pitch = 1.1;
        speechSynthesis.speak(utterance);
      }
    }

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.rate = 0.7;
        speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
