<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Blend It - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header {
      padding-top: var(--space-md);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 {
      font-size: 1.5rem;
    }

    .score-badge {
      background: var(--color-sage-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-sage-dark);
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .word-area {
      text-align: center;
      padding: var(--space-sm) 0;
    }

    .image-hint {
      font-size: 5rem;
      margin-bottom: var(--space-md);
    }

    .segments-display {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: var(--space-md);
    }

    .segment {
      width: 80px;
      height: 90px;
      background: var(--color-cream);
      border: 2px solid var(--color-border);
      border-radius: var(--border-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 500;
      color: var(--color-charcoal);
      cursor: pointer;
      transition: all 0.3s;
    }

    .segment:hover {
      border-color: var(--color-sage);
      transform: scale(1.05);
    }

    .segment.active {
      background: var(--color-sage);
      border-color: var(--color-sage);
      color: var(--color-white);
      transform: scale(1.1);
    }

    .segment.highlight {
      background: var(--color-sage-light);
      border-color: var(--color-sage);
      animation: pulse 0.5s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .blended-word {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-weight: 500;
      color: var(--color-sage-dark);
      margin-bottom: var(--space-md);
      min-height: 60px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .blended-word.visible {
      opacity: 1;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-sound {
      background: var(--color-terracotta);
      color: var(--color-soft-black);
    }

    .btn-sound:hover {
      background: var(--color-terracotta-dark);
    }

    .btn-blend {
      background: var(--color-sage);
      color: var(--color-white);
    }

    .btn-blend:hover {
      background: var(--color-sage-dark);
    }

    .instructions {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.95rem;
      margin-top: var(--space-md);
      padding: var(--space-sm);
      background: var(--color-cream);
      border-radius: var(--border-radius);
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: var(--space-md);
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-border);
      transition: all 0.2s;
    }

    .progress-dot.done {
      background: var(--color-sage);
    }

    .progress-dot.current {
      background: var(--color-terracotta);
      transform: scale(1.3);
    }

    @media (max-width: 480px) {
      .segment {
        width: 60px;
        height: 70px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container-narrow">
    <div class="page-header">
      <a href="/activities/" class="back-link">&larr; Back to Activities</a>
    </div>

    <div class="game-card">
      <div class="game-header">
        <h1>Blend It</h1>
        <div class="score-badge">Words: <span id="wordCount">0</span></div>
      </div>

      <div class="level-select">
        <button class="chip active" data-level="0">CVC</button>
        <button class="chip" data-level="1">Blends</button>
        <button class="chip" data-level="2">Digraphs</button>
      </div>

      <div class="word-area">
        <div class="image-hint" id="imageHint">&#x1F431;</div>

        <div class="segments-display" id="segmentsDisplay"></div>

        <div class="blended-word" id="blendedWord">cat</div>

        <div class="controls">
          <button class="btn btn-sound" onclick="soundOut()">
            &#x1F50A; Sound Out
          </button>
          <button class="btn btn-blend" onclick="blendWord()">
            &#x27A1;&#xFE0F; Blend It!
          </button>
          <button class="btn btn-primary" onclick="nextWord()">
            Next &#x27A1;
          </button>
        </div>

        <div class="instructions" id="instructions">
          Tap each sound, then blend them together!
        </div>

        <div class="progress" id="progress"></div>
      </div>
    </div>
  </div>

  <script>
    const wordBanks = {
      0: [ // CVC
        { word: 'cat', segments: ['c', 'a', 't'], image: '&#x1F431;' },
        { word: 'dog', segments: ['d', 'o', 'g'], image: '&#x1F415;' },
        { word: 'sun', segments: ['s', 'u', 'n'], image: '&#x2600;&#xFE0F;' },
        { word: 'hat', segments: ['h', 'a', 't'], image: '&#x1F3A9;' },
        { word: 'pig', segments: ['p', 'i', 'g'], image: '&#x1F437;' },
        { word: 'cup', segments: ['c', 'u', 'p'], image: '&#x1F964;' },
        { word: 'bed', segments: ['b', 'e', 'd'], image: '&#x1F6CF;&#xFE0F;' },
        { word: 'fox', segments: ['f', 'o', 'x'], image: '&#x1F98A;' },
        { word: 'bus', segments: ['b', 'u', 's'], image: '&#x1F68C;' },
        { word: 'net', segments: ['n', 'e', 't'], image: '&#x1F945;' },
      ],
      1: [ // Blends
        { word: 'frog', segments: ['fr', 'o', 'g'], image: '&#x1F438;' },
        { word: 'crab', segments: ['cr', 'a', 'b'], image: '&#x1F980;' },
        { word: 'flag', segments: ['fl', 'a', 'g'], image: '&#x1F6A9;' },
        { word: 'drum', segments: ['dr', 'u', 'm'], image: '&#x1F941;' },
        { word: 'stop', segments: ['st', 'o', 'p'], image: '&#x1F6D1;' },
        { word: 'swim', segments: ['sw', 'i', 'm'], image: '&#x1F3CA;' },
        { word: 'clap', segments: ['cl', 'a', 'p'], image: '&#x1F44F;' },
        { word: 'grin', segments: ['gr', 'i', 'n'], image: '&#x1F601;' },
        { word: 'trip', segments: ['tr', 'i', 'p'], image: '&#x2708;&#xFE0F;' },
        { word: 'snap', segments: ['sn', 'a', 'p'], image: '&#x1FAF0;' },
      ],
      2: [ // Digraphs
        { word: 'ship', segments: ['sh', 'i', 'p'], image: '&#x1F6A2;' },
        { word: 'fish', segments: ['f', 'i', 'sh'], image: '&#x1F41F;' },
        { word: 'chat', segments: ['ch', 'a', 't'], image: '&#x1F4AC;' },
        { word: 'chin', segments: ['ch', 'i', 'n'], image: '&#x1F9D4;' },
        { word: 'shop', segments: ['sh', 'o', 'p'], image: '&#x1F3EA;' },
        { word: 'thin', segments: ['th', 'i', 'n'], image: '&#x1F4CF;' },
        { word: 'path', segments: ['p', 'a', 'th'], image: '&#x1F6E4;&#xFE0F;' },
        { word: 'chop', segments: ['ch', 'o', 'p'], image: '&#x1FA93;' },
        { word: 'wish', segments: ['w', 'i', 'sh'], image: '&#x2B50;' },
        { word: 'math', segments: ['m', 'a', 'th'], image: '&#x1F522;' },
      ]
    };

    // Sound mappings for speech synthesis
    const phonemes = {
      'a': 'ah', 'e': 'eh', 'i': 'ih', 'o': 'oh', 'u': 'uh',
      'sh': 'shh', 'ch': 'chh', 'th': 'thh',
      'fr': 'frr', 'cr': 'crr', 'fl': 'fll', 'dr': 'drr',
      'st': 'stt', 'sw': 'sww', 'cl': 'cll', 'gr': 'grr',
      'tr': 'trr', 'sn': 'snn'
    };

    let currentLevel = 0;
    let currentWord = null;
    let wordIndex = 0;
    let wordsCompleted = 0;
    let roundWords = [];

    document.addEventListener('DOMContentLoaded', () => {
      setupLevelButtons();
      startRound();
    });

    function setupLevelButtons() {
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = parseInt(btn.dataset.level);
          startRound();
        });
      });
    }

    function startRound() {
      wordIndex = 0;
      roundWords = [...wordBanks[currentLevel]].sort(() => Math.random() - 0.5).slice(0, 5);
      renderProgress();
      loadWord();
    }

    function loadWord() {
      currentWord = roundWords[wordIndex];
      document.getElementById('imageHint').innerHTML = currentWord.image;
      document.getElementById('blendedWord').classList.remove('visible');
      document.getElementById('instructions').textContent = 'Tap each sound, then blend them together!';

      renderSegments();
      renderProgress();
    }

    function renderSegments() {
      const container = document.getElementById('segmentsDisplay');
      container.innerHTML = '';

      currentWord.segments.forEach((seg, idx) => {
        const segEl = document.createElement('div');
        segEl.className = 'segment';
        segEl.textContent = seg;
        segEl.onclick = () => playSegment(idx);
        container.appendChild(segEl);
      });
    }

    function renderProgress() {
      const container = document.getElementById('progress');
      container.innerHTML = '';

      for (let i = 0; i < roundWords.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i < wordIndex) dot.classList.add('done');
        if (i === wordIndex) dot.classList.add('current');
        container.appendChild(dot);
      }
    }

    function playSegment(index) {
      const segments = document.querySelectorAll('.segment');
      segments.forEach(s => s.classList.remove('active', 'highlight'));
      segments[index].classList.add('active');

      const seg = currentWord.segments[index];
      speakSound(phonemes[seg] || seg);

      setTimeout(() => {
        segments[index].classList.remove('active');
        segments[index].classList.add('highlight');
      }, 400);
    }

    function soundOut() {
      const segments = document.querySelectorAll('.segment');
      let delay = 0;

      currentWord.segments.forEach((seg, idx) => {
        setTimeout(() => {
          segments.forEach(s => s.classList.remove('active', 'highlight'));
          segments[idx].classList.add('active');
          speakSound(phonemes[seg] || seg);

          setTimeout(() => {
            segments[idx].classList.remove('active');
            segments[idx].classList.add('highlight');
          }, 400);
        }, delay);
        delay += 600;
      });
    }

    function blendWord() {
      document.getElementById('instructions').textContent = 'Great! Now say the whole word!';

      // Animate segments coming together
      const segments = document.querySelectorAll('.segment');
      segments.forEach(s => {
        s.classList.add('highlight');
      });

      // Show blended word
      setTimeout(() => {
        document.getElementById('blendedWord').textContent = currentWord.word;
        document.getElementById('blendedWord').classList.add('visible');
        speakWord(currentWord.word);
      }, 300);
    }

    function nextWord() {
      wordIndex++;
      wordsCompleted++;
      document.getElementById('wordCount').textContent = wordsCompleted;

      if (wordIndex >= roundWords.length) {
        document.getElementById('instructions').textContent = 'Round complete! Starting new round...';
        setTimeout(startRound, 1500);
      } else {
        loadWord();
      }
    }

    function speakSound(sound) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(sound);
        utterance.rate = 0.6;
        utterance.pitch = 1.1;
        speechSynthesis.speak(utterance);
      }
    }

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.rate = 0.7;
        speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
