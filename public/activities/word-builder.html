<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Word Builder - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header { padding-top: var(--space-md); }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 { font-size: 1.5rem; color: var(--color-soft-black); }

    .score-badge {
      background: var(--color-terracotta-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-terracotta-dark);
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .level-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .level-group-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .target-area {
      text-align: center;
      margin-bottom: var(--space-md);
    }

    .target-hint {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      margin-bottom: var(--space-xs);
    }

    .target-image {
      font-size: 5rem;
      margin-bottom: var(--space-xs);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .target-image:hover { transform: scale(1.1); }

    .target-word {
      font-size: 1rem;
      color: var(--color-text-muted);
      font-style: italic;
    }

    .word-slots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: var(--space-md);
      min-height: 80px;
    }

    .slot {
      width: 60px;
      height: 70px;
      border: 2px dashed var(--color-border);
      border-radius: var(--border-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 500;
      color: var(--color-charcoal);
      background: var(--color-cream);
      transition: all 0.2s;
      cursor: pointer;
    }

    .slot.filled {
      border-style: solid;
      border-color: var(--color-sage);
      background: var(--color-sage-light);
    }

    .slot.correct {
      border-color: var(--color-success);
      background: #E8F5E9;
    }

    .slot.wrong {
      border-color: var(--color-error);
      background: #FFEBEE;
      animation: shake 0.3s;
    }

    .letter-bank {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: var(--space-md);
    }

    .letter-tile {
      width: 56px;
      height: 64px;
      background: var(--color-sage);
      border: none;
      border-radius: var(--border-radius);
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 500;
      color: var(--color-white);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 8px rgba(159, 199, 170, 0.3);
    }

    .letter-tile:hover {
      background: var(--color-sage-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(159, 199, 170, 0.4);
    }

    .letter-tile:active { transform: translateY(0) scale(0.95); }

    .letter-tile.used { opacity: 0.3; cursor: not-allowed; }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .feedback {
      text-align: center;
      margin-top: var(--space-md);
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 500;
      min-height: 40px;
    }

    .feedback.correct { color: var(--color-success); }
    .feedback.wrong { color: var(--color-error); }

    .streak {
      text-align: center;
      margin-top: var(--space-sm);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .streak span { color: var(--color-terracotta); font-weight: 700; }

    @media (max-width: 480px) {
      .slot, .letter-tile { width: 48px; height: 56px; font-size: 1.5rem; }
    }

    .student-badge {
      font-size: 0.8rem;
      background: var(--color-sage-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
      color: var(--color-sage-dark);
      vertical-align: middle;
      margin-left: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>

        <div class="score-badge">Score: <span id="score">0</span></div>
      </div>

          <button class="chip" data-level="B9">B9</button>
        </div>
      </div>

      <div class="target-area">
        <div class="target-hint">Build this word:</div>
        <div class="target-image" id="targetImage" onclick="speakWord(currentWord?.word)" title="Click to hear the word">&#x1F431;</div>
        <div class="target-word" id="targetHint">(a furry pet that says meow)</div>
      </div>

      <div class="word-slots" id="wordSlots"></div>
      <div class="letter-bank" id="letterBank"></div>

      <div class="controls">
        <button class="btn btn-ghost" onclick="clearWord()">Clear</button>
        <button class="btn btn-primary" onclick="checkWord()">Check</button>
        <button class="btn btn-secondary" onclick="speakWord(currentWord?.word)" title="Hear the word">&#x1F50A;</button>
        <button class="btn btn-outline" onclick="skipWord()">Skip</button>
      </div>

      <div class="feedback" id="feedback"></div>
      <div class="streak">Current streak: <span id="streak">0</span></div>
    </div>
  </div>

  <script>
    // TTS
    function speak(text, rate = 0.85) {
      if (!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate;
      utterance.pitch = 1.1;
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google') || v.lang.startsWith('en'));
      if (preferred) utterance.voice = preferred;
      window.speechSynthesis.speak(utterance);
    }

    function speakLetter(letter) { speak(letter.toUpperCase(), 0.7); }
    function speakWord(word) { speak(word, 0.75); }

        { word: 'coin', image: '&#x1FA99;', hint: 'money metal' },
        { word: 'join', image: '&#x1F91D;', hint: 'come together' },
        { word: 'out', image: '&#x1F6AA;', hint: 'not inside' },
        { word: 'loud', image: '&#x1F50A;', hint: 'very noisy' },
        { word: 'cloud', image: '&#x2601;&#xFE0F;', hint: 'in the sky' },
        { word: 'house', image: '&#x1F3E0;', hint: 'where you live' },
        { word: 'mouse', image: '&#x1F401;', hint: 'small rodent' },
        { word: 'down', image: '&#x1F447;', hint: 'opposite of up' },
        { word: 'town', image: '&#x1F3D8;&#xFE0F;', hint: 'small city' },
        { word: 'brown', image: '&#x1F7EB;', hint: 'chocolate color' },
        { word: 'moon', image: '&#x1F319;', hint: 'night light' },
        { word: 'soon', image: '&#x23F0;', hint: 'in a bit' },
        { word: 'food', image: '&#x1F354;', hint: 'you eat it' },
        { word: 'book', image: '&#x1F4D6;', hint: 'has pages' },
        { word: 'look', image: '&#x1F440;', hint: 'see it' },
        { word: 'cook', image: '&#x1F468;&#x200D;&#x1F373;', hint: 'make food' },
        { word: 'good', image: '&#x1F44D;', hint: 'not bad' },
        { word: 'wood', image: '&#x1FAB5;', hint: 'from trees' },
        { word: 'foot', image: '&#x1F9B6;', hint: 'walk on it' },
      ],
    };

    let currentLevel = 'A4';
    let currentWord = null;
    let builtWord = [];
    let score = 0;
    let streak = 0;
    let usedWords = new Set();
    let currentStudent = null;
    let sessionStartTime = null;
    let sessionCorrect = 0;
    let sessionTotal = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      setupLevelButtons();

      // Show student picker
      const picker = new StudentPicker({
        title: 'Who is building words?',
        allowSkip: true
      });
      currentStudent = await picker.show();

      if (currentStudent) {
        // Show student badge
        const badge = document.getElementById('studentBadge');
        badge.textContent = `${currentStudent.avatar} ${currentStudent.name}`;
        badge.classList.remove('hidden');

        // Auto-set level based on assessed level
        const level = await window.FunBookiesDB.getCurrentLevel(currentStudent.id);
        if (level && wordBanks[level]) {
          currentLevel = level;
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          const levelBtn = document.querySelector(`.chip[data-level="${level}"]`);
          if (levelBtn) levelBtn.classList.add('active');
        }
      }

      sessionStartTime = Date.now();
      newWord();
    });

    function setupLevelButtons() {
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = btn.dataset.level;
          usedWords.clear();
          newWord();
        });
      });
    }

    function newWord() {
      const bank = wordBanks[currentLevel] || wordBanks['A4'];
      const available = bank.filter(w => !usedWords.has(w.word));

      if (available.length === 0) usedWords.clear();

      const words = available.length > 0 ? available : bank;
      currentWord = words[Math.floor(Math.random() * words.length)];
      usedWords.add(currentWord.word);

      builtWord = [];
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('targetImage').innerHTML = currentWord.image;
      document.getElementById('targetHint').textContent = `(${currentWord.hint})`;

      renderSlots();
      renderLetterBank();
    }

    function renderSlots() {
      const container = document.getElementById('wordSlots');
      container.innerHTML = '';

      for (let i = 0; i < currentWord.word.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot' + (builtWord[i] ? ' filled' : '');
        slot.textContent = builtWord[i] || '';
        slot.onclick = () => removeLetterAt(i);
        container.appendChild(slot);
      }
    }

    function renderLetterBank() {
      const container = document.getElementById('letterBank');
      container.innerHTML = '';

      const letters = currentWord.word.split('');
      const extras = 'aeiounrstlcmpbdfgh'.split('');
      const extraCount = Math.min(4, 8 - letters.length);

      for (let i = 0; i < extraCount; i++) {
        const extra = extras[Math.floor(Math.random() * extras.length)];
        if (!letters.includes(extra) || Math.random() > 0.5) {
          letters.push(extra);
        }
      }

      letters.sort(() => Math.random() - 0.5);

      letters.forEach((letter, idx) => {
        const tile = document.createElement('button');
        tile.className = 'letter-tile';
        tile.textContent = letter;
        tile.dataset.index = idx;
        tile.onclick = () => addLetter(letter, tile);
        container.appendChild(tile);
      });
    }

    function addLetter(letter, tile) {
      if (builtWord.length < currentWord.word.length) {
        builtWord.push(letter);
        tile.classList.add('used');
        speakLetter(letter);
        renderSlots();
      }
    }

    function removeLetterAt(index) {
      if (builtWord[index]) {
        builtWord.splice(index, 1);
        renderSlots();
        renderLetterBank();
      }
    }

    function clearWord() {
      builtWord = [];
      renderSlots();
      renderLetterBank();
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
    }

    async function checkWord() {
      if (builtWord.length !== currentWord.word.length) return;

      const attempt = builtWord.join('');
      const slots = document.querySelectorAll('.slot');
      sessionTotal++;

      if (attempt === currentWord.word) {
        slots.forEach(s => s.classList.add('correct'));
        document.getElementById('feedback').textContent = 'Correct!';
        document.getElementById('feedback').className = 'feedback correct';
        score += 10 + streak * 2;
        streak++;
        sessionCorrect++;
        document.getElementById('score').textContent = score;
        document.getElementById('streak').textContent = streak;

        speakWord(currentWord.word);

        // Save activity every 10 words
        if (sessionTotal > 0 && sessionTotal % 10 === 0 && currentStudent) {
          await saveActivity();
        }

        setTimeout(newWord, 1500);
      } else {
        slots.forEach((s, i) => {
          if (builtWord[i] !== currentWord.word[i]) s.classList.add('wrong');
        });
        document.getElementById('feedback').textContent = 'Try again!';
        document.getElementById('feedback').className = 'feedback wrong';
        streak = 0;
        document.getElementById('streak').textContent = streak;
      }
    }

    async function saveActivity() {
      if (!currentStudent || sessionTotal === 0) return;
      try {
        await window.FunBookiesDB.saveActivity({
          studentId: currentStudent.id,
          type: 'word-builder',
          level: currentLevel,
          score: sessionCorrect,
          total: sessionTotal,
          duration: Math.round((Date.now() - sessionStartTime) / 1000),
          details: { finalScore: score, bestStreak: streak }
        });
      } catch (e) {
        console.error('Failed to save activity:', e);
      }
    }

    // Save on page unload
    window.addEventListener('beforeunload', () => {
      if (currentStudent && sessionTotal > 0) {
        // Use sendBeacon for reliable save on unload
        const data = {
          studentId: currentStudent.id,
          type: 'word-builder',
          level: currentLevel,
          score: sessionCorrect,
          total: sessionTotal,
          duration: Math.round((Date.now() - sessionStartTime) / 1000),
          details: { finalScore: score, bestStreak: streak }
        };
        // Fallback: just save synchronously
        saveActivity();
      }
    });

    function skipWord() {
      streak = 0;
      document.getElementById('streak').textContent = streak;
      newWord();
    }
  </script>
</body>
