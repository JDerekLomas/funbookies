<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Word Builder - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header { padding-top: var(--space-md); }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 { font-size: 1.5rem; color: var(--color-soft-black); }

    .score-badge {
      background: var(--color-terracotta-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-terracotta-dark);
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .level-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .level-group-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .target-area {
      text-align: center;
      margin-bottom: var(--space-md);
    }

    .target-hint {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      margin-bottom: var(--space-xs);
    }

    .target-image {
      margin-bottom: var(--space-xs);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .target-image img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    .target-image:hover { transform: scale(1.1); }

    .target-word {
      font-size: 1rem;
      color: var(--color-text-muted);
      font-style: italic;
    }

    .word-slots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: var(--space-md);
      min-height: 80px;
    }

    .slot {
      width: 60px;
      height: 70px;
      border: 2px dashed var(--color-border);
      border-radius: var(--border-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 500;
      color: var(--color-charcoal);
      background: var(--color-cream);
      transition: all 0.2s;
      cursor: pointer;
    }

    .slot.filled {
      border-style: solid;
      border-color: var(--color-sage);
      background: var(--color-sage-light);
    }

    .slot.correct {
      border-color: var(--color-success);
      background: #E8F5E9;
    }

    .slot.wrong {
      border-color: var(--color-error);
      background: #FFEBEE;
      animation: shake 0.3s;
    }

    .tap-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      margin-bottom: var(--space-sm);
      opacity: 0.7;
    }

    .letter-bank {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: var(--space-md);
    }

    .letter-tile {
      width: 56px;
      height: 64px;
      background: var(--color-sage);
      border: none;
      border-radius: var(--border-radius);
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 500;
      color: var(--color-white);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 8px rgba(159, 199, 170, 0.3);
    }

    .letter-tile:hover {
      background: var(--color-sage-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(159, 199, 170, 0.4);
    }

    .letter-tile:active { transform: translateY(0) scale(0.95); }

    .letter-tile.used { opacity: 0.3; cursor: not-allowed; }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn-hear {
      font-size: 1.2rem;
      padding: 14px 32px;
    }

    .skip-link {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      text-decoration: none;
    }

    .skip-link:hover {
      text-decoration: underline;
    }

    .feedback {
      text-align: center;
      margin-top: var(--space-md);
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 500;
      min-height: 40px;
    }

    .feedback.correct { color: var(--color-success); }
    .feedback.wrong { color: var(--color-error); }

    .streak {
      text-align: center;
      margin-top: var(--space-sm);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .streak span { color: var(--color-terracotta); font-weight: 700; }

    .streak-fire {
      display: inline-block;
      animation: pulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      border-radius: 2px;
      animation: fall linear forwards;
      pointer-events: none;
      z-index: 1000;
    }

    @keyframes fall {
      to {
        top: 100vh;
        transform: rotate(720deg);
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @media (max-width: 480px) {
      .slot, .letter-tile { width: 48px; height: 56px; font-size: 1.5rem; }
    }

    .student-badge {
      font-size: 0.8rem;
      background: var(--color-sage-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
      color: var(--color-sage-dark);
      vertical-align: middle;
      margin-left: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>

  <script>
    // Audio context for sound effects
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playCorrectSound() {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
      osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialDecayTo && gain.gain.exponentialDecayTo(0.01, ctx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.4);
    }

    function playWrongSound() {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.15);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.15);
    }

    function playStreakSound() {
      const ctx = getAudioContext();
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.2);
        osc.start(ctx.currentTime + i * 0.1);
        osc.stop(ctx.currentTime + i * 0.1 + 0.2);
      });
    }

    // Confetti
    function createConfetti(count = 30) {
      const colors = ['#9FC7AA', '#EFA487', '#A8C4D4', '#E8D4A8', '#FFD700'];
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.style.left = Math.random() * 100 + '%';
          c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          c.style.animationDuration = (Math.random() * 2 + 2) + 's';
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 4000);
        }, i * 30);
      }
    }

    // TTS
    function speak(text, rate = 0.85) {
      if (!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate;
      utterance.pitch = 1.1;
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google') || v.lang.startsWith('en'));
      if (preferred) utterance.voice = preferred;
      window.speechSynthesis.speak(utterance);
    }

    // Use pre-recorded audio files for letter sounds
    let voiceMode = 'names'; // 'names' or 'sounds'
    let letterAudio = null;

    function speakLetter(letter) {
      if (letterAudio) {
        letterAudio.pause();
        letterAudio.currentTime = 0;
      }
      const type = voiceMode === 'sounds' ? 'sounds' : 'names';
      letterAudio = new Audio(`/activities/letter-sounds/openai-us/${type}/${letter.toLowerCase()}.mp3`);
      letterAudio.play().catch(() => {
        // Fallback to Web Speech API if audio fails
        const fallbackNames = {a:'A',b:'B',c:'C',d:'D',e:'E',f:'F',g:'G',h:'H',i:'I',j:'J',k:'K',l:'L',m:'M',n:'N',o:'O',p:'P',q:'Q',r:'R',s:'S',t:'T',u:'U',v:'V',w:'W',x:'X',y:'Y',z:'Z'};
        speak(fallbackNames[letter.toLowerCase()] || letter, 0.8);
      });
    }
    function speakWord(word) { speak(word, 0.75); }

    // Helper to get icon image tag

        { word: 'soon', hint: 'in a bit' },
        { word: 'food', hint: 'you eat it' },
        { word: 'book', hint: 'has pages' },
        { word: 'look', hint: 'see it' },
        { word: 'cook', hint: 'make food' },
        { word: 'good', hint: 'not bad' },
        { word: 'wood', hint: 'from trees' },
        { word: 'foot', hint: 'walk on it' },
      ],
    };

    let currentLevel = 'A4';
    let currentWord = null;
    let builtWord = [];
    let score = 0;
    let streak = 0;
    let bestStreak = 0;
    let usedWords = new Set();
    let currentStudent = null;
    let sessionStartTime = null;
    let sessionCorrect = 0;
    let sessionTotal = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      setupLevelButtons();

      // Show student picker
      const picker = new StudentPicker({
        title: 'Who is building words?',
        allowSkip: true
      });
      currentStudent = await picker.show();

      if (currentStudent) {
        // Show student badge
        const badge = document.getElementById('studentBadge');
        badge.textContent = `${currentStudent.avatar} ${currentStudent.name}`;
        badge.classList.remove('hidden');

        // Auto-set level based on assessed level
        const level = await window.FunBookiesDB.getCurrentLevel(currentStudent.id);
        if (level && wordBanks[level]) {
          currentLevel = level;
          document.querySelectorAll('.chip[data-level]').forEach(b => b.classList.remove('active'));
          const levelBtn = document.querySelector(`.chip[data-level="${level}"]`);
          if (levelBtn) levelBtn.classList.add('active');
        }
      }

      sessionStartTime = Date.now();
      newWord();
    });

    function setupLevelButtons() {
      // Level buttons
      document.querySelectorAll('.chip[data-level]').forEach(btn => {
        btn.addEventListener('click', () => {
          const oldLevel = currentLevel;
          document.querySelectorAll('.chip[data-level]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = btn.dataset.level;
          usedWords.clear();

          // Celebrate level change with confetti
          if (oldLevel !== currentLevel) {
            createConfetti(20);
            playStreakSound();
          }

          newWord();
        });
      });

      // Voice mode buttons
      document.querySelectorAll('.chip[data-voice]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip[data-voice]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          voiceMode = btn.dataset.voice;
        });
      });
    }

    function newWord() {
      const bank = wordBanks[currentLevel] || wordBanks['A4'];
      const available = bank.filter(w => !usedWords.has(w.word));

      if (available.length === 0) usedWords.clear();

      const words = available.length > 0 ? available : bank;
      currentWord = words[Math.floor(Math.random() * words.length)];
      usedWords.add(currentWord.word);

      builtWord = [];
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('targetImage').innerHTML = getWordIcon(currentWord.word);
      document.getElementById('targetHint').textContent = `(${currentWord.hint})`;

      renderSlots();
      renderLetterBank();
    }

    function renderSlots() {
      const container = document.getElementById('wordSlots');
      container.innerHTML = '';

      for (let i = 0; i < currentWord.word.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot' + (builtWord[i] ? ' filled' : '');
        slot.textContent = builtWord[i] || '';
        slot.onclick = () => removeLetterAt(i);
        container.appendChild(slot);
      }
    }

    function renderLetterBank() {
      const container = document.getElementById('letterBank');
      container.innerHTML = '';

      // Always start with all letters from the word
      const letters = [...currentWord.word];

      // Add distractor letters
      const extras = 'aeiounrstlcmpbdfgh';
      const extraCount = Math.min(4, 8 - letters.length);
      for (let i = 0; i < extraCount; i++) {
        letters.push(extras[Math.floor(Math.random() * extras.length)]);
      }

      // Fisher-Yates shuffle (reliable)
      for (let i = letters.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [letters[i], letters[j]] = [letters[j], letters[i]];
      }

      letters.forEach((letter, idx) => {
        const tile = document.createElement('button');
        tile.className = 'letter-tile';
        tile.textContent = letter;
        tile.dataset.index = idx;
        tile.onclick = () => addLetter(letter, tile);
        container.appendChild(tile);
      });
    }

    function addLetter(letter, tile) {
      if (builtWord.length < currentWord.word.length) {
        builtWord.push(letter);
        tile.classList.add('used');
        speakLetter(letter);
        renderSlots();

        // Auto-check when word is complete
        if (builtWord.length === currentWord.word.length) {
          setTimeout(checkWord, 300);
        }
      }
    }

    function removeLetterAt(index) {
      if (builtWord[index]) {
        builtWord.splice(index, 1);
        renderSlots();
        renderLetterBank();
      }
    }

    function clearWord() {
      builtWord = [];
      renderSlots();
      renderLetterBank();
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
    }

    function updateStreakDisplay() {
      const streakEl = document.getElementById('streak');
      streakEl.textContent = streak;

      // Add fire emoji for hot streaks
      if (streak >= 5) {
        streakEl.innerHTML = `<span class="streak-fire">🔥</span> ${streak}`;
      } else if (streak >= 3) {
        streakEl.textContent = `${streak} ⭐`;
      }
    }

    async function checkWord() {
      if (builtWord.length !== currentWord.word.length) return;

      const attempt = builtWord.join('');
      const slots = document.querySelectorAll('.slot');
      sessionTotal++;

      if (attempt === currentWord.word) {
        slots.forEach(s => s.classList.add('correct'));
        score += 10 + streak * 2;
        streak++;
        if (streak > bestStreak) bestStreak = streak;
        sessionCorrect++;
        document.getElementById('score').textContent = score;
        updateStreakDisplay();

        // Audio and visual feedback
        playCorrectSound();

        // Streak milestones get confetti and special sound
        if (streak === 5 || streak === 10 || streak === 15 || streak % 10 === 0) {
          setTimeout(() => {
            playStreakSound();
            createConfetti(streak >= 10 ? 50 : 30);
          }, 300);
          document.getElementById('feedback').textContent = streak >= 10 ? `🔥 Amazing! ${streak} in a row!` : `🎉 ${streak} streak!`;
        } else {
          document.getElementById('feedback').textContent = 'Correct!';
        }
        document.getElementById('feedback').className = 'feedback correct';

        speakWord(currentWord.word);

        // Save activity every 10 words
        if (sessionTotal > 0 && sessionTotal % 10 === 0 && currentStudent) {
          await saveActivity();
        }

        setTimeout(newWord, 1500);
      } else {
        slots.forEach((s, i) => {
          if (builtWord[i] !== currentWord.word[i]) s.classList.add('wrong');
        });
        playWrongSound();
        document.getElementById('feedback').textContent = 'Try again!';
        document.getElementById('feedback').className = 'feedback wrong';
        streak = 0;
        updateStreakDisplay();
      }
    }

    async function saveActivity() {
      if (!currentStudent || sessionTotal === 0) return;
      try {
        await window.FunBookiesDB.saveActivity({
          studentId: currentStudent.id,
          type: 'word-builder',
          level: currentLevel,
          score: sessionCorrect,
          total: sessionTotal,
          duration: Math.round((Date.now() - sessionStartTime) / 1000),
          details: { finalScore: score, bestStreak: bestStreak }
        });
      } catch (e) {
        console.error('Failed to save activity:', e);
      }
    }

    // Save on page unload
    window.addEventListener('beforeunload', () => {
      if (currentStudent && sessionTotal > 0) {
        // Use sendBeacon for reliable save on unload
        const data = {
          studentId: currentStudent.id,
          type: 'word-builder',
          level: currentLevel,
          score: sessionCorrect,
          total: sessionTotal,
          duration: Math.round((Date.now() - sessionStartTime) / 1000),
          details: { finalScore: score, bestStreak: bestStreak }
        };
        // Fallback: just save synchronously
        saveActivity();
      }
    });

    function skipWord() {
      streak = 0;
      updateStreakDisplay();
      newWord();
    }
  </script>
</body>
</html>
