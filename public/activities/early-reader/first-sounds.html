<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>First Sounds - Early Reader - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header { padding-top: var(--space-md); }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 { font-size: 1.5rem; }

    .score-badge {
      background: var(--color-sage-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-sage-dark);
    }

    .activity-area {
      text-align: center;
      padding: var(--space-md) 0;
    }

    .word-display {
      margin-bottom: var(--space-lg);
    }

    .word-image {
      font-size: 6rem;
      margin-bottom: var(--space-sm);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .word-image:hover { transform: scale(1.1); }
    .word-image:active { transform: scale(0.95); }

    .word-image.speaking {
      animation: bounce 0.5s;
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .prompt-text {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--color-charcoal);
      margin-bottom: var(--space-md);
    }

    .prompt-text .word-highlight {
      color: var(--color-sage-dark);
      font-weight: 600;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
      max-width: 400px;
      margin: 0 auto var(--space-lg);
    }

    .choice-btn {
      padding: var(--space-lg);
      border-radius: var(--border-radius-lg);
      border: 3px solid var(--color-border);
      background: white;
      font-size: 3rem;
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .choice-btn:hover {
      border-color: var(--color-sage);
      transform: scale(1.05);
    }

    .choice-btn.correct {
      border-color: var(--color-sage);
      background: var(--color-sage-light);
      animation: correctPop 0.5s;
    }

    .choice-btn.incorrect {
      border-color: var(--color-terracotta);
      background: #fef3f2;
      animation: shake 0.5s;
    }

    .choice-btn:disabled {
      cursor: default;
      transform: none;
    }

    @keyframes correctPop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .feedback {
      font-family: var(--font-display);
      font-size: 1.3rem;
      min-height: 2em;
      margin-bottom: var(--space-md);
    }

    .feedback.correct { color: var(--color-sage-dark); font-weight: 600; }
    .feedback.incorrect { color: var(--color-terracotta); }
    .feedback.waiting { color: var(--color-text-muted); }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-hear {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
    }

    .btn-hear:hover {
      background: linear-gradient(135deg, #e080ea, #e04858);
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: var(--space-lg);
    }

    .progress-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--color-border);
      transition: all 0.2s;
    }

    .progress-dot.done { background: var(--color-sage); }
    .progress-dot.current { background: var(--color-terracotta); transform: scale(1.3); }

    .celebration {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      animation: celebrate 0.6s ease-out forwards;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes celebrate {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 8px;
    }

    .student-badge {
      font-size: 0.8rem;
      background: var(--color-sage-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
      color: var(--color-sage-dark);
      margin-left: 8px;
    }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .word-image { font-size: 5rem; }
      .choice-btn { font-size: 2.5rem; padding: var(--space-md); }
      .choices { gap: var(--space-sm); }
    }
  </style>
</head>
<body>
  <script src="/js/data-service.js"></script>
  <script src="/js/student-picker.js"></script>
  <div class="container-narrow">
    <div class="page-header">
      <a href="/activities/early-reader/" class="back-link">&larr; Back to Early Reader</a>
    </div>

    <div class="game-card">
      <div class="game-header">
        <h1>First Sounds <span id="studentBadge" class="student-badge hidden"></span></h1>
        <div>
          <span class="score-badge">Score: <span id="score">0</span></span>
          <span id="streakBadge" class="streak-badge hidden">🔥 <span id="streakCount">0</span></span>
        </div>
      </div>

      <div class="activity-area">
        <div class="word-display">
          <div class="word-image" id="wordImage" onclick="playWord()">🐱</div>
        </div>

        <div class="prompt-text" id="promptText">
          What sound does <span class="word-highlight" id="wordHighlight">CAT</span> start with?
        </div>

        <div class="choices" id="choices">
          <button class="choice-btn" onclick="checkAnswer('C')">C</button>
          <button class="choice-btn" onclick="checkAnswer('D')">D</button>
          <button class="choice-btn" onclick="checkAnswer('B')">B</button>
          <button class="choice-btn" onclick="checkAnswer('M')">M</button>
        </div>

        <div class="feedback waiting" id="feedback">Tap the picture to hear the word!</div>

        <div class="controls">
          <button class="btn btn-hear" onclick="playWord()">🔊 Hear Word</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextWord()" disabled>Next →</button>
        </div>

        <div class="progress" id="progress"></div>
      </div>
    </div>
  </div>

  <script>
    // Word bank with images and initial sounds
    const words = [
      { word: 'cat', letter: 'C', image: '🐱' },
      { word: 'dog', letter: 'D', image: '🐕' },
      { word: 'sun', letter: 'S', image: '☀️' },
      { word: 'ball', letter: 'B', image: '⚽' },
      { word: 'fish', letter: 'F', image: '🐟' },
      { word: 'hat', letter: 'H', image: '🎩' },
      { word: 'moon', letter: 'M', image: '🌙' },
      { word: 'pig', letter: 'P', image: '🐷' },
      { word: 'ring', letter: 'R', image: '💍' },
      { word: 'tree', letter: 'T', image: '🌳' },
      { word: 'van', letter: 'V', image: '🚐' },
      { word: 'web', letter: 'W', image: '🕸️' },
      { word: 'lion', letter: 'L', image: '🦁' },
      { word: 'nest', letter: 'N', image: '🪺' },
      { word: 'goat', letter: 'G', image: '🐐' },
      { word: 'kite', letter: 'K', image: '🪁' },
      { word: 'jam', letter: 'J', image: '🫙' },
      { word: 'queen', letter: 'Q', image: '👑' },
      { word: 'yo-yo', letter: 'Y', image: '🪀' },
      { word: 'zebra', letter: 'Z', image: '🦓' },
      { word: 'apple', letter: 'A', image: '🍎' },
      { word: 'egg', letter: 'E', image: '🥚' },
      { word: 'igloo', letter: 'I', image: '🏠' },
      { word: 'octopus', letter: 'O', image: '🐙' },
      { word: 'umbrella', letter: 'U', image: '☂️' },
      { word: 'fox', letter: 'F', image: '🦊' },
      { word: 'bear', letter: 'B', image: '🐻' },
      { word: 'car', letter: 'C', image: '🚗' },
      { word: 'duck', letter: 'D', image: '🦆' },
      { word: 'star', letter: 'S', image: '⭐' },
    ];

    // All possible letters for distractors
    const allLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    // State
    let currentWord = null;
    let wordIndex = 0;
    let roundWords = [];
    let score = 0;
    let streak = 0;
    let answered = false;
    let currentStudent = null;
    let sessionStartTime = null;
    const ROUND_SIZE = 10;

    document.addEventListener('DOMContentLoaded', async () => {
      // Show student picker
      if (window.StudentPicker) {
        const picker = new StudentPicker({
          title: 'Who is playing?',
          allowSkip: true
        });
        currentStudent = await picker.show();

        if (currentStudent) {
          const badge = document.getElementById('studentBadge');
          badge.textContent = `${currentStudent.avatar} ${currentStudent.name}`;
          badge.classList.remove('hidden');
        }
      }

      sessionStartTime = Date.now();
      startRound();
    });

    function startRound() {
      wordIndex = 0;
      roundWords = [...words].sort(() => Math.random() - 0.5).slice(0, ROUND_SIZE);
      loadWord();
      renderProgress();
    }

    function loadWord() {
      currentWord = roundWords[wordIndex];
      answered = false;

      // Update display
      document.getElementById('wordImage').textContent = currentWord.image;
      document.getElementById('wordImage').classList.remove('speaking');
      document.getElementById('wordHighlight').textContent = currentWord.word.toUpperCase();
      document.getElementById('feedback').textContent = 'Tap the picture to hear the word!';
      document.getElementById('feedback').className = 'feedback waiting';
      document.getElementById('nextBtn').disabled = true;

      // Generate choices
      generateChoices();
      renderProgress();

      // Auto-play word
      setTimeout(() => playWord(), 300);
    }

    function generateChoices() {
      const container = document.getElementById('choices');
      container.innerHTML = '';

      // Get correct answer and 3 distractors
      const correct = currentWord.letter;
      const distractors = allLetters
        .filter(l => l !== correct)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

      const options = [correct, ...distractors].sort(() => Math.random() - 0.5);

      options.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = letter;
        btn.onclick = () => checkAnswer(letter);
        container.appendChild(btn);
      });
    }

    function playWord() {
      const imageEl = document.getElementById('wordImage');
      imageEl.classList.add('speaking');

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(currentWord.word);
        utterance.rate = 0.8;
        utterance.onend = () => imageEl.classList.remove('speaking');
        speechSynthesis.speak(utterance);
      } else {
        setTimeout(() => imageEl.classList.remove('speaking'), 500);
      }
    }

    function checkAnswer(letter) {
      if (answered) return;
      answered = true;

      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === currentWord.letter) {
          btn.classList.add('correct');
        } else if (btn.textContent === letter && letter !== currentWord.letter) {
          btn.classList.add('incorrect');
        }
      });

      if (letter === currentWord.letter) {
        handleCorrect();
      } else {
        handleIncorrect();
      }
    }

    function handleCorrect() {
      score++;
      streak++;
      document.getElementById('score').textContent = score;

      if (streak >= 3) {
        document.getElementById('streakBadge').classList.remove('hidden');
        document.getElementById('streakCount').textContent = streak;
      }

      document.getElementById('feedback').textContent =
        `🎉 Yes! "${currentWord.word}" starts with ${currentWord.letter}!`;
      document.getElementById('feedback').className = 'feedback correct';
      document.getElementById('nextBtn').disabled = false;

      // Say the sound
      if ('speechSynthesis' in window) {
        setTimeout(() => {
          const soundUtterance = new SpeechSynthesisUtterance(
            `${currentWord.letter}... ${currentWord.letter.toLowerCase()} for ${currentWord.word}`
          );
          soundUtterance.rate = 0.8;
          speechSynthesis.speak(soundUtterance);
        }, 500);
      }

      showCelebration();
    }

    function handleIncorrect() {
      streak = 0;
      document.getElementById('streakBadge').classList.add('hidden');

      document.getElementById('feedback').textContent =
        `Not quite! "${currentWord.word}" starts with ${currentWord.letter}`;
      document.getElementById('feedback').className = 'feedback incorrect';
      document.getElementById('nextBtn').disabled = false;

      // Say the correct sound
      if ('speechSynthesis' in window) {
        setTimeout(() => {
          const soundUtterance = new SpeechSynthesisUtterance(
            `${currentWord.word} starts with ${currentWord.letter}`
          );
          soundUtterance.rate = 0.8;
          speechSynthesis.speak(soundUtterance);
        }, 500);
      }
    }

    function showCelebration() {
      const emojis = ['⭐', '🌟', '✨', '🎉', '👏', '🎯'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];

      const celebration = document.createElement('div');
      celebration.className = 'celebration';
      celebration.textContent = emoji;
      document.body.appendChild(celebration);

      setTimeout(() => celebration.remove(), 600);
    }

    function renderProgress() {
      const container = document.getElementById('progress');
      container.innerHTML = '';

      for (let i = 0; i < ROUND_SIZE; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i < wordIndex) dot.classList.add('done');
        if (i === wordIndex) dot.classList.add('current');
        container.appendChild(dot);
      }
    }

    async function nextWord() {
      wordIndex++;

      if (wordIndex >= ROUND_SIZE) {
        // Round complete
        document.getElementById('promptText').innerHTML =
          `<span class="word-highlight">🎉 Round Complete!</span>`;
        document.getElementById('feedback').textContent =
          `You got ${score} out of ${ROUND_SIZE}! Starting new round...`;
        document.getElementById('feedback').className = 'feedback correct';
        document.getElementById('choices').innerHTML = '';

        // Save activity
        if (currentStudent && window.FunBookiesDB) {
          try {
            await window.FunBookiesDB.saveActivity({
              studentId: currentStudent.id,
              type: 'first-sounds',
              level: 'A0',
              score: score,
              total: ROUND_SIZE,
              duration: Math.round((Date.now() - sessionStartTime) / 1000),
              details: { streak }
            });
          } catch (e) {
            console.error('Failed to save:', e);
          }
        }

        score = 0;
        setTimeout(startRound, 2500);
      } else {
        loadWord();
      }
    }
  </script>
</body>
</html>
