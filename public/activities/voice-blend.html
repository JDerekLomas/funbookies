<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Blend It Out - Voice Activity - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header { padding-top: var(--space-md); }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 { font-size: 1.5rem; }

    .score-badge {
      background: var(--color-sage-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-sage-dark);
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .level-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .level-group-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .activity-area {
      text-align: center;
      padding: var(--space-md) 0;
    }

    .sound-display {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: var(--space-lg);
      min-height: 120px;
      align-items: center;
    }

    .sound-box {
      width: 90px;
      height: 100px;
      background: var(--color-cream);
      border: 3px solid var(--color-border);
      border-radius: var(--border-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 500;
      color: var(--color-charcoal);
      transition: all 0.3s;
    }

    .sound-box.speaking {
      background: var(--color-sage);
      border-color: var(--color-sage-dark);
      color: white;
      transform: scale(1.1);
    }

    .sound-box.done {
      background: var(--color-sage-light);
      border-color: var(--color-sage);
    }

    .image-hint {
      font-size: 5rem;
      margin-bottom: var(--space-md);
      opacity: 0;
      transition: opacity 0.5s;
    }

    .image-hint.visible { opacity: 1; }

    .prompt-text {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--color-charcoal);
      margin-bottom: var(--space-md);
      min-height: 2em;
    }

    .mic-button {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--color-terracotta);
      border: none;
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-md);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .mic-button:hover {
      transform: scale(1.05);
      background: var(--color-terracotta-dark);
    }

    .mic-button.recording {
      background: #e74c3c;
      animation: pulse-mic 1s infinite;
    }

    .mic-button.success {
      background: var(--color-sage);
    }

    .mic-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 4px 25px rgba(231, 76, 60, 0.6); }
    }

    .feedback {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 600;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .feedback.correct { color: var(--color-sage-dark); }
    .feedback.incorrect { color: var(--color-terracotta); }
    .feedback.waiting { color: var(--color-text-muted); }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: var(--space-md);
    }

    .btn-hear { background: var(--color-sage-light); color: var(--color-sage-dark); }
    .btn-hear:hover { background: var(--color-sage); color: white; }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: var(--space-md);
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-border);
      transition: all 0.2s;
    }

    .progress-dot.done { background: var(--color-sage); }
    .progress-dot.current { background: var(--color-terracotta); transform: scale(1.3); }

    .speech-not-supported {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: var(--border-radius);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
      color: #856404;
    }

    .celebration {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      animation: celebrate 0.5s ease-out;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes celebrate {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 8px;
    }

    .student-badge {
      font-size: 0.8rem;
      background: var(--color-sage-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
      color: var(--color-sage-dark);
      margin-left: 8px;
    }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .sound-box { width: 70px; height: 80px; font-size: 1.8rem; }
      .mic-button { width: 80px; height: 80px; font-size: 2rem; }
    }
  </style>
</head>
<body>
  <script src="/js/data-service.js"></script>
  <script src="/js/student-picker.js"></script>
  <script src="/js/audio-utils.js"></script>
  <div class="container-narrow">
    <div class="page-header">
      <a href="/activities/" class="back-link">&larr; Back to Activities</a>
    </div>

    <div class="game-card">
      <div class="game-header">
        <h1>Blend It Out <span id="studentBadge" class="student-badge hidden"></span></h1>
        <div>
          <span class="score-badge">Score: <span id="score">0</span></span>
          <span id="streakBadge" class="streak-badge hidden">🔥 <span id="streakCount">0</span></span>
        </div>
      </div>

      <div id="speechWarning" class="speech-not-supported hidden">
        Your browser doesn't support speech recognition. Try Chrome or Edge for the best experience.
      </div>

      <div class="level-select">
        <div class="level-group">
          <span class="level-group-label">A:</span>
          <button class="chip active" data-level="A4">A4</button>
        </div>
        <div class="level-group">
          <span class="level-group-label">B:</span>
          <button class="chip" data-level="B1">B1</button>
          <button class="chip" data-level="B2">B2</button>
          <button class="chip" data-level="B3">B3</button>
          <button class="chip" data-level="B5">B5</button>
          <button class="chip" data-level="B6">B6</button>
          <button class="chip" data-level="B7">B7</button>
          <button class="chip" data-level="B8">B8</button>
        </div>
        <div class="level-group">
          <span class="level-group-label">C:</span>
          <button class="chip" data-level="C1">C1</button>
          <button class="chip" data-level="C3">C3</button>
        </div>
      </div>

      <div class="activity-area">
        <div class="image-hint" id="imageHint"></div>
        <div class="sound-display" id="soundDisplay"></div>
        <div class="prompt-text" id="promptText">Tap the speaker to hear the sounds!</div>

        <button class="mic-button" id="micButton" disabled>🎤</button>

        <div class="feedback waiting" id="feedback">Listen to the sounds first</div>

        <div class="controls">
          <button class="btn btn-hear" id="hearBtn" onclick="playSounds()">🔊 Hear Sounds</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextWord()" disabled>Next →</button>
          <button class="btn btn-secondary" onclick="skipWord()">Skip</button>
        </div>

        <div class="progress" id="progress"></div>
      </div>
    </div>
  </div>

      ],

        { word: 'car', sounds: ['c', 'ar'], image: '🚗' },

        { word: 'coat', sounds: ['c', 'oa', 't'], image: '🧥' },
        { word: 'snow', sounds: ['sn', 'ow'], image: '❄️' },

      ],

        // Silent Letters
        { word: 'knight', sounds: ['n', 'ī', 't'], image: '🗡️' },
        { word: 'know', sounds: ['n', 'ō'], image: '🧠' },
        { word: 'write', sounds: ['r', 'ī', 't'], image: '✍️' },
        { word: 'wrap', sounds: ['r', 'a', 'p'], image: '🎁' },
        { word: 'gnome', sounds: ['n', 'ō', 'm'], image: '🧙' },
        { word: 'sign', sounds: ['s', 'ī', 'n'], image: '🪧' },
        { word: 'lamb', sounds: ['l', 'a', 'm'], image: '🐑' },
        { word: 'thumb', sounds: ['th', 'u', 'm'], image: '👍' },
      ],
      'C3': [
        // Two-Syllable Closed
        { word: 'kitten', sounds: ['ki', 'ten'], image: '🐱' },
        { word: 'rabbit', sounds: ['ra', 'bit'], image: '🐰' },

    // Phoneme pronunciations for TTS
    const phonemeSpeak = {
      // Short vowels
      'a': 'ah', 'e': 'eh', 'i': 'ih', 'o': 'ah', 'u': 'uh',
      // Long vowels
      'ā': 'ay', 'ē': 'ee', 'ī': 'eye', 'ō': 'oh', 'ū': 'you',
      // R-controlled
      'ar': 'arr', 'or': 'orr', 'er': 'err', 'ir': 'err', 'ur': 'err',
      // Vowel teams
      'ai': 'ay', 'ay': 'ay', 'ee': 'ee', 'ea': 'ee',
      'oa': 'oh', 'ow': 'oh', 'oi': 'oy', 'oy': 'oy',
      // Digraphs
      'sh': 'shh', 'ch': 'chh', 'th': 'thh', 'ng': 'ng', 'wh': 'wh',
      // Blends
      'fr': 'frr', 'cr': 'crr', 'fl': 'fll', 'dr': 'drr',
      'st': 'stt', 'sw': 'sww', 'cl': 'cll', 'gr': 'grr',
      'tr': 'trr', 'sn': 'snn', 'pl': 'pll', 'sl': 'sll',
      // Syllables
      'ki': 'kih', 'ra': 'rah', 'bas': 'bass', 'hi': 'hih',
      'su': 'suh', 'bu': 'buh', 'pu': 'puh', 'co': 'cah',
      'ten': 'ten', 'bit': 'bit', 'ket': 'ket', 'den': 'den',
      'ton': 'ton', 'pet': 'pet',
    };

    // State
    let currentLevel = 'A4';
    let currentWord = null;
    let wordIndex = 0;
    let roundWords = [];
    let score = 0;
    let streak = 0;
    let hasListened = false;
    let recognition = null;
    let currentStudent = null;
    let sessionStartTime = null;
    let attempts = 0;

    // Check for speech recognition support
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    document.addEventListener('DOMContentLoaded', async () => {
      // Check speech recognition support
      if (!SpeechRecognition) {
        document.getElementById('speechWarning').classList.remove('hidden');
        document.getElementById('micButton').disabled = true;
      } else {
        setupSpeechRecognition();
      }

      setupLevelButtons();

      // Show student picker
      if (window.StudentPicker) {
        const picker = new StudentPicker({
          title: 'Who is practicing?',
          allowSkip: true
        });
        currentStudent = await picker.show();

        if (currentStudent) {
          const badge = document.getElementById('studentBadge');
          badge.textContent = `${currentStudent.avatar} ${currentStudent.name}`;
          badge.classList.remove('hidden');

          // Auto-set level
          const level = await window.FunBookiesDB?.getCurrentLevel(currentStudent.id);
          if (level && wordBanks[level]) {
            currentLevel = level;
            document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
            const levelBtn = document.querySelector(`.chip[data-level="${level}"]`);
            if (levelBtn) levelBtn.classList.add('active');
          }
        }
      }

      sessionStartTime = Date.now();
      startRound();
    });

    function setupSpeechRecognition() {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        document.getElementById('micButton').classList.add('recording');
        document.getElementById('feedback').textContent = 'Listening...';
        document.getElementById('feedback').className = 'feedback waiting';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase().trim();
        checkAnswer(transcript);
      };

      recognition.onerror = (event) => {
        console.error('Speech error:', event.error);
        document.getElementById('micButton').classList.remove('recording');
        if (event.error === 'no-speech') {
          document.getElementById('feedback').textContent = "I didn't hear anything. Try again!";
        } else {
          document.getElementById('feedback').textContent = "Let's try again!";
        }
        document.getElementById('feedback').className = 'feedback waiting';
      };

      recognition.onend = () => {
        document.getElementById('micButton').classList.remove('recording');
      };
    }

    function setupLevelButtons() {
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = btn.dataset.level;
          startRound();
        });
      });
    }

    function startRound() {
      wordIndex = 0;
      const bank = wordBanks[currentLevel] || wordBanks['A4'];
      roundWords = [...bank].sort(() => Math.random() - 0.5).slice(0, 5);
      loadWord();
      renderProgress();
    }

    function loadWord() {
      currentWord = roundWords[wordIndex];
      hasListened = false;
      attempts = 0;

      // Reset UI
      document.getElementById('imageHint').textContent = currentWord.image;
      document.getElementById('imageHint').classList.remove('visible');
      document.getElementById('promptText').textContent = 'Tap the speaker to hear the sounds!';
      document.getElementById('feedback').textContent = 'Listen to the sounds first';
      document.getElementById('feedback').className = 'feedback waiting';
      document.getElementById('micButton').disabled = true;
      document.getElementById('micButton').classList.remove('success');
      document.getElementById('nextBtn').disabled = true;

      // Render sound boxes
      renderSoundBoxes();
      renderProgress();
    }

    function renderSoundBoxes() {
      const container = document.getElementById('soundDisplay');
      container.innerHTML = '';

      currentWord.sounds.forEach((sound, idx) => {
        const box = document.createElement('div');
        box.className = 'sound-box';
        box.id = `sound-${idx}`;
        box.textContent = sound;
        container.appendChild(box);
      });
    }

    function renderProgress() {
      const container = document.getElementById('progress');
      container.innerHTML = '';

      for (let i = 0; i < roundWords.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i < wordIndex) dot.classList.add('done');
        if (i === wordIndex) dot.classList.add('current');
        container.appendChild(dot);
      }
    }

    async function playSounds() {
      hasListened = true;
      document.getElementById('hearBtn').disabled = true;
      document.getElementById('promptText').textContent = 'What word is this?';

      const boxes = document.querySelectorAll('.sound-box');

      for (let i = 0; i < currentWord.sounds.length; i++) {
        boxes[i].classList.add('speaking');

        const sound = currentWord.sounds[i];
        // Pass sound directly - AudioUtils will use pre-recorded phoneme files
        await speakPhoneme(sound);

        await sleep(400);
        boxes[i].classList.remove('speaking');
        boxes[i].classList.add('done');
        await sleep(200);
      }

      // Enable mic button
      document.getElementById('micButton').disabled = false;
      document.getElementById('hearBtn').disabled = false;
      document.getElementById('feedback').textContent = 'Now say the word!';
      document.getElementById('feedback').className = 'feedback waiting';
    }

    // Use AudioUtils for all sound playback
    function speakPhoneme(sound) {
      // AudioUtils.playSound handles both single letters and multi-char phonemes
      // with pre-recorded audio files, falling back to TTS if needed
      return AudioUtils.playSound(sound);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function startRecording() {
      if (!recognition || !hasListened) return;

      try {
        recognition.start();
        attempts++;
      } catch (e) {
        console.error('Recognition error:', e);
      }
    }

    function checkAnswer(transcript) {
      const targetWord = currentWord.word.toLowerCase();
      const spoken = transcript.toLowerCase().replace(/[^a-z]/g, '');

      // Check for exact match or close match
      const isCorrect = spoken === targetWord ||
                        spoken.includes(targetWord) ||
                        targetWord.includes(spoken) ||
                        levenshteinDistance(spoken, targetWord) <= 1;

      if (isCorrect) {
        handleCorrect();
      } else {
        handleIncorrect(transcript);
      }
    }

    function handleCorrect() {
      score++;
      streak++;
      document.getElementById('score').textContent = score;

      // Update streak badge
      if (streak >= 3) {
        document.getElementById('streakBadge').classList.remove('hidden');
        document.getElementById('streakCount').textContent = streak;
      }

      // Show feedback
      document.getElementById('feedback').innerHTML = `🎉 Yes! <strong>${currentWord.word.toUpperCase()}</strong>!`;
      document.getElementById('feedback').className = 'feedback correct';
      document.getElementById('micButton').classList.add('success');
      document.getElementById('micButton').disabled = true;
      document.getElementById('nextBtn').disabled = false;

      // Show image
      document.getElementById('imageHint').classList.add('visible');

      // Say the word
      speakWord(currentWord.word);

      // Celebrate
      showCelebration();
    }

    function handleIncorrect(transcript) {
      streak = 0;
      document.getElementById('streakBadge').classList.add('hidden');

      if (attempts < 3) {
        document.getElementById('feedback').innerHTML = `I heard "${transcript}". Let's try again!`;
        document.getElementById('feedback').className = 'feedback incorrect';

        // Replay sounds after a moment
        setTimeout(() => {
          document.getElementById('feedback').textContent = 'Listen again...';
          playSounds();
        }, 1500);
      } else {
        // After 3 attempts, show the answer
        document.getElementById('feedback').innerHTML = `The word is <strong>${currentWord.word.toUpperCase()}</strong>`;
        document.getElementById('feedback').className = 'feedback incorrect';
        document.getElementById('imageHint').classList.add('visible');
        document.getElementById('nextBtn').disabled = false;
        document.getElementById('micButton').disabled = true;
        speakWord(currentWord.word);
      }
    }

    function speakWord(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.rate = 0.8;
        speechSynthesis.speak(utterance);
      }
    }

    function showCelebration() {
      const emojis = ['⭐', '🌟', '✨', '🎉', '🎊', '👏', '🙌'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];

      const celebration = document.createElement('div');
      celebration.className = 'celebration';
      celebration.textContent = emoji;
      document.body.appendChild(celebration);

      setTimeout(() => celebration.remove(), 500);
    }

    function skipWord() {
      streak = 0;
      document.getElementById('streakBadge').classList.add('hidden');
      nextWord();
    }

    async function nextWord() {
      wordIndex++;

      if (wordIndex >= roundWords.length) {
        // Round complete
        document.getElementById('promptText').textContent = '🎉 Round complete!';
        document.getElementById('feedback').textContent = 'Starting new round...';

        // Save activity
        if (currentStudent && window.FunBookiesDB) {
          try {
            await window.FunBookiesDB.saveActivity({
              studentId: currentStudent.id,
              type: 'voice-blend',
              level: currentLevel,
              score: score,
              total: roundWords.length,
              duration: Math.round((Date.now() - sessionStartTime) / 1000),
              details: { streak: streak }
            });
          } catch (e) {
            console.error('Failed to save:', e);
          }
        }

        setTimeout(startRound, 2000);
      } else {
        loadWord();
      }
    }

    // Levenshtein distance for fuzzy matching
    function levenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) {
        matrix[i] = [i];
      }
      for (let j = 0; j <= a.length; j++) {
        matrix[0][j] = j;
      }
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    // Event listeners
    document.getElementById('micButton').addEventListener('click', startRecording);
  </script>
</body>
