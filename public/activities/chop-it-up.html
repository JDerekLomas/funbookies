<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Chop It Up - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header { padding-top: var(--space-md); }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 { font-size: 1.4rem; }

    .score-badge {
      background: var(--color-sage-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-sage-dark);
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .activity-area {
      text-align: center;
      padding: var(--space-md) 0;
    }

    .word-display {
      margin-bottom: var(--space-lg);
    }

    .word-image {
      width: 100px;
      height: 100px;
      margin: 0 auto var(--space-sm);
    }

    .word-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .word-text {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--color-charcoal);
      letter-spacing: 0.1em;
    }

    .instruction {
      font-size: 1.1rem;
      color: var(--color-text-muted);
      margin-bottom: var(--space-md);
    }

    .sound-boxes {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: var(--space-lg);
      min-height: 100px;
      align-items: center;
      flex-wrap: wrap;
    }

    .sound-box {
      width: 80px;
      height: 90px;
      background: var(--color-cream);
      border: 3px solid var(--color-border);
      border-radius: var(--border-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 600;
      color: var(--color-charcoal);
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
    }

    .sound-box:hover:not(.revealed) {
      transform: scale(1.05);
      border-color: var(--color-sage);
      background: var(--color-sage-light);
    }

    .sound-box.current {
      border-color: var(--color-terracotta);
      background: var(--color-terracotta-light);
      animation: pulse 1s ease-in-out infinite;
    }

    .sound-box.revealed {
      border-color: var(--color-sage);
      border-style: solid;
      background: white;
      cursor: pointer;
    }

    .sound-box.revealed:hover {
      background: var(--color-sage-light);
    }

    .sound-box .box-number {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 24px;
      height: 24px;
      background: var(--color-charcoal);
      color: white;
      border-radius: 50%;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sound-box.revealed .box-number {
      background: var(--color-sage);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .hear-word-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      font-size: 2.5rem;
      margin-bottom: var(--space-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-md);
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: var(--space-md);
    }

    .btn-next {
      padding: 14px 32px;
      font-size: 1.1rem;
    }

    .feedback {
      font-size: 1.2rem;
      padding: 12px;
      border-radius: var(--border-radius);
      margin-bottom: var(--space-md);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback.success {
      background: var(--color-sage-light);
      color: var(--color-sage-dark);
    }

    .streak {
      text-align: center;
      margin-top: var(--space-md);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .streak span { color: var(--color-terracotta); font-weight: 700; }

    .student-badge {
      font-size: 0.8rem;
      background: var(--color-sage-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
      color: var(--color-sage-dark);
      margin-left: 8px;
    }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .sound-box { width: 65px; height: 75px; font-size: 1.5rem; }
      .word-text { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <script src="/js/data-service.js"></script>
  <script src="/js/student-picker.js"></script>
  <script src="/js/audio-utils.js"></script>
  <div class="container-narrow">
    <div class="page-header">
      <a href="/activities/" class="back-link">&larr; Back to Activities</a>
    </div>

    <div class="game-card">
      <div class="game-header">
        <h1>Chop It Up <span id="studentBadge" class="student-badge hidden"></span></h1>
        <div class="score-badge">Words: <span id="wordCount">0</span></div>
      </div>

      <div class="level-select">
        <button class="chip active" data-level="A4">CVC</button>
        <button class="chip" data-level="B3">Blends</button>
        <button class="chip" data-level="B5">Digraphs</button>
      </div>

      <div class="activity-area">
        <button class="btn btn-primary hear-word-btn" onclick="playWord()" title="Hear the word">
          🔊
        </button>

        <div class="word-display">
          <div class="word-image" id="wordImage"></div>
          <div class="word-text" id="wordText">cat</div>
        </div>

        <p class="instruction" id="instruction">Tap each box to hear and reveal the sounds!</p>

        <div class="sound-boxes" id="soundBoxes"></div>

        <div class="feedback hidden" id="feedback"></div>

        <div class="controls">
          <button class="btn btn-primary btn-next hidden" id="nextBtn" onclick="nextWord()">
            Next Word →
          </button>
        </div>
      </div>

      <div class="streak">Words chopped: <span id="streak">0</span></div>
    </div>
  </div>

  <script>
    // Word banks with phoneme segmentation
    const wordBanks = {
      'A4': [
        { word: 'cat', sounds: ['c', 'a', 't'], image: '🐱' },
        { word: 'dog', sounds: ['d', 'o', 'g'], image: '🐕' },
        { word: 'sun', sounds: ['s', 'u', 'n'], image: '☀️' },
        { word: 'hat', sounds: ['h', 'a', 't'], image: '🎩' },
        { word: 'pig', sounds: ['p', 'i', 'g'], image: '🐷' },
        { word: 'cup', sounds: ['c', 'u', 'p'], image: '🥤' },
        { word: 'bed', sounds: ['b', 'e', 'd'], image: '🛏️' },
        { word: 'fox', sounds: ['f', 'o', 'x'], image: '🦊' },
        { word: 'map', sounds: ['m', 'a', 'p'], image: '🗺️' },
        { word: 'pen', sounds: ['p', 'e', 'n'], image: '🖊️' },
        { word: 'bus', sounds: ['b', 'u', 's'], image: '🚌' },
        { word: 'bat', sounds: ['b', 'a', 't'], image: '🦇' },
        { word: 'net', sounds: ['n', 'e', 't'], image: '🥅' },
        { word: 'pot', sounds: ['p', 'o', 't'], image: '🍲' },
        { word: 'fan', sounds: ['f', 'a', 'n'], image: '🪭' },
        { word: 'log', sounds: ['l', 'o', 'g'], image: '🪵' },
        { word: 'rug', sounds: ['r', 'u', 'g'], image: '🧶' },
        { word: 'jam', sounds: ['j', 'a', 'm'], image: '🍓' },
      ],
      'B3': [
        { word: 'frog', sounds: ['f', 'r', 'o', 'g'], image: '🐸' },
        { word: 'crab', sounds: ['c', 'r', 'a', 'b'], image: '🦀' },
        { word: 'flag', sounds: ['f', 'l', 'a', 'g'], image: '🚩' },
        { word: 'drum', sounds: ['d', 'r', 'u', 'm'], image: '🥁' },
        { word: 'swim', sounds: ['s', 'w', 'i', 'm'], image: '🏊' },
        { word: 'stop', sounds: ['s', 't', 'o', 'p'], image: '🛑' },
        { word: 'clap', sounds: ['c', 'l', 'a', 'p'], image: '👏' },
        { word: 'snap', sounds: ['s', 'n', 'a', 'p'], image: '🫰' },
        { word: 'grin', sounds: ['g', 'r', 'i', 'n'], image: '😁' },
        { word: 'spin', sounds: ['s', 'p', 'i', 'n'], image: '🌀' },
        { word: 'skip', sounds: ['s', 'k', 'i', 'p'], image: '🦘' },
        { word: 'plum', sounds: ['p', 'l', 'u', 'm'], image: '🫐' },
        { word: 'sled', sounds: ['s', 'l', 'e', 'd'], image: '🛷' },
        { word: 'step', sounds: ['s', 't', 'e', 'p'], image: '👣' },
      ],
      'B5': [
        { word: 'ship', sounds: ['sh', 'i', 'p'], image: '🚢' },
        { word: 'fish', sounds: ['f', 'i', 'sh'], image: '🐟' },
        { word: 'dish', sounds: ['d', 'i', 'sh'], image: '🍽️' },
        { word: 'shop', sounds: ['sh', 'o', 'p'], image: '🏪' },
        { word: 'chat', sounds: ['ch', 'a', 't'], image: '💬' },
        { word: 'chin', sounds: ['ch', 'i', 'n'], image: '🧔' },
        { word: 'chop', sounds: ['ch', 'o', 'p'], image: '🪓' },
        { word: 'chip', sounds: ['ch', 'i', 'p'], image: '🍟' },
        { word: 'thin', sounds: ['th', 'i', 'n'], image: '📏' },
        { word: 'that', sounds: ['th', 'a', 't'], image: '👉' },
        { word: 'path', sounds: ['p', 'a', 'th'], image: '🛤️' },
        { word: 'math', sounds: ['m', 'a', 'th'], image: '🔢' },
        { word: 'with', sounds: ['w', 'i', 'th'], image: '🤝' },
        { word: 'wish', sounds: ['w', 'i', 'sh'], image: '⭐' },
        { word: 'ring', sounds: ['r', 'i', 'ng'], image: '💍' },
        { word: 'sing', sounds: ['s', 'i', 'ng'], image: '🎤' },
        { word: 'king', sounds: ['k', 'i', 'ng'], image: '👑' },
      ],
    };

    // State
    let currentLevel = 'A4';
    let currentWord = null;
    let revealedCount = 0;
    let wordsCompleted = 0;
    let usedWords = new Set();
    let currentStudent = null;

    document.addEventListener('DOMContentLoaded', async () => {
      setupLevelButtons();

      // Preload letter sounds
      AudioUtils.preloadLetters('sounds').catch(() => {});

      // Student picker
      if (window.StudentPicker) {
        const picker = new StudentPicker({
          title: 'Who is chopping words?',
          allowSkip: true
        });
        currentStudent = await picker.show();

        if (currentStudent) {
          const badge = document.getElementById('studentBadge');
          badge.textContent = `${currentStudent.avatar} ${currentStudent.name}`;
          badge.classList.remove('hidden');
        }
      }

      startRound();

      // Play audio intro on first visit
      const lastIntro = localStorage.getItem('chop-it-up-intro');
      const oneDay = 24 * 60 * 60 * 1000;
      if (!lastIntro || Date.now() - parseInt(lastIntro) > oneDay) {
        setTimeout(() => {
          AudioUtils.playInstruction('chop-it-up-intro', 'Listen to the word. Then say each sound, one at a time!');
          localStorage.setItem('chop-it-up-intro', Date.now().toString());
        }, 500);
      }
    });

    function setupLevelButtons() {
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = btn.dataset.level;
          usedWords.clear();
          startRound();
        });
      });
    }

    function startRound() {
      const bank = wordBanks[currentLevel];
      const available = bank.filter(w => !usedWords.has(w.word));

      if (available.length === 0) {
        usedWords.clear();
      }

      const words = available.length > 0 ? available : bank;
      currentWord = words[Math.floor(Math.random() * words.length)];
      usedWords.add(currentWord.word);

      revealedCount = 0;

      // Update display
      document.getElementById('wordText').textContent = currentWord.word;
      document.getElementById('wordImage').innerHTML = currentWord.image.startsWith('http')
        ? `<img src="${currentWord.image}" alt="${currentWord.word}">`
        : `<span style="font-size: 4rem;">${currentWord.image}</span>`;

      document.getElementById('instruction').textContent = 'Tap each box to hear and reveal the sounds!';
      document.getElementById('feedback').classList.add('hidden');
      document.getElementById('nextBtn').classList.add('hidden');

      renderSoundBoxes();

      // Auto-play word
      setTimeout(() => playWord(), 300);
    }

    function renderSoundBoxes() {
      const container = document.getElementById('soundBoxes');
      container.innerHTML = '';

      currentWord.sounds.forEach((sound, index) => {
        const box = document.createElement('div');
        box.className = 'sound-box';
        if (index === 0) box.classList.add('current');

        box.innerHTML = `
          <span class="box-number">${index + 1}</span>
          <span class="sound-text">?</span>
        `;

        box.onclick = () => revealBox(index);
        container.appendChild(box);
      });
    }

    function revealBox(index) {
      // Must reveal in order
      if (index !== revealedCount) {
        // Shake the current box to indicate wrong order
        const boxes = document.querySelectorAll('.sound-box');
        boxes[revealedCount].style.animation = 'none';
        setTimeout(() => {
          boxes[revealedCount].style.animation = 'pulse 0.3s ease-in-out 3';
        }, 10);
        return;
      }

      const boxes = document.querySelectorAll('.sound-box');
      const box = boxes[index];
      const sound = currentWord.sounds[index];

      // Reveal the sound
      box.classList.remove('current');
      box.classList.add('revealed');
      box.querySelector('.sound-text').textContent = sound;

      // Play the sound
      playSound(sound);

      revealedCount++;

      // Highlight next box or show completion
      if (revealedCount < currentWord.sounds.length) {
        boxes[revealedCount].classList.add('current');
      } else {
        // All revealed!
        setTimeout(() => {
          showComplete();
        }, 500);
      }

      // Allow clicking revealed boxes to hear sound again
      box.onclick = () => playSound(sound);
    }

    function showComplete() {
      wordsCompleted++;
      document.getElementById('wordCount').textContent = wordsCompleted;
      document.getElementById('streak').textContent = wordsCompleted;

      document.getElementById('instruction').textContent = 'Great job! You chopped it up!';
      document.getElementById('feedback').textContent = '🎉 ' + currentWord.sounds.join(' - ') + ' = ' + currentWord.word;
      document.getElementById('feedback').className = 'feedback success';
      document.getElementById('feedback').classList.remove('hidden');
      document.getElementById('nextBtn').classList.remove('hidden');

      // Play celebration
      playWord();
    }

    function nextWord() {
      startRound();
    }

    function playWord() {
      AudioUtils.playWord(currentWord.word).catch(() => {});
    }

    function playSound(sound) {
      // For single letters, use letter sound
      if (sound.length === 1) {
        AudioUtils.playLetterSound(sound, 'sound').catch(() => {});
      } else {
        // For digraphs, use TTS
        AudioUtils.speakTTS(sound, { rate: 0.7 }).catch(() => {});
      }
    }
  </script>
</body>
</html>
