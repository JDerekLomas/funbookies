<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Book body -->
  <rect x="20" y="15" width="55" height="70" rx="4" fill="#FF8C42" stroke="#2D2D2D" stroke-width="3"/>

  <!-- Pages (right side) -->
  <rect x="75" y="20" width="8" height="60" rx="2" fill="#FFF5E6" stroke="#2D2D2D" stroke-width="2"/>
  <line x1="78" y1="25" x2="78" y2="75" stroke="#E0D5C5" stroke-width="1"/>
  <line x1="80" y1="25" x2="80" y2="75" stroke="#E0D5C5" stroke-width="1"/>

  <!-- Spine highlight -->
  <rect x="20" y="15" width="8" height="70" rx="4" fill="#E67A35" stroke="none"/>

  <!-- Eyes -->
  <circle cx="38" cy="42" r="7" fill="white" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="62" cy="42" r="7" fill="white" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="39" cy="41" r="3.5" fill="#2D2D2D"/>
  <circle cx="63" cy="41" r="3.5" fill="#2D2D2D"/>
  <circle cx="40" cy="40" r="1.2" fill="white"/>
  <circle cx="64" cy="40" r="1.2" fill="white"/>

  <!-- Rosy cheeks -->
  <ellipse cx="30" cy="55" rx="6" ry="4" fill="#FFB5B5" opacity="0.7"/>
  <ellipse cx="70" cy="55" rx="6" ry="4" fill="#FFB5B5" opacity="0.7"/>

  <!-- Smile -->
  <path d="M40 60 Q50 72 60 60" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
</svg>
