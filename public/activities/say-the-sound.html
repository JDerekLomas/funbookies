<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Say the Sound - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header { padding-top: var(--space-md); }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 { font-size: 1.5rem; }

    .score-badge {
      background: var(--color-sage-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-sage-dark);
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .level-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .level-group-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .activity-area {
      text-align: center;
      padding: var(--space-md) 0;
    }

    .letter-card {
      background: linear-gradient(135deg, var(--color-cream), white);
      border: 4px solid var(--color-sage);
      border-radius: var(--border-radius-lg);
      padding: var(--space-xl);
      margin: 0 auto var(--space-lg);
      max-width: 250px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .letter-display {
      font-family: var(--font-display);
      font-size: 6rem;
      font-weight: 600;
      color: var(--color-charcoal);
      line-height: 1;
    }

    .letter-hint {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      margin-top: 8px;
    }

    .prompt-text {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--color-charcoal);
      margin-bottom: var(--space-md);
    }

    .mic-button {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--color-terracotta);
      border: none;
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-md);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .mic-button:hover {
      transform: scale(1.05);
      background: var(--color-terracotta-dark);
    }

    .mic-button.recording {
      background: #e74c3c;
      animation: pulse-mic 1s infinite;
    }

    .mic-button.success {
      background: var(--color-sage);
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 4px 25px rgba(231, 76, 60, 0.6); }
    }

    .feedback {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      min-height: 2em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: var(--space-md);
    }

    .feedback.correct { color: var(--color-sage-dark); }
    .feedback.incorrect { color: var(--color-terracotta); }
    .feedback.waiting { color: var(--color-text-muted); }

    .sound-example {
      background: var(--color-cream);
      padding: 12px 20px;
      border-radius: var(--border-radius);
      display: inline-block;
      margin-bottom: var(--space-md);
    }

    .sound-example strong {
      color: var(--color-sage-dark);
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-hear { background: var(--color-sage-light); color: var(--color-sage-dark); }
    .btn-hear:hover { background: var(--color-sage); color: white; }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: var(--space-md);
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-border);
      transition: all 0.2s;
    }

    .progress-dot.done { background: var(--color-sage); }
    .progress-dot.current { background: var(--color-terracotta); transform: scale(1.3); }

    .celebration {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      animation: celebrate 0.5s ease-out;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes celebrate {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #f39c12, #e74c3c);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 8px;
    }

    .student-badge {
      font-size: 0.8rem;
      background: var(--color-sage-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
      color: var(--color-sage-dark);
      margin-left: 8px;
    }

    .speech-not-supported {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: var(--border-radius);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
      color: #856404;
    }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .letter-display { font-size: 4rem; }
      .mic-button { width: 80px; height: 80px; font-size: 2rem; }
    }
  </style>
</head>
<body>
  <script src="/js/data-service.js"></script>
  <script src="/js/student-picker.js"></script>
  <script src="/js/toast.js"></script>
  <div class="container-narrow">
    <div class="page-header">
      <a href="/activities/" class="back-link">&larr; Back to Activities</a>
    </div>

    <div class="game-card">
      <div class="game-header">
        <h1>Say the Sound <span id="studentBadge" class="student-badge hidden"></span></h1>
        <div>
          <span class="score-badge">Score: <span id="score">0</span></span>
          <span id="streakBadge" class="streak-badge hidden">🔥 <span id="streakCount">0</span></span>
        </div>
      </div>

      <div id="speechWarning" class="speech-not-supported hidden">
        Your browser doesn't support speech recognition. Try Chrome or Edge.
      </div>

      <div class="level-select">
        <div class="level-group">
          <span class="level-group-label">A:</span>
          <button class="chip active" data-level="A2">A2</button>
          <button class="chip" data-level="A4">A4</button>
        </div>
        <div class="level-group">
          <span class="level-group-label">B:</span>
          <button class="chip" data-level="B3">B3</button>
          <button class="chip" data-level="B5">B5</button>
          <button class="chip" data-level="B6">B6</button>
          <button class="chip" data-level="B7">B7</button>
          <button class="chip" data-level="B8">B8</button>
        </div>
        <div class="level-group">
          <span class="level-group-label">C:</span>
          <button class="chip" data-level="C1">C1</button>
        </div>
      </div>

      <div class="activity-area">
        <div class="letter-card">
          <div class="letter-display" id="letterDisplay">s</div>
          <div class="letter-hint" id="letterHint">single letter</div>
        </div>

        <p class="prompt-text">What sound does this make?</p>

        <button class="mic-button" id="micButton">🎤</button>

        <div class="feedback waiting" id="feedback">Tap and say the sound!</div>

        <div class="sound-example" id="soundExample">
          Example: <strong>"ssss"</strong>
        </div>

        <div class="controls">
          <button class="btn btn-hear" onclick="hearSound()">🔊 Hear It</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextLetter()" disabled>Next →</button>
          <button class="btn btn-secondary" onclick="skipLetter()">Skip</button>
        </div>

        <div class="progress" id="progress"></div>
      </div>
    </div>
  </div>

  <script>
    // Letter/sound banks by level
    const soundBanks = {
      'A2': [
        // Single consonants and short vowels
        { letter: 's', sound: 'sss', hint: 'snake sound', example: 'sun' },
        { letter: 'a', sound: 'ah', hint: 'short a', example: 'apple' },
        { letter: 't', sound: 'tuh', hint: 't sound', example: 'top' },
        { letter: 'p', sound: 'puh', hint: 'p sound', example: 'pig' },
        { letter: 'i', sound: 'ih', hint: 'short i', example: 'igloo' },
        { letter: 'n', sound: 'nnn', hint: 'n sound', example: 'nose' },
        { letter: 'm', sound: 'mmm', hint: 'm sound', example: 'mom' },
        { letter: 'd', sound: 'duh', hint: 'd sound', example: 'dog' },
        { letter: 'o', sound: 'ah', hint: 'short o', example: 'octopus' },
        { letter: 'g', sound: 'guh', hint: 'g sound', example: 'go' },
      ],
      'A4': [
        // All short vowels and common consonants
        { letter: 'a', sound: 'ah', hint: 'short a', example: 'cat' },
        { letter: 'e', sound: 'eh', hint: 'short e', example: 'bed' },
        { letter: 'i', sound: 'ih', hint: 'short i', example: 'sit' },
        { letter: 'o', sound: 'ah', hint: 'short o', example: 'hot' },
        { letter: 'u', sound: 'uh', hint: 'short u', example: 'cup' },
        { letter: 'c', sound: 'kuh', hint: 'hard c', example: 'cat' },
        { letter: 'k', sound: 'kuh', hint: 'k sound', example: 'kite' },
        { letter: 'b', sound: 'buh', hint: 'b sound', example: 'ball' },
        { letter: 'f', sound: 'fff', hint: 'f sound', example: 'fun' },
        { letter: 'r', sound: 'rrr', hint: 'r sound', example: 'run' },
      ],
      'B3': [
        // Consonant blends
        { letter: 'bl', sound: 'bl', hint: 'blend', example: 'blue' },
        { letter: 'cl', sound: 'cl', hint: 'blend', example: 'clap' },
        { letter: 'fl', sound: 'fl', hint: 'blend', example: 'flag' },
        { letter: 'pl', sound: 'pl', hint: 'blend', example: 'play' },
        { letter: 'sl', sound: 'sl', hint: 'blend', example: 'slide' },
        { letter: 'br', sound: 'br', hint: 'blend', example: 'brown' },
        { letter: 'cr', sound: 'cr', hint: 'blend', example: 'crab' },
        { letter: 'dr', sound: 'dr', hint: 'blend', example: 'drum' },
        { letter: 'fr', sound: 'fr', hint: 'blend', example: 'frog' },
        { letter: 'gr', sound: 'gr', hint: 'blend', example: 'green' },
        { letter: 'st', sound: 'st', hint: 'blend', example: 'stop' },
        { letter: 'sw', sound: 'sw', hint: 'blend', example: 'swim' },
      ],
      'B5': [
        // Digraphs
        { letter: 'sh', sound: 'shh', hint: 'quiet sound', example: 'ship' },
        { letter: 'ch', sound: 'chh', hint: 'choo-choo', example: 'chat' },
        { letter: 'th', sound: 'thh', hint: 'tongue out', example: 'this' },
        { letter: 'wh', sound: 'wh', hint: 'w + h', example: 'when' },
        { letter: 'ng', sound: 'ng', hint: 'ring ending', example: 'ring' },
        { letter: 'ck', sound: 'k', hint: 'at end of words', example: 'duck' },
      ],
      'B6': [
        // Long vowels (CVCe)
        { letter: 'a_e', sound: 'ay', hint: 'long a', example: 'cake' },
        { letter: 'i_e', sound: 'eye', hint: 'long i', example: 'bike' },
        { letter: 'o_e', sound: 'oh', hint: 'long o', example: 'home' },
        { letter: 'u_e', sound: 'you', hint: 'long u', example: 'cute' },
        { letter: 'e_e', sound: 'ee', hint: 'long e', example: 'Pete' },
      ],
      'B7': [
        // R-controlled vowels
        { letter: 'ar', sound: 'arr', hint: 'pirate sound', example: 'car' },
        { letter: 'or', sound: 'orr', hint: 'or sound', example: 'for' },
        { letter: 'er', sound: 'err', hint: 'er sound', example: 'her' },
        { letter: 'ir', sound: 'err', hint: 'same as er', example: 'bird' },
        { letter: 'ur', sound: 'err', hint: 'same as er', example: 'turn' },
      ],
      'B8': [
        // Vowel teams
        { letter: 'ai', sound: 'ay', hint: 'long a', example: 'rain' },
        { letter: 'ay', sound: 'ay', hint: 'at end', example: 'day' },
        { letter: 'ee', sound: 'ee', hint: 'long e', example: 'tree' },
        { letter: 'ea', sound: 'ee', hint: 'long e', example: 'read' },
        { letter: 'oa', sound: 'oh', hint: 'long o', example: 'boat' },
        { letter: 'ow', sound: 'oh', hint: 'long o', example: 'snow' },
        { letter: 'oi', sound: 'oy', hint: 'oy sound', example: 'coin' },
        { letter: 'oy', sound: 'oy', hint: 'at end', example: 'boy' },
        { letter: 'ou', sound: 'ow', hint: 'ouch!', example: 'out' },
      ],
      'C1': [
        // Silent letters
        { letter: 'kn', sound: 'n', hint: 'silent k', example: 'know' },
        { letter: 'wr', sound: 'r', hint: 'silent w', example: 'write' },
        { letter: 'gn', sound: 'n', hint: 'silent g', example: 'gnome' },
        { letter: 'mb', sound: 'm', hint: 'silent b', example: 'lamb' },
        { letter: 'gh', sound: '', hint: 'silent', example: 'night' },
      ],
    };

    // Expected sounds for recognition matching
    const soundMatches = {
      'sss': ['s', 'ss', 'sss', 'ssss'],
      'ah': ['a', 'ah', 'uh', 'o'],
      'tuh': ['t', 'tuh', 'te'],
      'puh': ['p', 'puh', 'pe'],
      'ih': ['i', 'ih', 'e'],
      'nnn': ['n', 'nn', 'en'],
      'mmm': ['m', 'mm', 'em'],
      'duh': ['d', 'duh', 'de'],
      'guh': ['g', 'guh', 'ge'],
      'eh': ['e', 'eh', 'a'],
      'uh': ['u', 'uh', 'a'],
      'kuh': ['k', 'c', 'kuh', 'ke'],
      'buh': ['b', 'buh', 'be'],
      'fff': ['f', 'ff', 'fff', 'ef'],
      'rrr': ['r', 'rr', 'er', 'ar'],
      'bl': ['bl', 'bul', 'bull'],
      'cl': ['cl', 'cul', 'kl'],
      'fl': ['fl', 'ful'],
      'pl': ['pl', 'pul'],
      'sl': ['sl', 'sul'],
      'br': ['br', 'bur'],
      'cr': ['cr', 'cur', 'kr'],
      'dr': ['dr', 'dur'],
      'fr': ['fr', 'fur'],
      'gr': ['gr', 'gur'],
      'st': ['st', 'sut'],
      'sw': ['sw', 'swa'],
      'shh': ['sh', 'shh', 'shhh', 'shush'],
      'chh': ['ch', 'chh', 'chuh'],
      'thh': ['th', 'thh', 'the'],
      'wh': ['wh', 'w'],
      'ng': ['ng', 'ing'],
      'k': ['k', 'ck', 'c'],
      'ay': ['a', 'ay', 'ai', 'aye', 'hey'],
      'eye': ['i', 'eye', 'aye', 'ai'],
      'oh': ['o', 'oh', 'owe'],
      'you': ['u', 'you', 'oo'],
      'ee': ['e', 'ee', 'ea'],
      'arr': ['ar', 'arr', 'are', 'r'],
      'orr': ['or', 'orr', 'ore', 'oar'],
      'err': ['er', 'err', 'ir', 'ur'],
      'oy': ['oi', 'oy', 'oil'],
      'ow': ['ou', 'ow', 'ouch', 'aw'],
      'n': ['n', 'en'],
      'r': ['r', 'er', 'ar'],
      'm': ['m', 'em'],
      '': ['silent', 'nothing', ''],
    };

    // State
    let currentLevel = 'A2';
    let currentSound = null;
    let soundIndex = 0;
    let roundSounds = [];
    let score = 0;
    let streak = 0;
    let recognition = null;
    let currentStudent = null;
    let sessionStartTime = null;
    let attempts = 0;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!SpeechRecognition) {
        document.getElementById('speechWarning').classList.remove('hidden');
        document.getElementById('micButton').disabled = true;
      } else {
        setupSpeechRecognition();
      }

      setupLevelButtons();

      if (window.StudentPicker) {
        const picker = new StudentPicker({
          title: 'Who is practicing sounds?',
          allowSkip: true
        });
        currentStudent = await picker.show();

        if (currentStudent) {
          const badge = document.getElementById('studentBadge');
          badge.textContent = `${currentStudent.avatar} ${currentStudent.name}`;
          badge.classList.remove('hidden');

          const level = await window.FunBookiesDB?.getCurrentLevel(currentStudent.id);
          if (level && soundBanks[level]) {
            currentLevel = level;
            document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
            const levelBtn = document.querySelector(`.chip[data-level="${level}"]`);
            if (levelBtn) levelBtn.classList.add('active');
          }
        }
      }

      sessionStartTime = Date.now();
      startRound();
    });

    function setupSpeechRecognition() {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        document.getElementById('micButton').classList.add('recording');
        document.getElementById('feedback').textContent = 'Listening...';
        document.getElementById('feedback').className = 'feedback waiting';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase().trim();
        checkAnswer(transcript);
      };

      recognition.onerror = (event) => {
        console.error('Speech error:', event.error);
        document.getElementById('micButton').classList.remove('recording');
        if (event.error === 'no-speech') {
          document.getElementById('feedback').textContent = "I didn't hear anything. Try again!";
        } else {
          document.getElementById('feedback').textContent = "Let's try again!";
        }
        document.getElementById('feedback').className = 'feedback waiting';
      };

      recognition.onend = () => {
        document.getElementById('micButton').classList.remove('recording');
      };
    }

    function setupLevelButtons() {
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = btn.dataset.level;
          startRound();
        });
      });
    }

    function startRound() {
      soundIndex = 0;
      const bank = soundBanks[currentLevel] || soundBanks['A2'];
      roundSounds = [...bank].sort(() => Math.random() - 0.5).slice(0, 6);
      loadSound();
      renderProgress();
    }

    function loadSound() {
      currentSound = roundSounds[soundIndex];
      attempts = 0;

      document.getElementById('letterDisplay').textContent = currentSound.letter.replace('_', '');
      document.getElementById('letterHint').textContent = currentSound.hint;
      document.getElementById('soundExample').innerHTML = `Example: <strong>"${currentSound.sound}"</strong> like in "${currentSound.example}"`;
      document.getElementById('feedback').textContent = 'Tap and say the sound!';
      document.getElementById('feedback').className = 'feedback waiting';
      document.getElementById('micButton').classList.remove('success');
      document.getElementById('nextBtn').disabled = true;

      renderProgress();
    }

    function renderProgress() {
      const container = document.getElementById('progress');
      container.innerHTML = '';

      for (let i = 0; i < roundSounds.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (i < soundIndex) dot.classList.add('done');
        if (i === soundIndex) dot.classList.add('current');
        container.appendChild(dot);
      }
    }

    function startRecording() {
      if (!recognition) return;
      try {
        recognition.start();
        attempts++;
      } catch (e) {
        console.error('Recognition error:', e);
      }
    }

    function checkAnswer(transcript) {
      const expectedSound = currentSound.sound;
      const acceptedSounds = soundMatches[expectedSound] || [expectedSound];

      // Clean transcript
      const spoken = transcript.toLowerCase().replace(/[^a-z]/g, '');

      // Check if spoken matches any accepted sound
      const isCorrect = acceptedSounds.some(accepted =>
        spoken === accepted ||
        spoken.includes(accepted) ||
        accepted.includes(spoken) ||
        levenshteinDistance(spoken, accepted) <= 1
      );

      if (isCorrect) {
        handleCorrect();
      } else {
        handleIncorrect(transcript);
      }
    }

    function handleCorrect() {
      score++;
      streak++;
      document.getElementById('score').textContent = score;

      if (streak >= 3) {
        document.getElementById('streakBadge').classList.remove('hidden');
        document.getElementById('streakCount').textContent = streak;
      }

      document.getElementById('feedback').innerHTML = `🎉 Yes! That's <strong>"${currentSound.sound}"</strong>!`;
      document.getElementById('feedback').className = 'feedback correct';
      document.getElementById('micButton').classList.add('success');
      document.getElementById('nextBtn').disabled = false;

      playLetterSound(currentSound.letter);
      showCelebration();
    }

    function handleIncorrect(transcript) {
      streak = 0;
      document.getElementById('streakBadge').classList.add('hidden');

      if (attempts < 2) {
        document.getElementById('feedback').innerHTML = `I heard "${transcript}". Try again - say <strong>"${currentSound.sound}"</strong>`;
        document.getElementById('feedback').className = 'feedback incorrect';
      } else {
        document.getElementById('feedback').innerHTML = `The sound is <strong>"${currentSound.sound}"</strong>`;
        document.getElementById('feedback').className = 'feedback incorrect';
        document.getElementById('nextBtn').disabled = false;
        playLetterSound(currentSound.letter);
      }
    }

    // Audio for pre-recorded letter sounds
    let soundAudio = null;

    function hearSound() {
      playLetterSound(currentSound.letter);
    }

    function playLetterSound(letter) {
      // For single letters, use pre-recorded audio files
      if (letter.length === 1 && /^[a-z]$/.test(letter)) {
        if (soundAudio) {
          soundAudio.pause();
          soundAudio.currentTime = 0;
        }
        soundAudio = new Audio(`/activities/letter-sounds/openai-us/sounds/${letter}.mp3`);
        soundAudio.play().catch(() => speakSound(currentSound.sound));
      } else {
        // For blends/digraphs, use speech synthesis
        speakSound(currentSound.sound);
      }
    }

    function speakSound(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.6;
        utterance.pitch = 1.1;
        speechSynthesis.speak(utterance);
      }
    }

    function showCelebration() {
      const emojis = ['⭐', '🌟', '✨', '🎉', '👏', '🙌'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];

      const celebration = document.createElement('div');
      celebration.className = 'celebration';
      celebration.textContent = emoji;
      document.body.appendChild(celebration);

      setTimeout(() => celebration.remove(), 500);
    }

    function skipLetter() {
      streak = 0;
      document.getElementById('streakBadge').classList.add('hidden');
      nextLetter();
    }

    async function nextLetter() {
      soundIndex++;

      if (soundIndex >= roundSounds.length) {
        document.getElementById('feedback').textContent = '🎉 Round complete!';

        if (currentStudent && window.FunBookiesDB) {
          try {
            await window.FunBookiesDB.saveActivity({
              studentId: currentStudent.id,
              type: 'say-the-sound',
              level: currentLevel,
              score: score,
              total: roundSounds.length,
              duration: Math.round((Date.now() - sessionStartTime) / 1000),
              details: { streak: streak }
            });
          } catch (e) {
            console.error('Failed to save:', e);
        Toast.error('Could not save progress. Please try again.');
          }
        }

        setTimeout(startRound, 2000);
      } else {
        loadSound();
      }
    }

    function levenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    document.getElementById('micButton').addEventListener('click', startRecording);
  </script>
