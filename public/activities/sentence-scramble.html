<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Sentence Scramble - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header { padding-top: var(--space-md); }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 { font-size: 1.5rem; }

    .score-badge {
      background: rgba(212, 196, 176, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: #8B7355;
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .level-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .level-group-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .image-hint {
      text-align: center;
      font-size: 4rem;
      margin-bottom: var(--space-md);
      cursor: pointer;
    }

    .sentence-area {
      background: var(--color-cream);
      border-radius: var(--border-radius-lg);
      padding: var(--space-md);
      min-height: 80px;
      margin-bottom: var(--space-md);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border: 2px dashed var(--color-border);
      transition: all 0.2s;
    }

    .sentence-area.active { border-color: var(--color-sage); background: var(--color-sage-light); }
    .sentence-area.correct { border-color: var(--color-success); border-style: solid; background: #E8F5E9; }
    .sentence-area.wrong { border-color: var(--color-error); background: #FFEBEE; animation: shake 0.3s; }

    .word-tile {
      padding: 12px 20px;
      background: var(--color-white);
      border: 2px solid var(--color-sage);
      border-radius: var(--border-radius);
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--color-charcoal);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .word-tile:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(159, 199, 170, 0.3); }
    .word-tile.in-sentence { background: var(--color-sage); color: var(--color-white); }
    .word-tile.sight-word { border-color: var(--color-terracotta); }
    .word-tile.sight-word.in-sentence { background: var(--color-terracotta); color: var(--color-soft-black); }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: var(--space-md);
      min-height: 60px;
    }

    .punctuation {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--color-text-muted);
      padding: 10px;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-check { background: var(--color-sage); color: var(--color-white); }
    .btn-check:hover { background: var(--color-sage-dark); }
    .btn-hint { background: var(--color-terracotta); color: var(--color-soft-black); }
    .btn-hint:hover { background: var(--color-terracotta-dark); }

    .feedback {
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 500;
      min-height: 35px;
      margin-top: var(--space-md);
    }

    .feedback.correct { color: var(--color-success); }
    .feedback.wrong { color: var(--color-error); }
    .feedback.hint { color: var(--color-terracotta-dark); }

    .legend {
      display: flex;
      justify-content: center;
      gap: var(--space-md);
      margin-top: var(--space-md);
      font-size: 0.85rem;
      color: var(--color-text-muted);
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 4px; }
    .legend-dot.decodable { background: var(--color-sage); }
    .legend-dot.sight { background: var(--color-terracotta); }

    .student-badge {
      font-size: 0.8rem;
      background: var(--color-sage-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
      color: var(--color-sage-dark);
      vertical-align: middle;
      margin-left: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <script src="/js/data-service.js"></script>
  <script src="/js/student-picker.js"></script>
  <script src="/js/toast.js"></script>
  <div class="container-narrow">
    <div class="page-header">
      <a href="/activities/" class="back-link">&larr; Back to Activities</a>
    </div>

    <div class="game-card">
      <div class="game-header">
        <h1>Sentence Scramble <span id="studentBadge" class="student-badge hidden"></span></h1>
        <div class="score-badge">Score: <span id="score">0</span></div>
      </div>

      <div class="level-select">
        <div class="level-group">
          <span class="level-group-label">A:</span>
          <button class="chip active" data-level="A4">A4</button>
        </div>
        <div class="level-group">
          <span class="level-group-label">B:</span>
          <button class="chip" data-level="B1">B1</button>
          <button class="chip" data-level="B2">B2</button>
          <button class="chip" data-level="B3">B3</button>
          <button class="chip" data-level="B5">B5</button>
          <button class="chip" data-level="B6">B6</button>
          <button class="chip" data-level="B8">B8</button>
        </div>
      </div>

      <div class="image-hint" id="imageHint" onclick="speakSentence()">&#x1F431;</div>

      <div class="sentence-area" id="sentenceArea">
        <span class="punctuation" style="opacity: 0.3;">Start building your sentence...</span>
      </div>

      <div class="word-bank" id="wordBank"></div>

      <div class="controls">
        <button class="btn btn-ghost" onclick="clearSentence()">Clear</button>
        <button class="btn btn-hint" onclick="showHint()">Hint</button>
        <button class="btn btn-check" onclick="checkSentence()">Check</button>
        <button class="btn btn-outline" onclick="skipSentence()">Skip</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot decodable"></div><span>Decodable</span></div>
        <div class="legend-item"><div class="legend-dot sight"></div><span>Sight words</span></div>
      </div>
    </div>
  </div>

  <script>
    const sentencesByLevel = {
      'A4': [
        { sentence: ['The', 'cat', 'sat'], image: '&#x1F431;', sightWords: ['the'] },
        { sentence: ['I', 'see', 'a', 'dog'], image: '&#x1F415;', sightWords: ['i', 'see', 'a'] },
        { sentence: ['The', 'sun', 'is', 'hot'], image: '&#x2600;&#xFE0F;', sightWords: ['the', 'is'] },
        { sentence: ['A', 'big', 'pig'], image: '&#x1F437;', sightWords: ['a'] },
        { sentence: ['I', 'can', 'run'], image: '&#x1F3C3;', sightWords: ['i'] },
        { sentence: ['The', 'hat', 'is', 'red'], image: '&#x1F3A9;', sightWords: ['the', 'is'] },
        { sentence: ['A', 'bug', 'in', 'mud'], image: '&#x1F41B;', sightWords: ['a', 'in'] },
        { sentence: ['I', 'see', 'the', 'cup'], image: '&#x1F964;', sightWords: ['i', 'see', 'the'] },
      ],
      'B1': [
        { sentence: ['The', 'cat', 'sat', 'on', 'a', 'mat'], image: '&#x1F431;', sightWords: ['the', 'on', 'a'] },
        { sentence: ['I', 'can', 'see', 'the', 'big', 'pig'], image: '&#x1F437;', sightWords: ['i', 'see', 'the'] },
        { sentence: ['The', 'man', 'ran', 'to', 'the', 'van'], image: '&#x1F690;', sightWords: ['the', 'to'] },
        { sentence: ['A', 'rat', 'sat', 'in', 'a', 'pan'], image: '&#x1F373;', sightWords: ['a', 'in'] },
        { sentence: ['Can', 'the', 'cat', 'sit', 'on', 'it'], image: '&#x1F431;', sightWords: ['the', 'on', 'it'] },
      ],
      'B2': [
        { sentence: ['The', 'dog', 'got', 'hot', 'in', 'the', 'sun'], image: '&#x1F415;', sightWords: ['the', 'in'] },
        { sentence: ['A', 'bug', 'hid', 'in', 'the', 'rug'], image: '&#x1F41B;', sightWords: ['a', 'in', 'the'] },
        { sentence: ['I', 'can', 'run', 'and', 'hop'], image: '&#x1F3C3;', sightWords: ['i', 'and'] },
        { sentence: ['The', 'red', 'hen', 'is', 'in', 'the', 'pen'], image: '&#x1F414;', sightWords: ['the', 'is', 'in'] },
        { sentence: ['We', 'had', 'fun', 'in', 'the', 'sun'], image: '&#x2600;&#xFE0F;', sightWords: ['we', 'in', 'the'] },
      ],
      'B3': [
        { sentence: ['The', 'frog', 'sat', 'on', 'a', 'log'], image: '&#x1F438;', sightWords: ['the', 'on', 'a'] },
        { sentence: ['I', 'can', 'clap', 'and', 'snap'], image: '&#x1F44F;', sightWords: ['i', 'and'] },
        { sentence: ['The', 'crab', 'ran', 'to', 'the', 'sand'], image: '&#x1F980;', sightWords: ['the', 'to'] },
        { sentence: ['We', 'swim', 'and', 'skip', 'and', 'trip'], image: '&#x1F3CA;', sightWords: ['we', 'and'] },
        { sentence: ['The', 'flag', 'is', 'on', 'the', 'top'], image: '&#x1F6A9;', sightWords: ['the', 'is', 'on'] },
      ],
      'B5': [
        { sentence: ['The', 'ship', 'is', 'on', 'the', 'sea'], image: '&#x1F6A2;', sightWords: ['the', 'is', 'on'] },
        { sentence: ['I', 'wish', 'to', 'see', 'a', 'fish'], image: '&#x1F41F;', sightWords: ['i', 'to', 'see', 'a'] },
        { sentence: ['The', 'king', 'has', 'a', 'ring'], image: '&#x1F451;', sightWords: ['the', 'has', 'a'] },
        { sentence: ['We', 'chat', 'and', 'sing', 'a', 'song'], image: '&#x1F3A4;', sightWords: ['we', 'and', 'a'] },
        { sentence: ['The', 'bath', 'is', 'on', 'the', 'path'], image: '&#x1F6C1;', sightWords: ['the', 'is', 'on'] },
      ],
      'B6': [
        { sentence: ['I', 'like', 'to', 'bake', 'a', 'cake'], image: '&#x1F370;', sightWords: ['i', 'to', 'a'] },
        { sentence: ['The', 'bike', 'is', 'by', 'the', 'lake'], image: '&#x1F6B2;', sightWords: ['the', 'is', 'by'] },
        { sentence: ['We', 'came', 'home', 'at', 'the', 'same', 'time'], image: '&#x1F3E0;', sightWords: ['we', 'at', 'the'] },
        { sentence: ['I', 'hope', 'to', 'make', 'a', 'game'], image: '&#x1F3AE;', sightWords: ['i', 'to', 'a'] },
        { sentence: ['The', 'cute', 'mule', 'has', 'a', 'name'], image: '&#x1F434;', sightWords: ['the', 'has', 'a'] },
      ],
      'B8': [
        { sentence: ['The', 'rain', 'came', 'down', 'on', 'the', 'day'], image: '&#x1F327;&#xFE0F;', sightWords: ['the', 'on'] },
        { sentence: ['I', 'see', 'a', 'bee', 'in', 'the', 'tree'], image: '&#x1F41D;', sightWords: ['i', 'see', 'a', 'in', 'the'] },
        { sentence: ['The', 'boat', 'will', 'float', 'and', 'sail'], image: '&#x26F5;', sightWords: ['the', 'will', 'and'] },
        { sentence: ['We', 'play', 'and', 'stay', 'all', 'day'], image: '&#x1F3AE;', sightWords: ['we', 'and', 'all'] },
        { sentence: ['The', 'goat', 'has', 'a', 'coat', 'of', 'brown'], image: '&#x1F410;', sightWords: ['the', 'has', 'a', 'of'] },
      ],
    };

    let currentLevel = 'A4';
    let currentSentence = null;
    let builtSentence = [];
    let score = 0;
    let hintsUsed = 0;
    let currentStudent = null;
    let sessionStartTime = null;
    let sessionCorrect = 0;
    let sessionTotal = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      setupLevelButtons();

      // Show student picker
      const picker = new StudentPicker({
        title: 'Who is scrambling sentences?',
        allowSkip: true
      });
      currentStudent = await picker.show();

      if (currentStudent) {
        const badge = document.getElementById('studentBadge');
        badge.textContent = `${currentStudent.avatar} ${currentStudent.name}`;
        badge.classList.remove('hidden');

        const level = await window.FunBookiesDB.getCurrentLevel(currentStudent.id);
        if (level && sentencesByLevel[level]) {
          currentLevel = level;
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          const levelBtn = document.querySelector(`.chip[data-level="${level}"]`);
          if (levelBtn) levelBtn.classList.add('active');
        }
      }

      sessionStartTime = Date.now();
      newSentence();
    });

    function setupLevelButtons() {
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = btn.dataset.level;
          newSentence();
        });
      });
    }

    function newSentence() {
      const bank = sentencesByLevel[currentLevel] || sentencesByLevel['A4'];
      currentSentence = bank[Math.floor(Math.random() * bank.length)];
      builtSentence = [];
      hintsUsed = 0;

      document.getElementById('imageHint').innerHTML = currentSentence.image;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('sentenceArea').className = 'sentence-area';

      renderWordBank();
      renderSentenceArea();
    }

    function renderWordBank() {
      const container = document.getElementById('wordBank');
      container.innerHTML = '';

      const shuffled = [...currentSentence.sentence].sort(() => Math.random() - 0.5);

      shuffled.forEach(word => {
        if (!builtSentence.includes(word) || countOccurrences(currentSentence.sentence, word) > countOccurrences(builtSentence, word)) {
          const tile = document.createElement('div');
          tile.className = 'word-tile';
          tile.textContent = word;

          if (currentSentence.sightWords.includes(word.toLowerCase())) {
            tile.classList.add('sight-word');
          }

          tile.onclick = () => addWord(word, tile);
          container.appendChild(tile);
        }
      });
    }

    function countOccurrences(arr, word) {
      return arr.filter(w => w === word).length;
    }

    function renderSentenceArea() {
      const container = document.getElementById('sentenceArea');

      if (builtSentence.length === 0) {
        container.innerHTML = '<span class="punctuation" style="opacity: 0.3;">Start building your sentence...</span>';
        return;
      }

      container.innerHTML = '';
      builtSentence.forEach((word, idx) => {
        const tile = document.createElement('div');
        tile.className = 'word-tile in-sentence';
        tile.textContent = word;

        if (currentSentence.sightWords.includes(word.toLowerCase())) {
          tile.classList.add('sight-word');
        }

        tile.onclick = () => removeWord(idx);
        container.appendChild(tile);
      });

      if (builtSentence.length > 0) {
        const period = document.createElement('span');
        period.className = 'punctuation';
        period.textContent = '.';
        container.appendChild(period);
      }
    }

    function addWord(word, tile) {
      builtSentence.push(word);
      document.getElementById('sentenceArea').classList.add('active');
      renderSentenceArea();
      renderWordBank();
      speakWordDirect(word);

      setTimeout(() => {
        document.getElementById('sentenceArea').classList.remove('active');
      }, 200);
    }

    function removeWord(index) {
      builtSentence.splice(index, 1);
      renderSentenceArea();
      renderWordBank();
    }

    function clearSentence() {
      builtSentence = [];
      renderSentenceArea();
      renderWordBank();
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('sentenceArea').className = 'sentence-area';
    }

    function showHint() {
      if (hintsUsed >= currentSentence.sentence.length) return;

      const nextWord = currentSentence.sentence[hintsUsed];
      document.getElementById('feedback').textContent = `Hint: The ${hintsUsed === 0 ? 'first' : 'next'} word is "${nextWord}"`;
      document.getElementById('feedback').className = 'feedback hint';
      hintsUsed++;
    }

    async function checkSentence() {
      const isCorrect = builtSentence.length === currentSentence.sentence.length &&
        builtSentence.every((word, idx) => word === currentSentence.sentence[idx]);

      const area = document.getElementById('sentenceArea');
      sessionTotal++;

      if (isCorrect) {
        area.classList.add('correct');
        document.getElementById('feedback').textContent = 'Correct! Great sentence!';
        document.getElementById('feedback').className = 'feedback correct';

        const points = Math.max(10 - hintsUsed * 2, 5);
        score += points;
        sessionCorrect++;
        document.getElementById('score').textContent = score;

        // Save activity every 5 sentences
        if (sessionTotal > 0 && sessionTotal % 5 === 0 && currentStudent) {
          await saveActivity();
        }

        speakSentence();
        setTimeout(newSentence, 2000);
      } else {
        area.classList.add('wrong');
        document.getElementById('feedback').textContent = 'Not quite right. Try again!';
        document.getElementById('feedback').className = 'feedback wrong';

        setTimeout(() => { area.classList.remove('wrong'); }, 500);
      }
    }

    async function saveActivity() {
      if (!currentStudent || sessionTotal === 0) return;
      try {
        await window.FunBookiesDB.saveActivity({
          studentId: currentStudent.id,
          type: 'sentence-scramble',
          level: currentLevel,
          score: sessionCorrect,
          total: sessionTotal,
          duration: Math.round((Date.now() - sessionStartTime) / 1000),
          details: { finalScore: score }
        });
      } catch (e) {
        console.error('Failed to save activity:', e);
        Toast.error('Could not save progress. Please try again.');
      }
    }

    // Save on page unload
    window.addEventListener('beforeunload', () => {
      if (currentStudent && sessionTotal > 0) {
        saveActivity();
      }
    });

    function skipSentence() {
      document.getElementById('feedback').textContent = `Answer: "${currentSentence.sentence.join(' ')}."`;
      document.getElementById('feedback').className = 'feedback hint';
      speakSentence();
      setTimeout(newSentence, 2500);
    }

    function speakSentence() {
      if (currentSentence) {
        speakWordDirect(currentSentence.sentence.join(' '));
      }
    }

    function speakWordDirect(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.85;
        speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
