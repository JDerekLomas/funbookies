<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence Scramble - Funbookies</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 650px; margin: 0 auto; }

    .back-link {
      display: inline-block;
      color: white;
      text-decoration: none;
      margin-bottom: 15px;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .back-link:hover { opacity: 1; text-decoration: underline; }

    .game-card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.6rem;
      color: #667eea;
    }

    .score {
      background: #EDE7F6;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      color: #5E35B1;
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .level-btn {
      padding: 8px 16px;
      border: 2px solid #667eea;
      background: white;
      border-radius: 20px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .level-btn:hover, .level-btn.active {
      background: #667eea;
      color: white;
    }

    .image-hint {
      text-align: center;
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .sentence-area {
      background: #f9f9f9;
      border-radius: 16px;
      padding: 20px;
      min-height: 80px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border: 3px dashed #ddd;
      transition: all 0.2s;
    }

    .sentence-area.active {
      border-color: #667eea;
      background: #EDE7F6;
    }

    .sentence-area.correct {
      border-color: #4CAF50;
      border-style: solid;
      background: #E8F5E9;
    }

    .sentence-area.wrong {
      border-color: #f44336;
      background: #FFEBEE;
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .word-tile {
      padding: 12px 20px;
      background: white;
      border: 2px solid #667eea;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .word-tile:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .word-tile.in-sentence {
      background: #667eea;
      color: white;
    }

    .word-tile.sight-word {
      border-color: #9C27B0;
    }

    .word-tile.sight-word.in-sentence {
      background: #9C27B0;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
      min-height: 60px;
    }

    .punctuation {
      font-size: 1.5rem;
      font-weight: 700;
      color: #999;
      padding: 10px;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-check {
      background: #4CAF50;
      color: white;
    }

    .btn-check:hover {
      background: #43A047;
    }

    .btn-clear {
      background: #f5f5f5;
      color: #666;
    }

    .btn-clear:hover {
      background: #eee;
    }

    .btn-hint {
      background: #FF9800;
      color: white;
    }

    .btn-hint:hover {
      background: #F57C00;
    }

    .btn-skip {
      background: #9e9e9e;
      color: white;
    }

    .feedback {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      min-height: 35px;
      margin-top: 15px;
    }

    .feedback.correct { color: #4CAF50; }
    .feedback.wrong { color: #f44336; }
    .feedback.hint { color: #FF9800; }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
      font-size: 0.85rem;
      color: #666;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
    }

    .legend-dot.decodable { background: #667eea; }
    .legend-dot.sight { background: #9C27B0; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/activities/" class="back-link">&larr; Back to Activities</a>

    <div class="game-card">
      <div class="header">
        <h1>Sentence Scramble</h1>
        <div class="score">Score: <span id="score">0</span></div>
      </div>

      <div class="level-select">
        <button class="level-btn active" data-level="0">Easy (3-4 words)</button>
        <button class="level-btn" data-level="1">Medium (4-5 words)</button>
        <button class="level-btn" data-level="2">Hard (5-6 words)</button>
      </div>

      <div class="image-hint" id="imageHint">🐱</div>

      <div class="sentence-area" id="sentenceArea">
        <span class="punctuation" style="opacity: 0.3;">Start building your sentence...</span>
      </div>

      <div class="word-bank" id="wordBank"></div>

      <div class="controls">
        <button class="btn btn-clear" onclick="clearSentence()">Clear</button>
        <button class="btn btn-hint" onclick="showHint()">Hint</button>
        <button class="btn btn-check" onclick="checkSentence()">Check</button>
        <button class="btn btn-skip" onclick="skipSentence()">Skip</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot decodable"></div>
          <span>Sound-out words</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot sight"></div>
          <span>Sight words</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sentenceBanks = {
      0: [ // Easy - 3-4 words
        { sentence: ['The', 'cat', 'sat'], image: '🐱', sightWords: ['the'] },
        { sentence: ['I', 'see', 'a', 'dog'], image: '🐕', sightWords: ['i', 'see', 'a'] },
        { sentence: ['The', 'sun', 'is', 'hot'], image: '☀️', sightWords: ['the', 'is'] },
        { sentence: ['A', 'big', 'pig'], image: '🐷', sightWords: ['a'] },
        { sentence: ['I', 'can', 'run'], image: '🏃', sightWords: ['i', 'can'] },
        { sentence: ['The', 'hat', 'is', 'red'], image: '🎩', sightWords: ['the', 'is'] },
        { sentence: ['A', 'bug', 'in', 'mud'], image: '🐛', sightWords: ['a', 'in'] },
        { sentence: ['I', 'like', 'my', 'cup'], image: '🥤', sightWords: ['i', 'like', 'my'] },
      ],
      1: [ // Medium - 4-5 words
        { sentence: ['The', 'dog', 'can', 'run', 'fast'], image: '🐕', sightWords: ['the', 'can'] },
        { sentence: ['I', 'see', 'a', 'big', 'frog'], image: '🐸', sightWords: ['i', 'see', 'a'] },
        { sentence: ['The', 'cat', 'sat', 'on', 'a', 'mat'], image: '🐱', sightWords: ['the', 'on', 'a'] },
        { sentence: ['A', 'fox', 'hid', 'in', 'the', 'box'], image: '🦊', sightWords: ['a', 'in', 'the'] },
        { sentence: ['The', 'pig', 'is', 'in', 'the', 'pen'], image: '🐷', sightWords: ['the', 'is', 'in'] },
        { sentence: ['I', 'had', 'fun', 'in', 'the', 'sun'], image: '☀️', sightWords: ['i', 'in', 'the'] },
        { sentence: ['We', 'can', 'hop', 'and', 'run'], image: '🐰', sightWords: ['we', 'can', 'and'] },
      ],
      2: [ // Hard - 5-6 words
        { sentence: ['The', 'ship', 'is', 'on', 'the', 'sea'], image: '🚢', sightWords: ['the', 'is', 'on'] },
        { sentence: ['I', 'wish', 'to', 'swim', 'with', 'fish'], image: '🐟', sightWords: ['i', 'to', 'with'] },
        { sentence: ['The', 'frog', 'sat', 'on', 'a', 'log'], image: '🐸', sightWords: ['the', 'on', 'a'] },
        { sentence: ['We', 'clap', 'and', 'snap', 'our', 'hands'], image: '👏', sightWords: ['we', 'and', 'our'] },
        { sentence: ['The', 'crab', 'ran', 'on', 'the', 'sand'], image: '🦀', sightWords: ['the', 'on'] },
        { sentence: ['I', 'like', 'to', 'chat', 'with', 'my', 'chum'], image: '💬', sightWords: ['i', 'like', 'to', 'with', 'my'] },
      ]
    };

    let currentLevel = 0;
    let currentSentence = null;
    let builtSentence = [];
    let score = 0;
    let hintsUsed = 0;

    document.addEventListener('DOMContentLoaded', () => {
      setupLevelButtons();
      newSentence();
    });

    function setupLevelButtons() {
      document.querySelectorAll('.level-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = parseInt(btn.dataset.level);
          newSentence();
        });
      });
    }

    function newSentence() {
      const bank = sentenceBanks[currentLevel];
      currentSentence = bank[Math.floor(Math.random() * bank.length)];
      builtSentence = [];
      hintsUsed = 0;

      document.getElementById('imageHint').textContent = currentSentence.image;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('sentenceArea').className = 'sentence-area';

      renderWordBank();
      renderSentenceArea();
    }

    function renderWordBank() {
      const container = document.getElementById('wordBank');
      container.innerHTML = '';

      // Shuffle words
      const shuffled = [...currentSentence.sentence].sort(() => Math.random() - 0.5);

      shuffled.forEach(word => {
        if (!builtSentence.includes(word) || countOccurrences(currentSentence.sentence, word) > countOccurrences(builtSentence, word)) {
          const tile = document.createElement('div');
          tile.className = 'word-tile';
          tile.textContent = word;

          if (currentSentence.sightWords.includes(word.toLowerCase())) {
            tile.classList.add('sight-word');
          }

          tile.onclick = () => addWord(word, tile);
          container.appendChild(tile);
        }
      });
    }

    function countOccurrences(arr, word) {
      return arr.filter(w => w === word).length;
    }

    function renderSentenceArea() {
      const container = document.getElementById('sentenceArea');

      if (builtSentence.length === 0) {
        container.innerHTML = '<span class="punctuation" style="opacity: 0.3;">Start building your sentence...</span>';
        return;
      }

      container.innerHTML = '';
      builtSentence.forEach((word, idx) => {
        const tile = document.createElement('div');
        tile.className = 'word-tile in-sentence';
        tile.textContent = word;

        if (currentSentence.sightWords.includes(word.toLowerCase())) {
          tile.classList.add('sight-word');
        }

        tile.onclick = () => removeWord(idx);
        container.appendChild(tile);
      });

      // Add period placeholder
      if (builtSentence.length > 0) {
        const period = document.createElement('span');
        period.className = 'punctuation';
        period.textContent = '.';
        container.appendChild(period);
      }
    }

    function addWord(word, tile) {
      builtSentence.push(word);
      document.getElementById('sentenceArea').classList.add('active');
      renderSentenceArea();
      renderWordBank();

      setTimeout(() => {
        document.getElementById('sentenceArea').classList.remove('active');
      }, 200);
    }

    function removeWord(index) {
      builtSentence.splice(index, 1);
      renderSentenceArea();
      renderWordBank();
    }

    function clearSentence() {
      builtSentence = [];
      renderSentenceArea();
      renderWordBank();
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('sentenceArea').className = 'sentence-area';
    }

    function showHint() {
      if (hintsUsed >= currentSentence.sentence.length) return;

      const nextWord = currentSentence.sentence[hintsUsed];
      document.getElementById('feedback').textContent = `Hint: The ${hintsUsed === 0 ? 'first' : 'next'} word is "${nextWord}"`;
      document.getElementById('feedback').className = 'feedback hint';
      hintsUsed++;
    }

    function checkSentence() {
      const isCorrect = builtSentence.length === currentSentence.sentence.length &&
        builtSentence.every((word, idx) => word === currentSentence.sentence[idx]);

      const area = document.getElementById('sentenceArea');

      if (isCorrect) {
        area.classList.add('correct');
        document.getElementById('feedback').textContent = 'Correct! Great sentence!';
        document.getElementById('feedback').className = 'feedback correct';

        const points = Math.max(10 - hintsUsed * 2, 5);
        score += points;
        document.getElementById('score').textContent = score;

        setTimeout(newSentence, 1500);
      } else {
        area.classList.add('wrong');
        document.getElementById('feedback').textContent = 'Not quite right. Try again!';
        document.getElementById('feedback').className = 'feedback wrong';

        setTimeout(() => {
          area.classList.remove('wrong');
        }, 500);
      }
    }

    function skipSentence() {
      document.getElementById('feedback').textContent = `Answer: "${currentSentence.sentence.join(' ')}."`;
      document.getElementById('feedback').className = 'feedback hint';
      setTimeout(newSentence, 2000);
    }
  </script>
</body>
</html>
