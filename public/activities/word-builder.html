<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Word Builder - FunBookies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    .page-header {
      padding-top: var(--space-md);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    .game-header h1 {
      font-size: 1.5rem;
      color: var(--color-soft-black);
    }

    .score-badge {
      background: var(--color-terracotta-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--color-terracotta-dark);
    }

    .level-select {
      display: flex;
      gap: 8px;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .target-area {
      text-align: center;
      margin-bottom: var(--space-md);
    }

    .target-hint {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      margin-bottom: var(--space-xs);
    }

    .target-image {
      font-size: 5rem;
      margin-bottom: var(--space-xs);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .target-image:hover {
      transform: scale(1.1);
    }

    .target-word {
      font-size: 1rem;
      color: var(--color-text-muted);
      font-style: italic;
    }

    .word-slots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: var(--space-md);
      min-height: 80px;
    }

    .slot {
      width: 60px;
      height: 70px;
      border: 2px dashed var(--color-border);
      border-radius: var(--border-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 500;
      color: var(--color-charcoal);
      background: var(--color-cream);
      transition: all 0.2s;
      cursor: pointer;
    }

    .slot.filled {
      border-style: solid;
      border-color: var(--color-sage);
      background: var(--color-sage-light);
    }

    .slot.correct {
      border-color: var(--color-success);
      background: #E8F5E9;
    }

    .slot.wrong {
      border-color: var(--color-error);
      background: #FFEBEE;
      animation: shake 0.3s;
    }

    .letter-bank {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: var(--space-md);
    }

    .letter-tile {
      width: 56px;
      height: 64px;
      background: var(--color-sage);
      border: none;
      border-radius: var(--border-radius);
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 500;
      color: var(--color-white);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 8px rgba(159, 199, 170, 0.3);
    }

    .letter-tile:hover {
      background: var(--color-sage-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(159, 199, 170, 0.4);
    }

    .letter-tile:active {
      transform: translateY(0) scale(0.95);
    }

    .letter-tile.used {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .feedback {
      text-align: center;
      margin-top: var(--space-md);
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 500;
      min-height: 40px;
    }

    .feedback.correct {
      color: var(--color-success);
    }

    .feedback.wrong {
      color: var(--color-error);
    }

    .streak {
      text-align: center;
      margin-top: var(--space-sm);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    .streak span {
      color: var(--color-terracotta);
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .slot, .letter-tile {
        width: 48px;
        height: 56px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container-narrow">
    <div class="page-header">
      <a href="/activities/" class="back-link">&larr; Back to Activities</a>
    </div>

    <div class="game-card">
      <div class="game-header">
        <h1>Word Builder</h1>
        <div class="score-badge">Score: <span id="score">0</span></div>
      </div>

      <div class="level-select">
        <button class="chip active" data-level="0">CVC</button>
        <button class="chip" data-level="1">Short U</button>
        <button class="chip" data-level="2">Blends</button>
        <button class="chip" data-level="3">Digraphs</button>
      </div>

      <div class="target-area">
        <div class="target-hint">Build this word:</div>
        <div class="target-image" id="targetImage" onclick="speakWord(currentWord?.word)" title="Click to hear the word">&#x1F431;</div>
        <div class="target-word" id="targetHint">(a furry pet that says meow)</div>
      </div>

      <div class="word-slots" id="wordSlots"></div>

      <div class="letter-bank" id="letterBank"></div>

      <div class="controls">
        <button class="btn btn-ghost" onclick="clearWord()">Clear</button>
        <button class="btn btn-primary" onclick="checkWord()">Check</button>
        <button class="btn btn-secondary" onclick="speakWord(currentWord?.word)" title="Hear the word">&#x1F50A;</button>
        <button class="btn btn-outline" onclick="skipWord()">Skip</button>
      </div>

      <div class="feedback" id="feedback"></div>
      <div class="streak">Current streak: <span id="streak">0</span></div>
    </div>
  </div>

  <script>
    // Text-to-Speech
    function speak(text, rate = 0.85) {
      if (!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate;
      utterance.pitch = 1.1;
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google') || v.lang.startsWith('en'));
      if (preferred) utterance.voice = preferred;
      window.speechSynthesis.speak(utterance);
    }

    function speakLetter(letter) {
      speak(letter.toUpperCase(), 0.7);
    }

    function speakWord(word) {
      speak(word, 0.75);
    }

    // Word banks by level
    const wordBanks = {
      0: [ // Simple CVC
        { word: 'cat', image: '&#x1F431;', hint: 'a furry pet that says meow' },
        { word: 'dog', image: '&#x1F415;', hint: 'a pet that barks' },
        { word: 'sun', image: '&#x2600;&#xFE0F;', hint: 'bright in the sky' },
        { word: 'hat', image: '&#x1F3A9;', hint: 'you wear it on your head' },
        { word: 'pig', image: '&#x1F437;', hint: 'a pink farm animal' },
        { word: 'cup', image: '&#x1F964;', hint: 'you drink from it' },
        { word: 'bed', image: '&#x1F6CF;&#xFE0F;', hint: 'you sleep on it' },
        { word: 'fox', image: '&#x1F98A;', hint: 'a clever orange animal' },
        { word: 'map', image: '&#x1F5FA;&#xFE0F;', hint: 'shows you where to go' },
        { word: 'pen', image: '&#x1F58A;&#xFE0F;', hint: 'you write with it' },
        { word: 'bus', image: '&#x1F68C;', hint: 'big yellow vehicle' },
        { word: 'bat', image: '&#x1F987;', hint: 'flies at night' },
        { word: 'net', image: '&#x1F945;', hint: 'catch fish or balls' },
        { word: 'pot', image: '&#x1F372;', hint: 'cook food in it' },
        { word: 'fan', image: '&#x1FAAD;', hint: 'keeps you cool' },
      ],
      1: [ // Short U focus
        { word: 'bug', image: '&#x1F41B;', hint: 'a small crawling creature' },
        { word: 'rug', image: '&#x1F9F6;', hint: 'soft on the floor' },
        { word: 'mud', image: '&#x1F4A9;', hint: 'wet dirt' },
        { word: 'tub', image: '&#x1F6C1;', hint: 'take a bath in it' },
        { word: 'hug', image: '&#x1F917;', hint: 'wrap your arms around' },
        { word: 'jug', image: '&#x1FAD7;', hint: 'holds water' },
        { word: 'nut', image: '&#x1F95C;', hint: 'squirrels love these' },
        { word: 'cut', image: '&#x2702;&#xFE0F;', hint: 'use scissors to do this' },
        { word: 'pup', image: '&#x1F436;', hint: 'a baby dog' },
        { word: 'sun', image: '&#x2600;&#xFE0F;', hint: 'bright in the sky' },
      ],
      2: [ // Blends
        { word: 'frog', image: '&#x1F438;', hint: 'green and hops' },
        { word: 'crab', image: '&#x1F980;', hint: 'has claws' },
        { word: 'flag', image: '&#x1F6A9;', hint: 'waves in the wind' },
        { word: 'drum', image: '&#x1F941;', hint: 'bang on it' },
        { word: 'swim', image: '&#x1F3CA;', hint: 'do this in water' },
        { word: 'stop', image: '&#x1F6D1;', hint: 'red sign' },
        { word: 'trip', image: '&#x2708;&#xFE0F;', hint: 'go on a journey' },
        { word: 'clap', image: '&#x1F44F;', hint: 'hit hands together' },
        { word: 'snap', image: '&#x1FAF0;', hint: 'click your fingers' },
        { word: 'grin', image: '&#x1F601;', hint: 'a big smile' },
      ],
      3: [ // Digraphs
        { word: 'ship', image: '&#x1F6A2;', hint: 'sails on water' },
        { word: 'fish', image: '&#x1F41F;', hint: 'swims in water' },
        { word: 'chat', image: '&#x1F4AC;', hint: 'have a talk' },
        { word: 'chin', image: '&#x1F9D4;', hint: 'below your mouth' },
        { word: 'chop', image: '&#x1FA93;', hint: 'cut with an axe' },
        { word: 'shop', image: '&#x1F3EA;', hint: 'buy things here' },
        { word: 'thin', image: '&#x1F4CF;', hint: 'not thick' },
        { word: 'path', image: '&#x1F6E4;&#xFE0F;', hint: 'walk on it' },
        { word: 'with', image: '&#x1F91D;', hint: 'together' },
        { word: 'math', image: '&#x1F522;', hint: 'numbers subject' },
      ]
    };

    let currentLevel = 0;
    let currentWord = null;
    let builtWord = [];
    let score = 0;
    let streak = 0;
    let usedWords = new Set();

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      setupLevelButtons();
      newWord();
    });

    function setupLevelButtons() {
      document.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLevel = parseInt(btn.dataset.level);
          usedWords.clear();
          newWord();
        });
      });
    }

    function newWord() {
      const bank = wordBanks[currentLevel];
      const available = bank.filter(w => !usedWords.has(w.word));

      if (available.length === 0) {
        usedWords.clear();
      }

      const words = available.length > 0 ? available : bank;
      currentWord = words[Math.floor(Math.random() * words.length)];
      usedWords.add(currentWord.word);

      builtWord = [];
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';

      document.getElementById('targetImage').innerHTML = currentWord.image;
      document.getElementById('targetHint').textContent = `(${currentWord.hint})`;

      renderSlots();
      renderLetterBank();
    }

    function renderSlots() {
      const container = document.getElementById('wordSlots');
      container.innerHTML = '';

      for (let i = 0; i < currentWord.word.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot' + (builtWord[i] ? ' filled' : '');
        slot.textContent = builtWord[i] || '';
        slot.onclick = () => removeLetterAt(i);
        container.appendChild(slot);
      }
    }

    function renderLetterBank() {
      const container = document.getElementById('letterBank');
      container.innerHTML = '';

      // Get letters from word + some extras
      const letters = currentWord.word.split('');
      const extras = 'aeiounrstlcmpbdfgh'.split('');
      const extraCount = Math.min(4, 8 - letters.length);

      for (let i = 0; i < extraCount; i++) {
        const extra = extras[Math.floor(Math.random() * extras.length)];
        if (!letters.includes(extra) || Math.random() > 0.5) {
          letters.push(extra);
        }
      }

      // Shuffle
      letters.sort(() => Math.random() - 0.5);

      letters.forEach((letter, idx) => {
        const tile = document.createElement('button');
        tile.className = 'letter-tile';
        tile.textContent = letter;
        tile.dataset.index = idx;

        tile.onclick = () => addLetter(letter, tile);
        container.appendChild(tile);
      });
    }

    function addLetter(letter, tile) {
      if (builtWord.length < currentWord.word.length) {
        builtWord.push(letter);
        tile.classList.add('used');
        speakLetter(letter);
        renderSlots();
      }
    }

    function removeLetterAt(index) {
      if (builtWord[index]) {
        builtWord.splice(index, 1);
        renderSlots();
        renderLetterBank();
      }
    }

    function clearWord() {
      builtWord = [];
      renderSlots();
      renderLetterBank();
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
    }

    function checkWord() {
      if (builtWord.length !== currentWord.word.length) {
        return;
      }

      const attempt = builtWord.join('');
      const slots = document.querySelectorAll('.slot');

      if (attempt === currentWord.word) {
        slots.forEach(s => s.classList.add('correct'));
        document.getElementById('feedback').textContent = 'Correct!';
        document.getElementById('feedback').className = 'feedback correct';
        score += 10 + streak * 2;
        streak++;
        document.getElementById('score').textContent = score;
        document.getElementById('streak').textContent = streak;

        speakWord(currentWord.word);

        setTimeout(newWord, 1500);
      } else {
        slots.forEach((s, i) => {
          if (builtWord[i] !== currentWord.word[i]) {
            s.classList.add('wrong');
          }
        });
        document.getElementById('feedback').textContent = 'Try again!';
        document.getElementById('feedback').className = 'feedback wrong';
        streak = 0;
        document.getElementById('streak').textContent = streak;
      }
    }

    function skipWord() {
      streak = 0;
      document.getElementById('streak').textContent = streak;
      newWord();
    }
  </script>
</body>
</html>
