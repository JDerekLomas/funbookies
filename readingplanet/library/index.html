<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - ReadingPlanet</title>
    <link rel="icon" type="image/svg+xml" href="/readingplanet/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/readingplanet/styles/shared.css">
    <style>
        .page-header {
            background: var(--color-white);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-lg) 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-md);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            margin-bottom: var(--space-sm);
        }

        .back-link:hover {
            color: var(--color-text);
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .search-box {
            position: relative;
            width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            padding-left: 2.5rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            background: var(--color-bg-alt);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--color-accent);
            background: var(--color-white);
        }

        .search-box svg {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
        }

        .filters {
            display: flex;
            gap: var(--space-md);
            padding: var(--space-lg) 0;
            border-bottom: 1px solid var(--color-border);
            overflow-x: auto;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: var(--space-sm);
        }

        .filter-btn {
            padding: var(--space-sm) var(--space-md);
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition-fast);
        }

        .filter-btn:hover {
            background: var(--color-border);
        }

        .filter-btn.active {
            background: var(--color-navy);
            border-color: var(--color-navy);
            color: white;
        }

        .library-content {
            padding: var(--space-xl) 0;
        }

        .results-info {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            margin-bottom: var(--space-lg);
        }

        .text-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-lg);
        }

        .text-card {
            background: var(--color-white);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all var(--transition-base);
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .text-card:hover {
            border-color: var(--color-accent);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }

        .text-cover {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            position: relative;
        }

        .text-info {
            padding: var(--space-md);
        }

        .text-genre {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-accent);
            margin-bottom: var(--space-xs);
        }

        .text-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: var(--space-xs);
            color: var(--color-text);
            line-height: 1.4;
        }

        .text-summary {
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-sm);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .text-meta {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        .text-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lexile-badge {
            background: var(--color-bg-alt);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-weight: 500;
        }

        .no-results {
            text-align: center;
            padding: var(--space-3xl);
            color: var(--color-text-muted);
        }

        .no-results svg {
            width: 64px;
            height: 64px;
            margin-bottom: var(--space-md);
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: var(--space-3xl);
            color: var(--color-text-muted);
        }

        @media (max-width: 640px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <script src="/readingplanet/js/data-service.js"></script>
    <script src="/readingplanet/js/student-picker.js"></script>

    <header class="page-header">
        <div class="container">
            <a href="/readingplanet/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                Back to Home
            </a>
            <div class="header-content">
                <h1 class="page-title">Library</h1>
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="search" id="searchInput" placeholder="Search texts...">
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="filters">
            <div class="filter-group" id="typeFilters">
                <button class="filter-btn active" data-type="all">All</button>
                <button class="filter-btn" data-type="article">Articles</button>
                <button class="filter-btn" data-type="story">Stories</button>
            </div>
            <div class="filter-group" id="levelFilters">
                <button class="filter-btn" data-level="easy">Easier (600-700L)</button>
                <button class="filter-btn" data-level="medium">Medium (700-850L)</button>
                <button class="filter-btn" data-level="challenging">Challenging (850L+)</button>
            </div>
        </div>
    </div>

    <main class="library-content">
        <div class="container">
            <div class="results-info" id="resultsInfo"></div>
            <div class="text-grid" id="textGrid">
                <div class="loading">Loading texts...</div>
            </div>
        </div>
    </main>

    <script>
        // State
        let allTexts = [];
        let filteredTexts = [];
        let currentTypeFilter = 'all';
        let currentLevelFilter = null;
        let searchQuery = '';

        // Lexile level ranges
        const LEVEL_RANGES = {
            easy: { min: 0, max: 700 },
            medium: { min: 700, max: 850 },
            challenging: { min: 850, max: 2000 }
        };

        // Load texts from manifest
        async function loadTexts() {
            try {
                const response = await fetch('/readingplanet/texts/manifest.json');
                const manifest = await response.json();
                allTexts = manifest.texts || [];
                applyFilters();
            } catch (e) {
                console.error('Failed to load texts:', e);
                document.getElementById('textGrid').innerHTML = `
                    <div class="no-results">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                        <p>Unable to load library. Please try again later.</p>
                    </div>
                `;
            }
        }

        // Apply all filters
        function applyFilters() {
            filteredTexts = allTexts.filter(text => {
                // Type filter
                if (currentTypeFilter !== 'all' && text.type !== currentTypeFilter) {
                    return false;
                }

                // Level filter
                if (currentLevelFilter) {
                    const range = LEVEL_RANGES[currentLevelFilter];
                    if (text.lexile < range.min || text.lexile >= range.max) {
                        return false;
                    }
                }

                // Search filter
                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    const matchesTitle = text.title.toLowerCase().includes(query);
                    const matchesGenre = text.genre.toLowerCase().includes(query);
                    const matchesSummary = text.summary?.toLowerCase().includes(query);
                    if (!matchesTitle && !matchesGenre && !matchesSummary) {
                        return false;
                    }
                }

                return true;
            });

            renderTexts();
            updateResultsInfo();
        }

        // Render text cards
        function renderTexts() {
            const grid = document.getElementById('textGrid');

            if (filteredTexts.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <p>No texts found. Try adjusting your filters.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredTexts.map(text => `
                <a href="/readingplanet/reader/?text=${text.id}" class="text-card">
                    <div class="text-cover" style="background: linear-gradient(135deg, ${text.coverColor}22, ${text.coverColor}44)">
                        ${text.coverEmoji || '📖'}
                    </div>
                    <div class="text-info">
                        <div class="text-genre">${text.genre}</div>
                        <h3 class="text-title">${text.title}</h3>
                        <p class="text-summary">${text.summary || ''}</p>
                        <div class="text-meta">
                            <span>${capitalize(text.type)}</span>
                            <span>•</span>
                            <span class="lexile-badge">${text.lexile}L</span>
                            <span>•</span>
                            <span>${text.readingTime} min</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        // Update results info
        function updateResultsInfo() {
            const info = document.getElementById('resultsInfo');
            const count = filteredTexts.length;
            const total = allTexts.length;

            if (count === total) {
                info.textContent = `${count} text${count !== 1 ? 's' : ''} available`;
            } else {
                info.textContent = `Showing ${count} of ${total} texts`;
            }
        }

        // Helper
        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Filter button handlers
        document.getElementById('typeFilters').addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;

            document.querySelectorAll('#typeFilters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTypeFilter = btn.dataset.type;
            applyFilters();
        });

        document.getElementById('levelFilters').addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;

            const wasActive = btn.classList.contains('active');
            document.querySelectorAll('#levelFilters .filter-btn').forEach(b => b.classList.remove('active'));

            if (!wasActive) {
                btn.classList.add('active');
                currentLevelFilter = btn.dataset.level;
            } else {
                currentLevelFilter = null;
            }
            applyFilters();
        });

        // Search handler
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = e.target.value.trim();
                applyFilters();
            }, 200);
        });

        // Initialize
        loadTexts();
    </script>
</body>
</html>
